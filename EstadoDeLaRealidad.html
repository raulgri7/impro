<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IMPRO RETORCIDA - EL COLISIONADOR 🧬</title>
    <style>
        body { 
            background: #000; margin: 0; overflow: hidden; 
            color: #00ff41; font-family: 'Courier New', monospace;
        }
        #canvas-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #grid {
            position: absolute; width: 100%; height: 100%;
            background-image: radial-gradient(#113311 1px, transparent 1px);
            background-size: 40px 40px; opacity: 0.3;
        }
        #anomalia-display {
            z-index: 10; text-align: center; pointer-events: none;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #titulo { font-size: 0.8rem; letter-spacing: 10px; opacity: 0.5; margin-bottom: 20px; }
        #codigo { font-size: 5rem; font-weight: 900; text-transform: uppercase; line-height: 1; }
        #efecto { font-size: 1.5rem; color: #fff; margin-top: 20px; max-width: 600px; }

        #controles {
            position: fixed; bottom: 40px; width: 100%; display: flex; 
            justify-content: center; gap: 20px; z-index: 20;
        }
        button {
            background: transparent; border: 1px solid #00ff41; color: #00ff41;
            padding: 20px 40px; cursor: pointer; font-family: 'Courier New', monospace;
            text-transform: uppercase; font-size: 1rem; overflow: hidden;
            transition: 0.3s;
        }
        button:hover { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; }
        
        .vibrar { animation: v 0.1s infinite; }
        @keyframes v { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-1px, -2px); } 100% { transform: translate(1px, 2px); } }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="grid"></div>
        <div id="anomalia-display">
            <div id="titulo">ESTADO DE LA REALIDAD</div>
            <div id="codigo">ESTABLE</div>
            <div id="efecto">Mantened el contacto visual mínimo.</div>
        </div>
    </div>

    <div id="controles">
        <button onclick="colisionar()">ALTERAR CONSTANTE</button>
    </div>

    <script>
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';

        async function colisionar() {
            const display = document.getElementById('anomalia-display');
            const codigo = document.getElementById('codigo');
            const efecto = document.getElementById('efecto');
            
            display.classList.add('vibrar');
            codigo.innerText = "ERROR";
            
            const prompt = "Genera una 'Anomalía de Realidad' para teatro físico. No des órdenes de hablar. Da una limitación física retorcida o una fijación sensorial. Máximo 10 palabras. Formato: CODIGO: (Palabra impactante) | EFECTO: (La limitación). Ejemplo: CODIGO: PLOMO | EFECTO: Vuestras manos pesan 50 kilos cada una.";

            try {
                const res = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await res.json();
                const texto = data.candidates[0].content.parts[0].text.replace(/\*/g, '');
                const [cod, ef] = texto.split('|');

                codigo.innerText = cod.replace('CODIGO:', '').trim();
                efecto.innerText = ef.replace('EFECTO:', '').trim();

                // Cambio de color aleatorio para "retorcer" la vista
                const colores = ['#ff0041', '#00ff41', '#ffff00', '#00ffff'];
                document.documentElement.style.setProperty('--main', colores[Math.floor(Math.random()*colores.length)]);
                codigo.style.color = colores[Math.floor(Math.random()*colores.length)];

            } catch (err) {
                codigo.innerText = "REINICIO";
                efecto.innerText = "Vuestros cuerpos se repelen magnéticamente.";
            } finally {
                setTimeout(() => display.classList.remove('vibrar'), 500);
            }
        }
    </script>
</body>
</html>
