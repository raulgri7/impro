<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro de Improvisaci&oacute;n IA 🎭</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-main: #2c3e50;
            --color-accent: #27ae60;
            --color-highlight: #2980b9;
            --color-bg: #f4f7f6;
            --color-card-bg: #ffffff;
            --shadow-hover: 0 8px 15px rgba(0, 0, 0, 0.1); 
            --shadow-button: 0 4px 0 #1e8449;
            --color-print-button: #d35400;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Roboto', sans-serif; 
            padding: 20px; 
            max-width: 1200px;
            margin: 0 auto; 
            background-color: var(--color-bg); 
            color: var(--color-main);
            line-height: 1.5;
        }

        h1 { 
            color: var(--color-main); 
            margin-bottom: 10px; 
            text-align: center;
            font-size: 2.5em;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .instruccion-central {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 30px auto;
            color: #7f8c8d;
            font-style: italic;
        }

        .botones-container {
            display: flex;
            justify-content: center; 
            gap: 15px;
            margin-bottom: 40px;
        }

        button { 
            padding: 18px 35px; 
            background-color: var(--color-accent); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem;
            font-weight: 700;
            transition: all 0.2s ease; 
            box-shadow: var(--shadow-button); 
            text-transform: uppercase;
        }

        button:hover:not(:disabled) { background-color: #2ecc71; transform: translateY(-2px); }
        button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
        button:disabled { background-color: #bdc3c7; box-shadow: 0 4px 0 #95a5a6; cursor: not-allowed; }
        
        #boton-imprimir {
            background-color: var(--color-print-button);
            box-shadow: 0 4px 0 #a04000;
        }

        /* Cuadr&iacute;cula de Resultados */
        #resultado { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
            gap: 0; 
            border: 2px solid #bdc3c7;
            background-color: white;
        }

        /* Estilo Tarjeta Troquelada */
        .tarjeta-impro {
            padding: 30px;
            background-color: var(--color-card-bg);
            border-right: 2px dashed #bdc3c7; 
            border-bottom: 2px dashed #bdc3c7; 
            position: relative;
            min-height: 450px;
        }

        .tarjeta-titulo { 
            font-weight: 900;
            font-size: 1.5em;
            color: var(--color-highlight);
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 3px double #eee;
            padding-bottom: 10px;
        }

        .tarjeta-item { margin-bottom: 20px; }
        .tarjeta-item strong { 
            display: block;
            text-transform: uppercase;
            font-size: 0.8em;
            color: #95a5a6;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .dialogo-bloque { 
            background-color: #f9f9f9; 
            padding: 15px; 
            border-left: 4px solid var(--color-highlight);
            font-style: italic;
            font-size: 1.05em;
            color: #34495e;
            line-height: 1.6;
        }

        .dialogo-bloque span { display: block; margin-bottom: 5px; }

        .pautas-lista { 
            margin: 0;
            padding-left: 18px;
            color: #555;
        }

        .pautas-lista li { margin-bottom: 6px; }

        .extension-bloque {
            font-size: 0.9em;
            color: #7f8c8d;
            background: #eee;
            padding: 10px;
            border-radius: 6px;
        }

        #log-status {
            text-align: center;
            font-family: monospace;
            font-size: 0.9em;
            margin-top: 10px;
            color: #e67e22;
        }

        /* IMPRESI&Oacute;N */
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .noprint, button, h1, .instruccion-central, #log-status { display: none !important; }
            #resultado { 
                grid-template-columns: 1fr 1fr; 
                border: none;
            }
            .tarjeta-impro { 
                border: 1px dashed #000 !important; 
                break-inside: avoid;
                min-height: 18cm / 5; /* Aproximado para que quepan 10 en una hoja */
            }
        }

        @media (max-width: 800px) {
            #resultado { grid-template-columns: 1fr; }
            .tarjeta-impro { border-right: none; }
        }
    </style>
</head>
<body>

    <h1>Di&aacute;logo &Uacute;nico</h1>
    <p class="instruccion-central">Generador inteligente de escenarios para entrenamiento actoral e improvisaci&oacute;n.</p>
    
    <div class="botones-container">
        <button id="boton-generar" onclick="generarContenido()">Generar 6 Escenarios</button>
        <button id="boton-imprimir" style="display: none;" onclick="window.print()">Imprimir Tarjetas</button>
    </div>

    <div id="log-status"></div>
    
    <div id="resultado">
        <div style="grid-column: 1/-1; padding: 50px; text-align: center; color: #95a5a6;">
            Haz clic en el bot&oacute;n superior para iniciar la conexi&oacute;n con la IA.
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        async function generarContenido() {
            const btnGen = document.getElementById('boton-generar');
            const btnImp = document.getElementById('boton-imprimir');
            const resDiv = document.getElementById('resultado');
            const status = document.getElementById('log-status');

            btnGen.disabled = true;
            status.innerText = "Conectando con el Worker...";
            resDiv.innerHTML = '<div style="grid-column:1/-1; padding:50px; text-align:center;">Generando contenido... Por favor, espera.</div>';

		const prompt = `Actúa como un Maestro de Improvisación teatral. Genera 6 ejercicios de entrenamiento actoral. 
					
		REGLAS ESTRICTAS DE FORMATO:
		1. Usa exactamente este esquema para cada ejercicio:
		### EJERCICIO [N]
		Título: [Nombre creativo]
		Texto base:
		— [Frase corta]
		— [Frase corta]
		— [Frase corta]
		— [Frase corta]
		Objetivo: Profundizar en las circunstancias internas.
		Pautas:
		1. [Pauta de relación o urgencia de máximo 10 palabras]
		2. [Pauta de comportamiento o secreto de máximo 10 palabras]
		3. [Pauta de conflicto dramático de máximo 10 palabras]
		4. [Ubicación específica]
		Extensión opcional: improvisar el "antes" y el "después".

		2. Los diálogos deben ser secos y abiertos (estilo Pinter/Mamert) para que los actores los rellenen.
		3. Al menos 1 ejercicio debe ser para 3 personajes (A, B, C).
		4. No añadidas introducciones ni explicaciones extra.`;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, temp: 0.85 })
                });

                if (!response.ok) throw new Error("Error en la respuesta del servidor");

                const data = await response.json();
                const texto = data.candidates[0].content.parts[0].text;
                
                status.innerText = "Procesando tarjetas...";
                renderizarTarjetas(texto);
                
                btnImp.style.display = 'inline-block';
            } catch (error) {
                status.innerText = "Error: " + error.message;
                resDiv.innerHTML = '<div style="grid-column:1/-1; padding:50px; text-align:center; color:red;">No se pudo conectar con la IA. Revisa el Worker.</div>';
            } finally {
                btnGen.disabled = false;
            }
        }

function renderizarTarjetas(texto) {
            const resDiv = document.getElementById('resultado');
            resDiv.innerHTML = '';
            
            // CORRECCIÓN: Filtramos para eliminar bloques vacíos o muy cortos
            // y usamos una expresión regular para que no importe si hay espacios antes del primer ###
            const bloques = texto.split(/### EJERCICIO/).filter(b => b.trim().length > 20);

            bloques.forEach((bloque, index) => {
                const lineas = bloque.split('\n').map(l => l.trim()).filter(l => l !== '');
                
                let titulo = "Ejercicio " + (index + 1);
                let dialogo = [];
                let objetivo = "No especificado";
                let pautas = [];
                let extension = "No especificada";
                let etapa = "";

                lineas.forEach(l => {
                    // Normalizamos a minúsculas para comparar mejor pero mantenemos el valor
                    const lowerL = l.toLowerCase();
                    
                    if(lowerL.startsWith('título:') || lowerL.startsWith('titulo:')) {
                        titulo = l.split(':')[1].trim();
                    } else if(lowerL.startsWith('texto base:')) {
                        etapa = "dialogo";
                    } else if(lowerL.startsWith('objetivo:')) {
                        etapa = "obj";
                        objetivo = l.split(':')[1]?.trim() || "";
                    } else if(lowerL.startsWith('pautas:')) {
                        etapa = "pautas";
                    } else if(lowerL.startsWith('extensión opcional:') || lowerL.startsWith('extension opcional:')) {
                        extension = l.split(':')[1]?.trim() || "";
                    } else {
                        // Captura de diálogos
                        if(etapa === "dialogo" && (l.startsWith('—') || l.startsWith('-') || /^[ABC]:/.test(l))) {
                            dialogo.push(l);
                        }
                        // Captura de pautas numéricas
                        if(etapa === "pautas" && /^\d/.test(l)) {
                            pautas.push(l.replace(/^\d+\.\s*/, ''));
                        }
                    }
                });

                // Solo creamos la tarjeta si realmente hay contenido
                if (dialogo.length > 0) {
                    const card = document.createElement('div');
                    card.className = 'tarjeta-impro';
                    card.innerHTML = `
                        <div class="tarjeta-titulo">${titulo}</div>
                        <div class="tarjeta-item">
                            <strong>Texto Base</strong>
                            <div class="dialogo-bloque">${dialogo.map(d => `<span>${d}</span>`).join('')}</div>
                        </div>
                        <div class="tarjeta-item">
                            <strong>Objetivo</strong>
                            <span>${objetivo}</span>
                        </div>
                        <div class="tarjeta-item">
                            <strong>Pautas</strong>
                            <ul class="pautas-lista">${pautas.map(p => `<li>${p}</li>`).join('')}</ul>
                        </div>
                        <div class="tarjeta-item">
                            <strong>Reto Final</strong>
                            <div class="extension-bloque">${extension}</div>
                        </div>
                    `;
                    resDiv.appendChild(card);
                }
            });
        }
    </script>

    <div class="noprint" style="text-align: center; margin-top: 40px; padding-bottom: 40px;">
        <hr style="border: 0; border-top: 1px solid #ccc; margin-bottom: 20px;">
        <a href="index.html" style="text-decoration:none; color:#7f8c8d; font-weight:bold; border:1px solid #ccc; padding:10px 20px; border-radius:8px;">
            ← Volver al Men&uacute; Principal
        </a>
    </div>

</body>
</html>
