<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Bomba 💣 - Juego de Palabras</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            touch-action: manipulation;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111;
            color: #fff;
            height: 100vh;
            height: 100svh; /* Ajuste exacto al espacio visible del navegador */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 15px;
            text-align: center;
            user-select: none;
            overflow: hidden;
            gap: 15px;
        }

        .tablero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        .bomba-icon {
            font-size: clamp(4rem, 12vh, 7rem);
            transition: transform 0.1s ease;
            filter: drop-shadow(0 0 20px rgba(255, 68, 68, 0.2));
            line-height: 1;
        }

        .activa {
            animation: latido 0.8s infinite alternate ease-in-out;
        }

        @keyframes latido {
            from { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 68, 68, 0.4)); }
            to { transform: scale(1.15); filter: drop-shadow(0 0 50px rgba(255, 0, 0, 0.8)); }
        }

        .regla-box {
            font-size: clamp(1.1rem, 3.2vh, 1.8rem);
            font-weight: 700;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: #222;
            padding: 8px 24px;
            border-radius: 50px;
            border: 2px solid #333;
            max-width: 90vw;
            word-break: break-word;
        }

        .silaba-box {
            font-size: clamp(3.5rem, 13vh, 7.5rem);
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 5px 20px rgba(255,255,255,0.2);
            line-height: 1.1;
            max-width: 95vw;
            word-break: break-word;
        }

        /* Ajuste de tamaño específico para textos largos al explotar */
        .silaba-box.explosion-texto {
            font-size: clamp(2.2rem, 8vh, 4.5rem);
            color: #ffeb3b;
        }

        .btn-bomba {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.4rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.1s ease;
            width: 100%;
            max-width: 340px;
        }

        .btn-bomba:active {
            transform: scale(0.95);
        }

        .explosion {
            background-color: #900 !important;
            animation: sacudida 0.1s infinite;
        }

        @keyframes sacudida {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            20% { transform: translate(-3px, -3px) rotate(-1deg); }
            40% { transform: translate(-3px, 3px) rotate(1deg); }
            60% { transform: translate(3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -2px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        /* RESPONSIVE EN PANTALLA HORIZONTAL (LANDSCAPE) */
        @media (orientation: landscape) {
            body {
                flex-direction: row;
                justify-content: space-evenly;
                padding: 10px 20px;
                gap: 20px;
            }
            .tablero {
                flex-direction: row;
                width: auto;
                gap: 20px;
            }
            .bomba-icon {
                font-size: clamp(3.5rem, 20vh, 6rem);
            }
            .silaba-box {
                font-size: clamp(3rem, 18vh, 5.5rem);
            }
            .silaba-box.explosion-texto {
                font-size: clamp(2rem, 12vh, 3.5rem);
            }
            .regla-box {
                font-size: clamp(1rem, 5vh, 1.5rem);
                padding: 6px 16px;
            }
            .btn-bomba {
                width: auto;
                min-width: 240px;
                padding: 12px 25px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="tablero">
        <div id="bomba" class="bomba-icon">💣</div>
        <div id="regla" class="regla-box">PULSA PARA ACTIVAR</div>
        <div id="silaba" class="silaba-box">--</div>
    </div>

    <button id="btn" class="btn-bomba" onclick="toggleBomba()">¡INICIAR BOMBA!</button>

    <script>
        const silabas = [
            "AR", "MA", "CA", "PA", "TO", "LA", "EN", "DE", "TE", "TR",
            "BAR", "CON", "PAR", "MAR", "COR", "PER", "CAR", "SAN", "BAL", "PIS",
            "RO", "RE", "CI", "ME", "BO", "GA", "FA", "LIS", "TER", "VAL",
            "BLA", "CLU", "DRA", "FLA", "FRA", "GLO", "GRA", "PLA", "PRI", "PRO",
            "ESP", "EST", "MON", "RES", "SOL", "TAL", "VER", "ZAR", "CRU", "PRE"
        ];

        const reglas = [
            "EMPIEZA POR",
            "CONTIENE",
            "ACABA EN"
        ];

        let temporizador = null;
        let intervaloSonido = null;
        let estaActiva = false;
        let audioCtx = null;

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
        }

        function sonarTic() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch (e) {
                console.error("Error al reproducir el tic:", e);
            }
        }

        function sonarBoom() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (e) {
                console.error("Error al reproducir el boom:", e);
            }
        }

        async function toggleBomba() {
            await initAudio();

            if (estaActiva) {
                desactivarBomba();
            } else {
                iniciarBomba();
            }
        }

        function iniciarBomba() {
            estaActiva = true;
            document.body.classList.remove('explosion');

            const silabaElemento = document.getElementById('silaba');
            silabaElemento.classList.remove('explosion-texto');

            const silabaRandom = silabas[Math.floor(Math.random() * silabas.length)];
            const reglaRandom = reglas[Math.floor(Math.random() * reglas.length)];

            silabaElemento.innerText = silabaRandom;
            document.getElementById('regla').innerText = reglaRandom;
            document.getElementById('bomba').classList.add('activa');
            document.getElementById('bomba').innerText = '💣';
            document.getElementById('btn').innerText = 'REINICIAR';
            document.getElementById('btn').style.background = '#555';

            const tiempoTotalMs = Math.floor(Math.random() * (60000 - 15000 + 1)) + 15000;

            sonarTic();
            intervaloSonido = setInterval(sonarTic, 800);

            temporizador = setTimeout(() => {
                explotar();
            }, tiempoTotalMs);
        }

        function explotar() {
            clearInterval(intervaloSonido);
            sonarBoom();

            const silabaElemento = document.getElementById('silaba');
            silabaElemento.classList.add('explosion-texto');

            document.getElementById('bomba').classList.remove('activa');
            document.getElementById('bomba').innerText = '💥';
            document.getElementById('regla').innerText = '¡¡BOOOOM!!';
            silabaElemento.innerText = '¡PERDISTE!';
            document.body.classList.add('explosion');

            document.getElementById('btn').innerText = '¡JUGAR DE NUEVO!';
            document.getElementById('btn').style.background = '#e74c3c';
            estaActiva = false;
        }

        function desactivarBomba() {
            clearTimeout(temporizador);
            clearInterval(intervaloSonido);
            document.getElementById('bomba').classList.remove('activa');
            document.body.classList.remove('explosion');
            estaActiva = false;
            iniciarBomba();
        }

        // Previene el zoom por doble toque rápido en móviles
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                toggleBomba();
            }
        });
    </script>
</body>
</html>
