<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Clase de Improvisación</title>
    <style>
        :root {
            --primary: #4285f4;
            --primary-dark: #1a73e8;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
            --text-light: #5f6368;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2.2em;
            margin-bottom: 10px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 15px;
            text-align: center;
        }

        p.intro {
            color: var(--text-light);
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1em;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-dark);
            margin-top: 15px;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            outline: none;
        }

        button {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(66, 133, 244, 0.3);
            margin-top: 20px;
        }

        button:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(66, 133, 244, 0.4);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #resultado {
            margin-top: 40px;
            padding: 25px;
            border-radius: 12px;
            background-color: #fafafa;
            border: 1px solid #e0e0e0;
            min-height: 200px;
            line-height: 1.6;
        }

        #resultado pre {
            font-family: 'Segoe UI', sans-serif;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-size: 1.05em;
        }

        .loading {
            text-align: center;
            color: var(--primary);
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .back-button-container {
            margin: 30px 0;
        }

        .back-button-container a {
            text-decoration: none;
            color: var(--text-light);
            font-weight: bold;
            padding: 12px 25px;
            border: 2px solid #ddd;
            border-radius: 30px;
            transition: all 0.3s;
        }

        .back-button-container a:hover {
            background-color: #eee;
            border-color: #bbb;
        }

        @media (max-width: 600px) {
            .container { padding: 25px 15px; border-radius: 0; }
            h1 { font-size: 1.7em; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎭 Plan de Clase con IA</h1>
        <p class="intro">Diseña una sesión de improvisación profesional en segundos.</p>

        <form id="claseForm">
            <label for="duracion">Duración total (minutos):</label>
            <input type="number" id="duracion" value="90" min="30" max="180" required>

            <label for="enfoque">Enfoque pedagógico:</label>
            <select id="enfoque">
                <option value="Aceptación y Sí-Y">Aceptación y "Sí-Y"</option>
                <option value="Construcción de Personajes">Construcción de Personajes</option>
                <option value="Emociones y Conexión">Emociones y Conexión</option>
                <option value="Narrativa y Estructura">Narrativa y Estructura</option>
                <option value="Escucha Activa">Escucha Activa y Reacción</option>
            </select>
                        
            <label for="participantes">Número de alumnos:</label>
            <input type="number" id="participantes" value="10" min="4" max="25" required>

            <button type="submit" id="btn-generar">Generar Plan de Clase</button>
        </form>

        <div id="resultado">
            <h2 style="text-align: center; color: #999; font-weight: normal;">Los detalles de la clase aparecerán aquí...</h2>
        </div>
    </div>
    
    <div class="back-button-container">
        <a href="index.html">← Volver al Menú Principal</a>
    </div>

    <script>
        const form = document.getElementById('claseForm');
        const resultadoDiv = document.getElementById('resultado');
        const btnGenerar = document.getElementById('btn-generar');

        // Plantilla del prompt integrada para evitar errores de carga de archivos externos
        const PROMPT_TEMPLATE = `Eres un profesor experto en improvisación teatral. 
        Diseña un plan de clase detallado para un grupo de principiantes.
        
        PARÁMETROS:
        - Duración: {duracion} minutos.
        - Enfoque: {enfoque}.
        - Participantes: {participantes} personas.

        ESTRUCTURA DEL PLAN:
        1. Calentamiento (Check-in y ejercicios físicos/mentales).
        2. Ejercicios Principales (Relacionados directamente con el enfoque).
        3. Aplicación en Escenas (Cómo llevar lo aprendido a la impro).
        4. Cierre y Feedback.

        Sé específico, explica brevemente cada ejercicio y distribuye los tiempos de forma lógica. 
        Usa un tono motivador y profesional.`;

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            generarClase();
        });

        async function generarClase() {
            const duracion = document.getElementById('duracion').value;
            const enfoque = document.getElementById('enfoque').value;
            const participantes = document.getElementById('participantes').value;

            // Bloquear botón y mostrar carga
            btnGenerar.disabled = true;
            resultadoDiv.innerHTML = '<div class="loading">⚙️ El oráculo pedagógico está redactando tu plan...</div>';

            // Preparar el prompt final
            const promptFinal = PROMPT_TEMPLATE
                .replace('{duracion}', duracion)
                .replace('{participantes}', participantes)
                .replace('{enfoque}', enfoque);

            try {
                const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptFinal,
                        temp: 0.7 // Temperatura equilibrada para que sea creativo pero estructurado
                    })
                });

                if (!response.ok) throw new Error('Error al conectar con el servidor');

                const data = await response.json();
                const contenido = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No se recibió respuesta del oráculo.';

                // Limpiar asteriscos de formato Markdown que a veces envía la IA
                const textoLimpio = contenido.replace(/\*\*/g, '').replace(/###/g, '');

                resultadoDiv.innerHTML = `<pre>${textoLimpio}</pre>`;

            } catch (error) {
                console.error(error);
                resultadoDiv.innerHTML = `<h2 style="color:#d93025; text-align:center;">⚠️ Error</h2><p style="text-align:center;">No se pudo conectar con el servicio. Revisa tu conexión o el estado del Worker.</p>`;
            } finally {
                btnGenerar.disabled = false;
            }
        }
    </script>
</body>
</html>
