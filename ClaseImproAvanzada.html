<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Clase de Improvisación</title>
    <style>
        :root {
            --primary: #4285f4;
            --primary-dark: #1a73e8;
            --secondary: #4CAF50;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            text-align: center;
        }

        p.instruccion {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
        }

        /* Grid de Asistencia */
        .asistencia-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #fafafa;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            background: white;
            border: 1px solid #eee;
            transition: all 0.2s;
            font-size: 0.9em;
        }

        .checkbox-item:hover {
            background-color: #f0f7ff;
            border-color: var(--primary);
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 10px;
            accent-color: #d93025; /* Color rojo para marcar ausencia */
        }

        label.seccion-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-dark);
            margin-top: 20px;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
        }

        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.98); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        /* Resultados */
        #resultado {
            margin-top: 30px;
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: #fff;
            text-align: left;
            min-height: 200px;
            line-height: 1.7;
        }

        .result-subtitle { color: var(--primary-dark); border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 25px; }
        .loading { text-align: center; color: var(--primary); font-weight: bold; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .btn-volver {
            text-decoration: none;
            color: #5f6368;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: background 0.3s;
            display: inline-block;
            margin-top: 20px;
        }
        .btn-volver:hover { background-color: #eee; }

        @media (max-width: 600px) {
            .asistencia-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🧠 Plan de Clase Personalizado</h1>
        <p class="instruccion">Marca a los alumnos que están <strong>AUSENTES</strong>. El plan se adaptará a los presentes.</p>

        <form id="claseForm">
            <label class="seccion-label">❌ Marcar Ausentes:</label>
            <div id="listaAlumnosPresentes" class="asistencia-grid"></div>

            <label class="seccion-label" for="tipoClase">Tipo de Clase / Bloque:</label>
            <select id="tipoClase" required>
                <option value="Bloque 1: Calentamiento primer día">Bloque 1: Calentamiento Día 1</option>
                <option value="Bloque 2: Foco y Grupo (Círculo)">Bloque 2: Foco y Grupo (Círculo)</option>
                <option value="Bloque 3: Movimiento y Espacio">Bloque 3: Movimiento y Espacio</option>
                <option value="Bloque 4: Juegos en Pareja">Bloque 4: Juegos de Impro (Parejas)</option>
                <option value="Bloque 5: Juegos en Tríos">Bloque 5: Juegos de Impro (Tríos)</option>
                <option value="Bloque 8: Grupo entero">Bloque 8: Juegos de Impro (Grupo Entero)</option>
                <option value="Clase completa (120 min) con Hilo Conductor" selected>Clase Completa (120 min) con Hilo Conductor</option>
            </select>
            
            <label class="seccion-label">Conteo de alumnos PRESENTES:</label>
            <input type="number" id="alumnosPresentesCount" value="0" readonly style="width: 80px; text-align: center; margin-bottom: 20px; border: none; background: transparent; font-size: 1.2em; font-weight: bold; color: var(--secondary);">

            <label class="seccion-label" for="instruccionesAdicionales">➕ Instrucciones Adicionales (Opcional):</label>
            <textarea id="instruccionesAdicionales" placeholder="Ej: 'Foco en escucha activa', 'Evitar contacto físico', 'Mucha energía'."></textarea>

            <button type="submit" id="btnGenerar">Generar Plan de Clase con IA</button>
        </form>

        <div id="resultado">
            <p style="text-align: center; color: #999;">El plan aparecerá aquí después de analizar los perfiles de los asistentes.</p>
        </div>
    </div>

    <a href="index.html" class="btn-volver">← Volver al Menú Principal</a>

    <script>
        const ALUMNOS_LUNES = [
            { nombre: "Alba", inicial: "Al", caracteristicas: "Muy seca, novata, no suma, le cuesta soltarse." },
            { nombre: "Andrea", inicial: "An", caracteristicas: "Mucho morro, buena dicción, echada para alante." },
            { nombre: "Beatriz Law", inicial: "BeL", caracteristicas: "Tímida, va a remolque, necesita empoderamiento." },
            { nombre: "Beatriz", inicial: "Be", caracteristicas: "Falta rodaje, enfoque visual." },
            { nombre: "Elena", inicial: "El", caracteristicas: "Muy buena, disfruta y propone, debe creer más en sí misma." },
            { nombre: "Estela", inicial: "Es", caracteristicas: "Hipertímida, se sale del personaje, necesita estructura." },
            { nombre: "Jesús", inicial: "Je", caracteristicas: "Novato, potencial desconocido." },
            { nombre: "Lucía", inicial: "Lu", caracteristicas: "Tímida, foco en escucha y cuerpo." },
            { nombre: "Marta", inicial: "Ma", caracteristicas: "Buenísima, propone ideas, suma mucho." },
            { nombre: "María", inicial: "MaC", caracteristicas: "Extraña, no vocaliza bien, necesita claridad." },
            { nombre: "Patricia", inicial: "Pa", caracteristicas: "Continuidad, progresión constante." },
            { nombre: "Raquel", inicial: "Ra", caracteristicas: "Morro y buenas ideas, tiende a liderar." },
            { nombre: "Victoria", inicial: "Vi", caracteristicas: "Disfruta, debe atreverse a fallar más." },
            { nombre: "Yolanda", inicial: "Yo", caracteristicas: "Vis cómica genial, energía alta." }
        ];

        const listaAlumnosDiv = document.getElementById('listaAlumnosPresentes');
        const alumnosCountInput = document.getElementById('alumnosPresentesCount');
        const resultadoDiv = document.getElementById('resultado');
        const btnGenerar = document.getElementById('btnGenerar');

        function generarListaAsistencia() {
            ALUMNOS_LUNES.forEach(alumno => {
                const label = document.createElement('label');
                label.className = 'checkbox-item';
                label.innerHTML = `<input type="checkbox" value="${alumno.nombre}"> ${alumno.nombre}`;
                label.querySelector('input').addEventListener('change', actualizarConteo);
                listaAlumnosDiv.appendChild(label);
            });
            actualizarConteo();
        }

        function actualizarConteo() {
            const ausentes = Array.from(listaAlumnosDiv.querySelectorAll('input:checked')).length;
            alumnosCountInput.value = ALUMNOS_LUNES.length - ausentes;
        }

        function markdownToHtml(text) {
            return text
                .replace(/^## (.*$)/gim, '<h2 class="result-subtitle">$1</h2>')
                .replace(/^### (.*$)/gim, '<h3 style="color:#4285f4; margin-top:15px;">$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/^- (.*$)/gim, '<li>$1</li>')
                .replace(/\n/g, '<br>');
        }

        async function generarClase(e) {
            e.preventDefault();
            
            const ausentesNombres = Array.from(listaAlumnosDiv.querySelectorAll('input:checked')).map(cb => cb.value);
            const presentes = ALUMNOS_LUNES.filter(a => !ausentesNombres.includes(a.nombre));
            
            if (presentes.length === 0) {
                alert("¡No puedes dar clase a una sala vacía!");
                return;
            }

            const perfilesTexto = presentes.map(p => `- ${p.nombre} (${p.inicial}): ${p.caracteristicas}`).join('\n');
            const tipoClase = document.getElementById('tipoClase').value;
            const extras = document.getElementById('instruccionesAdicionales').value;

            btnGenerar.disabled = true;
            resultadoDiv.innerHTML = '<div class="loading">🧠 Analizando perfiles y diseñando ejercicios adaptados...</div>';

            const promptFinal = `Actúa como un Impro Coach experto. Diseña un plan de clase de improvisación.
            
            ALUMNOS PRESENTES (${presentes.length}):
            ${perfilesTexto}

            OBJETIVO/TIPO DE CLASE: ${tipoClase}
            INSTRUCCIONES EXTRA: ${extras}

            REQUISITOS DEL PLAN:
            1. Adapta los ejercicios a las debilidades y fortalezas mencionadas en los perfiles.
            2. Estructura: Calentamiento, Ejercicios de Técnica, Escenas/Juegos y Cierre.
            3. Indica por qué eliges ciertos ejercicios para estos alumnos específicos.
            4. Usa un tono profesional pero inspirador.`;

            try {
                const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptFinal, temp: 0.7 })
                });

                const data = await response.json();
                const contenido = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error en la respuesta.";
                
                resultadoDiv.innerHTML = markdownToHtml(contenido);
            } catch (error) {
                resultadoDiv.innerHTML = "<p style='color:red;'>Error al conectar con el Worker. Inténtalo de nuevo.</p>";
            } finally {
                btnGenerar.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', generarListaAsistencia);
        document.getElementById('claseForm').addEventListener('submit', generarClase);
    </script>
</body>
</html>
