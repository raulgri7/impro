<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Narraciones de Movimiento</title>
    <style>
        :root {
            --primary: #2563eb;
            --accent: #d946ef;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
            background-color: var(--bg); 
            color: var(--text);
            line-height: 1.6;
        }

        h1 { 
            color: var(--text); 
            text-align: center;
            border-bottom: 3px solid var(--primary); 
            padding-bottom: 15px; 
            margin-bottom: 20px;
            font-size: 2.2rem;
            letter-spacing: -1px;
        }

        .instruccion { 
            color: #94a3b8; 
            margin-bottom: 30px; 
            font-style: italic; 
            text-align: center;
            font-size: 1.1rem;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        button { 
            padding: 16px 35px; 
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); 
        }

        button:hover { 
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4);
        }

        button:active { transform: translateY(1px); }
        
        #resultado { 
            margin-top: 20px; 
            padding: 30px; 
            background-color: var(--card-bg);
            border-radius: 20px; 
            min-height: 300px; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }

        pre { 
            font-family: 'Georgia', serif; 
            margin: 0; 
            padding: 0; 
            white-space: pre-wrap; 
            font-size: 1.25rem; 
            line-height: 1.9;
            color: #e2e8f0;
            text-align: justify;
        }

        .cargando { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: var(--primary); 
            font-weight: bold; 
            font-size: 1.2rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #334155;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .error-msg {
            color: #ef4444;
            background: #450a0a;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #ef4444;
        }

        .nav-footer {
            text-align: center;
            margin-top: 50px;
            padding-bottom: 30px;
        }

        .nav-footer a {
            text-decoration: none;
            color: #64748b;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #334155;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .nav-footer a:hover {
            background: #1e293b;
            color: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <h1>&#128217; Guion de Viaje Estresante e Inm&oacute;vil</h1>
    <p class="instruccion">Viaje imaginario fren&eacute;tico para realizar con los ojos cerrados y el cuerpo inm&oacute;vil. Enfoque en la percepci&oacute;n interna.</p>
    
    <div class="controls">
        <button onclick="generarContenido()">Generar Narraci&oacute;n</button>
    </div>
    
    <div id="resultado">
        <div style="text-align: center; color: #475569; padding-top: 100px;">
            El guion aparecer&aacute; aqu&iacute;...
        </div>
    </div>

    <div class="nav-footer">
        <a href="index.html">&larr; Volver al Men&uacute; Principal</a>
    </div>

    <script>
        // URL de tu Cloudflare Worker
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        function construirPromptNarracion() {
            return `**INSTRUCCI&Oacute;N ESTRICTA:** Genera &Uacute;NICAMENTE el texto narrativo completo en espa&ntilde;ol. No a&ntilde;adas introducciones ni t&iacute;tulos.
            **OBJETIVO:** Viaje imaginario de 3 a 5 minutos para provocar frenes&iacute;, estr&eacute;s y claustrofobia. El oyente tiene los ojos cerrados y est&aacute; inm&oacute;vil.
            **CRITERIOS:**
            1. Segunda persona (tuteo).
            2. Ritmo acelerado, frases cortas, peligro inminente.
            3. Foco sensorial interno: pulso, respiraci&oacute;n, calor, presi&oacute;n.
            4. Movimiento mental forzado (ca&iacute;da, rotaci&oacute;n, aceleraci&oacute;n).
            5. Espacios cerrados: t&uacute;neles, maquinaria, pasillos industriales.
            6. Inicia indicando la Duraci&oacute;n aproximada al principio.`;
        }

        async function generarContenido() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `
                <div class="cargando">
                    <div class="spinner"></div>
                    <span>Invocando sensaciones...</span>
                </div>`;
            
            const prompt = construirPromptNarracion();
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: prompt,
                        temp: 0.9 
                    })
                });

                if (!response.ok) throw new Error('Error al conectar con el servidor.');

                const data = await response.json();
                
                // Asumiendo que el Worker devuelve la estructura de Gemini o un campo 'text'
                let textoGenerado = "";
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    textoGenerado = data.candidates[0].content.parts[0].text.trim();
                } else if (data.text) {
                    textoGenerado = data.text;
                } else {
                    throw new Error('Estructura de respuesta inesperada.');
                }

                resultadoDiv.innerHTML = `<pre>${textoGenerado}</pre>`;

            } catch (error) {
                resultadoDiv.innerHTML = `
                    <div class="error-msg">
                        <strong>&#9888; Error Cr&iacute;tico:</strong> ${error.message}<br><br>
                        Verifica que el Worker est&eacute; activo y configurado correctamente.
                    </div>`;
            }
        }
    </script>
</body>
</html>
