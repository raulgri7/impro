<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pictionary Express ✏️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            user-select: none;
            overflow-x: hidden;
            gap: 10px;
        }

        h1 {
            font-size: clamp(1.2rem, 3.5vh, 1.8rem);
            letter-spacing: 1.5px;
            color: #ccc;
            text-transform: uppercase;
            text-align: center;
        }

        .card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .btn {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #444;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #ffffff;
            color: #121212;
            border: none;
        }

        .btn-secondary {
            background: #333;
            color: #ffcc00;
            border-color: #ffcc00;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .palabra-display {
            font-size: clamp(1.8rem, 5vh, 2.5rem);
            font-weight: 800;
            color: #ffcc00;
            margin: 10px 0;
            word-break: break-word;
        }

        /* CONTENEDOR DEL LIENZO Y HERRAMIENTAS MAXIMIZADO */
        .canvas-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            height: 100svh;
            justify-content: space-between;
            padding: 5px 0;
        }

        canvas {
            background-color: #ffffff;
            border-radius: 12px;
            border: 3px solid #444;
            cursor: crosshair;
            touch-action: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            width: 100%;
            flex-grow: 1;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #333;
            gap: 6px;
        }

        .color-palette {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #555;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .color-btn.active {
            transform: scale(1.15);
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            color: #fff;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-undo {
            background: #d35400;
        }

        .btn-clear {
            background: #c0392b;
        }

        .status-badge {
            font-size: 0.75rem;
            color: #888;
            margin-top: -5px;
        }
    </style>
</head>
<body>

    <h1 id="main-title">Pictionary Express ✏️</h1>

    <!-- PANTALLA 1: BOTÓN INICIAL -->
    <div id="screen-start" class="card">
        <p style="color: #aaa;">Listos para jugar en grupo o parejas casuales</p>
        <button class="btn btn-primary" onclick="mostrarPalabra()">Nueva palabra</button>
        <div id="status-cargando" class="status-badge">Preparando palabras... 🧠</div>
    </div>

    <!-- PANTALLA 2: SELECCIÓN DE PALABRA -->
    <div id="screen-word" class="card" style="display: none;">
        <div style="font-size: 0.9rem; color: #888;">Tu palabra para dibujar es:</div>
        <div id="word-display" class="palabra-display">---</div>
        
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="otraPalabra()">Otra 🔄</button>
            <button class="btn btn-primary" onclick="empezarAProyectar()">Dibujar 🎨</button>
        </div>
    </div>

    <!-- PANTALLA 3: PAD DE DIBUJO MAXIMIZADO -->
    <div id="screen-canvas" class="canvas-container">
        <!-- Panel de 5 colores + Deshacer + Borrar -->
        <div class="controls-panel">
            <div class="color-palette">
                <div class="color-btn active" style="background-color: #000000;" onclick="setColor('#000000', this)"></div>
                <div class="color-btn" style="background-color: #e74c3c;" onclick="setColor('#e74c3c', this)"></div>
                <div class="color-btn" style="background-color: #2ecc71;" onclick="setColor('#2ecc71', this)"></div>
                <div class="color-btn" style="background-color: #3498db;" onclick="setColor('#3498db', this)"></div>
                <div class="color-btn" style="background-color: #f1c40f;" onclick="setColor('#f1c40f', this)"></div>
            </div>

            <div class="action-btns">
                <button class="btn-action btn-undo" onclick="deshacerUltimoTrazo()">↩ Deshacer</button>
                <button class="btn-action btn-clear" onclick="limpiarLienzo()">Borrar</button>
            </div>
        </div>

        <!-- El Lienzo Canvas -->
        <canvas id="paint-pad"></canvas>

        <button class="btn btn-primary" onclick="reiniciarJuego()">Nueva palabra 🔄</button>
    </div>

            pedirLotePalabrasIA();
            configurarEventosDibujo();
        };

            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            limpiarLienzo();
        }
