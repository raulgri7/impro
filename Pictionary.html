<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pictionary Express ✏️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            user-select: none;
            overflow-x: hidden;
            gap: 10px;
        }

        h1 {
            font-size: clamp(1.2rem, 3.5vh, 1.8rem);
            letter-spacing: 1.5px;
            color: #ccc;
            text-transform: uppercase;
            text-align: center;
        }

        .card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            text-align: center;
        }

        .btn {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #444;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: #ffffff;
            color: #121212;
            border: none;
        }

        .btn-secondary {
            background: #333;
            color: #ffcc00;
            border-color: #ffcc00;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .palabra-display {
            font-size: clamp(1.8rem, 5vh, 2.5rem);
            font-weight: 800;
            color: #ffcc00;
            margin: 10px 0;
            word-break: break-word;
        }

        .canvas-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            height: 100svh;
            justify-content: space-between;
            padding: 5px 0;
        }

        canvas {
            background-color: #ffffff;
            border-radius: 12px;
            border: 3px solid #444;
            cursor: crosshair;
            touch-action: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            width: 100%;
            flex-grow: 1;
        }

        .controls-panel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            background: #1e1e1e;
            padding: 8px 10px;
            border-radius: 12px;
            border: 1px solid #333;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .round-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #555;
            cursor: pointer;
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #fff;
            flex-shrink: 0;
            background-color: #2a2a2a;
        }

        .round-btn:active {
            transform: scale(0.9);
        }

        .round-btn.active {
            transform: scale(1.15);
            border-color: #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .status-badge {
            font-size: 0.75rem;
            color: #888;
            margin-top: -5px;
        }
    </style>
</head>
<body>

    <h1 id="main-title">Pictionary Express ✏️</h1>

    <!-- PANTALLA 1 -->
    <div id="screen-start" class="card">
        <p style="color: #aaa;">Listos para jugar en grupo o parejas casuales</p>
        <button class="btn btn-primary" onclick="mostrarPalabra()">Nueva palabra</button>
        <div id="status-cargando" class="status-badge">Conectando con IA... ⏳</div>
    </div>

    <!-- PANTALLA 2 -->
    <div id="screen-word" class="card" style="display: none;">
        <div style="font-size: 0.9rem; color: #888;">Tu palabra para dibujar es:</div>
        <div id="word-display" class="palabra-display">---</div>
        
        <div class="btn-group">
            <button class="btn btn-secondary" onclick="otraPalabra()">Otra 🔄</button>
            <button class="btn btn-primary" onclick="empezarAProyectar()">Dibujar 🎨</button>
        </div>
    </div>

    <!-- PANTALLA 3 -->
    <div id="screen-canvas" class="canvas-container">
        <div class="controls-panel">
            <div class="round-btn active" style="background-color: #000000;" onclick="setColor('#000000', this)"></div>
            <div class="round-btn" style="background-color: #e74c3c;" onclick="setColor('#e74c3c', this)"></div>
            <div class="round-btn" style="background-color: #3498db;" onclick="setColor('#3498db', this)"></div>
            <div class="round-btn" style="background-color: #f1c40f;" onclick="setColor('#f1c40f', this)"></div>
            
            <div class="round-btn" style="background-color: #ffffff; color: #000;" title="Goma" onclick="setColor('#ffffff', this)">🧹</div>
            <div class="round-btn" style="background-color: #d35400;" title="Deshacer" onclick="deshacerUltimoTrazo()">↩</div>
            <div class="round-btn" style="background-color: #c0392b;" title="Borrar lienzo" onclick="limpiarLienzo()">🗑️</div>
        </div>

        <canvas id="paint-pad"></canvas>

        <button class="btn btn-primary" onclick="reiniciarJuego()">Nueva palabra 🔄</button>
    </div>

    <script>
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';

        // 100 PALABRAS INICIALES (Sólo respaldo offline/arranque)
        const palabrasIniciales = [
            "Sol", "Casa", "Árbol", "Coche", "Gato", "Perro", "Flor", "Luna", "Manzana", "Barco",
            "Avión", "Reloj", "Estrella", "Pez", "Pájaro", "Silla", "Mesa", "Lápiz", "Libro", "Teléfono",
            "Pelota", "Sombrero", "Zapatos", "Taza", "Cuchara", "Tenedor", "Cama", "Puerta", "Ventana", "Corazón",
            "Llave", "Paraguas", "Campana", "Ojo", "Mano", "Pie", "Caramelo", "Tarta", "Helado", "Queso",
            "Plátano", "Fresa", "Sombra", "Nube", "Lluvia", "Fuego", "Montaña", "Río", "Mar", "Isla",
            "Castillo", "Corona", "Moneda", "Bolsa", "Botella", "Vaso", "Cuchillo", "Peine", "Cepillo", "Tijeras",
            "Guitarra", "Tambor", "Pintura", "Pincel", "Caja", "Carta", "Regalo", "Globo", "Cometa", "Bicicleta",
            "Tren", "Camión", "Autobús", "Semáforo", "Puente", "Escalera", "Martillo", "Clavo", "Sierra", "Anillo",
            "Gafas", "Botón", "Cremallera", "Cinturón", "Calcetín", "Pantalón", "Camiseta", "Chaqueta", "Guante", "Mariposa",
            "Abeja", "Araña", "Serpiente", "Rana", "Tortuga", "Caracol", "Ratón", "Elefante", "León"
        ];

        let bancoIA = []; // Banco exclusivo de la IA
        let palabrasUsadas = [];
        let pidiendoIA = false;
        let palabraSeleccionada = "";

        // Canvas
        const canvas = document.getElementById('paint-pad');
        const ctx = canvas.getContext('2d');
        let dibujando = false;
        let colorActual = '#000000';
        const GROSOR_FINO = 3;
        let historialTrazos = [];

        window.addEventListener('DOMContentLoaded', () => {
            configurarEventosDibujo();
            pedirLotePalabrasIA();
        });

        function ajustarResolucionCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            limpiarLienzo();
        }

        async function pedirLotePalabrasIA() {
            if (pidiendoIA) return;
            pidiendoIA = true;

            const prompt = `Genera un lote de 20 palabras o conceptos variados e intuitivos para jugar al Pictionary (objetos, animales, profesiones, acciones o lugares sencillos de representar visualmente).
            ${palabrasUsadas.length > 0 ? `NO utilices NINGUNA de las siguientes palabras ya usadas: ${palabrasUsadas.join(', ')}.` : ''}
            
            Devuelve ÚNICAMENTE un array JSON válido de cadenas de texto (sin Markdown, sin explicaciones):
            ["Palabra 1", "Palabra 2", "Palabra 3", ...]`;

            try {
                const response = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const nuevasPalabras = JSON.parse(rawText);
                
                if (Array.isArray(nuevasPalabras) && nuevasPalabras.length > 0) {
                    const filtradas = nuevasPalabras.filter(p => !palabrasUsadas.includes(p));
                    bancoIA.push(...filtradas);
                    document.getElementById('status-cargando').innerText = `IA conectada 🤖 (${bancoIA.length} palabras)`;
                }
            } catch (e) {
                console.error("Error cargando lote de la IA:", e);
                document.getElementById('status-cargando').innerText = "Modo offline (lista local) 📦";
            } finally {
                pidiendoIA = false;
            }
        }

        function registrarPalabraUsada(palabra) {
            if (palabra && !palabrasUsadas.includes(palabra)) {
                palabrasUsadas.push(palabra);
                if (palabrasUsadas.length > 200) {
                    palabrasUsadas.shift();
                }
            }
        }

        function obtenerSiguientePalabra() {
            if (bancoIA.length <= 5) {
                pedirLotePalabrasIA();
            }

            let seleccion = "";

            // Prioridad a la IA si hay palabras disponibles
            if (bancoIA.length > 0) {
                const idx = Math.floor(Math.random() * bancoIA.length);
                seleccion = bancoIA.splice(idx, 1)[0];
            } else {
                // Si aún no ha llegado respuesta de la IA, usamos el respaldo local
                const idx = Math.floor(Math.random() * palabrasIniciales.length);
                seleccion = palabrasIniciales[idx];
            }

            registrarPalabraUsada(seleccion);
            return seleccion;
        }

        function mostrarPalabra() {
            palabraSeleccionada = obtenerSiguientePalabra();
            document.getElementById('word-display').innerText = palabraSeleccionada;
            
            document.getElementById('main-title').style.display = 'block';
            document.getElementById('screen-start').style.display = 'none';
            document.getElementById('screen-word').style.display = 'flex';
        }

        function otraPalabra() {
            palabraSeleccionada = obtenerSiguientePalabra();
            document.getElementById('word-display').innerText = palabraSeleccionada;
        }

        function empezarAProyectar() {
            document.getElementById('main-title').style.display = 'none';
            document.getElementById('screen-word').style.display = 'none';
            document.getElementById('screen-canvas').style.display = 'flex';
            
            setTimeout(() => {
                ajustarResolucionCanvas();
            }, 50);
        }

        function reiniciarJuego() {
            limpiarLienzo();
            document.getElementById('screen-canvas').style.display = 'none';
            mostrarPalabra();
        }

        function configurarEventosDibujo() {
            canvas.addEventListener('mousedown', empezarDibujo);
            canvas.addEventListener('mousemove', dibujar);
            canvas.addEventListener('mouseup', detenerDibujo);
            canvas.addEventListener('mouseleave', detenerDibujo);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                empezarDibujo(e.touches[0]);
            });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                dibujar(e.touches[0]);
            });

            canvas.addEventListener('touchend', detenerDibujo);
        }

        function guardarEstado() {
            if (historialTrazos.length >= 25) {
                historialTrazos.shift();
            }
            historialTrazos.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function deshacerUltimoTrazo() {
            if (historialTrazos.length > 0) {
                const ultimoEstado = historialTrazos.pop();
                ctx.putImageData(ultimoEstado, 0, 0);
            } else {
                limpiarLienzo();
            }
        }

        function obtenerPosicion(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        function empezarDibujo(e) {
            guardarEstado();
            dibujando = true;
            const pos = obtenerPosicion(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function dibujar(e) {
            if (!dibujando) return;
            const pos = obtenerPosicion(e);

            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = colorActual;
            ctx.lineWidth = colorActual === '#ffffff' ? 20 : GROSOR_FINO;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function detenerDibujo() {
            if (dibujando) {
                ctx.closePath();
                dibujando = false;
            }
        }

        function limpiarLienzo() {
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            historialTrazos = [];
        }

        function setColor(color, elemento) {
            colorActual = color;
            document.querySelectorAll('.round-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
        }
    </script>
</body>
</html>
