<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Palabras y Dibujo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* BARRA SUPERIOR: Ajustada para scroll horizontal si no cabe */
    .toolbar {
      width: 100%;
      max-width: 500px;
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto; /* Permite scroll horizontal si no cabe en móviles estrechos */
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 10px;
    }

    /* Ocultar barra de scroll estética */
    .toolbar::-webkit-scrollbar {
      display: none;
    }
    .toolbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .action-btn {
      background-color: #d35400;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .action-btn.clear-btn {
      background-color: #c0392b;
    }

    /* LIENZO DE DIBUJO */
    .canvas-container {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1.2;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      touch-action: none; /* Evita scroll de pantalla mientras se dibuja */
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* BOTÓN INFERIOR */
    .bottom-bar {
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
    }

    .next-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%);
      color: #000000;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .next-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- BARRA DE HERRAMIENTAS SUPERIOR -->
  <div class="toolbar">
    <div class="color-picker">
      <button class="color-btn active" style="background-color: #000000;" data-color="#000000"></button>
      <button class="color-btn" style="background-color: #e74c3c;" data-color="#e74c3c"></button>
      <button class="color-btn" style="background-color: #2ecc71;" data-color="#2ecc71"></button>
      <button class="color-btn" style="background-color: #3498db;" data-color="#3498db"></button>
      <button class="color-btn" style="background-color: #f1c40f;" data-color="#f1c40f"></button>
    </div>
    <button class="action-btn" id="undoBtn">🔄 Deshacer</button>
    <button class="action-btn clear-btn" id="clearBtn">🗑️ Borrar</button>
  </div>

  <!-- LIENZO -->
  <div class="canvas-container">
    <canvas id="paintCanvas"></canvas>
  </div>

  <!-- BOTÓN INFERIOR -->
  <div class="bottom-bar">
    <button class="next-btn" id="nextWordBtn">
      <span id="wordDisplay">CARGANDO...</span> 🔄
    </button>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. LISTA DE 100 PALABRAS DE INICIO (Instantáneas)
    // -------------------------------------------------------------
    const initialWords = [
      "Sol", "Casa", "Árbol", "Coche", "Gato", "Perro", "Flor", "Luna", "Manzana", "Barco",
      "Avión", "Reloj", "Estrella", "Pez", "Pájaro", "Silla", "Mesa", "Lápiz", "Libro", "Teléfono",
      "Pelota", "Sombrero", "Zapatos", "Taza", "Cuchara", "Tenedor", "Cama", "Puerta", "Ventana", "Corazón",
      "Llave", "Paraguas", "Campana", "Ojo", "Mano", "Pie", "Caramelo", "Tarta", "Helado", "Queso",
      "Plátano", "Fresa", "Sombra", "Nube", "Lluvia", "Fuego", "Montaña", "Río", "Mar", "Isla",
      "Castillo", "Corona", "Moneda", "Bolsa", "Botella", "Vaso", "Cuchillo", "Peine", "Cepillo", "Tijeras",
      "Guitarra", "Tambor", "Pintura", "Pincel", "Caja", "Carta", "Regalo", "Globo", "Cometa", "Bicicleta",
      "Tren", "Camión", "Autobús", "Semáforo", "Puente", "Escalera", "Martillo", "Clavo", "Sierra", "Anillo",
      "Gafas", "Reloj", "Botón", "Cremallera", "Cinturón", "Calcetín", "Pantalón", "Camiseta", "Chaqueta", "Guante",
      "Mariposa", "Abeja", "Araña", "Serpiente", "Rana", "Tortuga", "Caracol", "Ratón", "Elefante", "León"
    ];

    let currentWordList = [...initialWords];
    let iaWordsLoaded = false;

    // -------------------------------------------------------------
    // 2. LÓGICA DE SELECCIÓN DE PALABRA
    // -------------------------------------------------------------
    const wordDisplay = document.getElementById("wordDisplay");
    const nextWordBtn = document.getElementById("nextWordBtn");

    function getRandomWord() {
      if (currentWordList.length === 0) return "DIBUJO";
      const randomIndex = Math.floor(Math.random() * currentWordList.length);
      return currentWordList.splice(randomIndex, 1)[0].toUpperCase();
    }

    function showNextWord() {
      const nextWord = getRandomWord();
      wordDisplay.textContent = nextWord;
      clearCanvas(); // Opcional: limpia el lienzo al cambiar de palabra
    }

    // Cargar palabra de inicio inmediatamente
    showNextWord();

    // -------------------------------------------------------------
    // 3. SIMULACIÓN DE CARGA DE IA (Reemplaza la lista tras la respuesta)
    // -------------------------------------------------------------
    function fetchIAWords() {
      // Aquí irá tu llamada real a la API de la IA.
      // Cuando la IA responda con sus 20 palabras:
      setTimeout(() => {
        const iaWords = [
          "Cohete", "Dinosaurio", "Submarino", "Astronauta", "Pirámide",
          "Volcán", "Faro", "Robot", "Dragón", "Unicornio",
          "Brújula", "Telescopio", "Microscopio", "Cactus", "Palmera",
          "Mochila", "Brújula", "Sirena", "Extraterrestre", "Tesoro"
        ];
        
        // Reemplazamos la lista por las 20 de la IA
        currentWordList = iaWords;
        iaWordsLoaded = true;
        console.log("Palabras de la IA cargadas con éxito.");
      }, 3000); // Simula 3 segundos de latencia de red/IA
    }

    fetchIAWords();

    nextWordBtn.addEventListener("click", showNextWord);

    // -------------------------------------------------------------
    // 4. LÓGICA DEL CANVAS Y DIBUJO
    // -------------------------------------------------------------
    const canvas = document.getElementById("paintCanvas");
    const ctx = canvas.getContext("2d");
    let isDrawing = false;
    let currentColor = "#000000";
    let paths = []; // Historial para el botón 'Deshacer'
    let currentPath = [];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      redrawCanvas();
    }

    window.addEventListener("resize", resizeCanvas);

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      currentPath = [{ x: pos.x, y: pos.y, color: currentColor }];
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.strokeStyle = currentColor;
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }

    function draw(e) {
      if (!isDrawing) return;
      const pos = getPos(e);
      currentPath.push({ x: pos.x, y: pos.y, color: currentColor });
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (isDrawing) {
        isDrawing = false;
        paths.push(currentPath);
        currentPath = [];
      }
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      paths = [];
    }

    function redrawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      paths.forEach(path => {
        if (path.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        ctx.strokeStyle = path[0].color;
        ctx.lineWidth = 4;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();
      });
    }

    // Eventos Mouse y Touch
    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDrawing);
    canvas.addEventListener("mouseleave", stopDrawing);

    canvas.addEventListener("touchstart", (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener("touchmove", (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener("touchend", stopDrawing);

    // Selección de Color
    document.querySelectorAll(".color-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        currentColor = e.target.getAttribute("data-color");
      });
    });

    // Deshacer y Borrar
    document.getElementById("undoBtn").addEventListener("click", () => {
      paths.pop();
      redrawCanvas();
    });

    document.getElementById("clearBtn").addEventListener("click", clearCanvas);

    // Inicializar tamaño
    resizeCanvas();
  </script>
</body>
</html>
