<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Excusas de Improvisaci&oacute;n</title>
    <style>
        :root {
            --primary: #8a2be2;
            --primary-light: #f0e6ff;
            --accent: #ff00ff;
            --text-dark: #2d3436;
            --text-gray: #5f6368;
            --white: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
            background-color: #f9f7ff; 
            color: var(--text-dark);
        }

        h1 { 
            color: var(--primary); 
            text-align: center;
            border-bottom: 3px solid var(--primary); 
            padding-bottom: 15px; 
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        p.instruccion { 
            color: var(--text-gray); 
            margin-bottom: 25px; 
            font-style: italic; 
            text-align: center;
        }
        
        .btn-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        button { 
            padding: 16px 40px; 
            background: linear-gradient(135deg, var(--primary) 0%, #6a1ba5 100%);
            color: var(--white); 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(138, 43, 226, 0.2);
        }

        button:hover { 
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(138, 43, 226, 0.3);
            filter: brightness(1.1);
        }

        button:active { 
            transform: translateY(1px); 
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        #resultado { 
            margin-top: 20px; 
            padding: 30px; 
            border: 2px solid var(--primary); 
            background-color: var(--white);
            border-radius: 20px; 
            min-height: 250px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .categoria-titulo { 
            color: var(--primary); 
            font-size: 1.5rem; 
            margin-top: 20px; 
            margin-bottom: 15px; 
            display: flex;
            align-items: center;
            font-weight: 800;
        }

        .categoria-titulo::before {
            content: "✦";
            margin-right: 10px;
            color: var(--accent);
        }

        ul { 
            list-style-type: none; 
            margin: 0; 
            padding: 0; 
        }

        li { 
            margin-bottom: 12px; 
            padding: 12px 18px;
            background-color: var(--primary-light);
            border-radius: 12px;
            border-left: 4px solid var(--primary);
            font-weight: 500;
            line-height: 1.4;
            transition: transform 0.2s;
        }

        li:hover {
            transform: scale(1.02);
        }

        .cargando { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--primary); 
            font-weight: bold; 
            padding: 50px 0;
            animation: pulse 1.5s infinite; 
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .error-msg {
            background-color: #fff5f5;
            color: #c53929;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #fab1a0;
        }

        .footer-nav {
            text-align: center;
            margin-top: 50px;
            padding-bottom: 40px;
        }

        .footer-nav a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: bold;
            padding: 12px 25px;
            border: 2px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .footer-nav a:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <h1>&#128104;&#8205;&#128187; ¿Por qu&eacute; he llegado tarde?</h1>
    <p class="instruccion">Generador de excusas para juegos de improvisaci&oacute;n teatral. &iexcl;Usa la que m&aacute;s te guste!</p>
    
    <div class="btn-container">
        <button id="mainButton" onclick="generarContenido()">&iexcl; Generar Excusas !</button>
    </div>
    
    <div id="resultado">
        <div style="text-align:center; color:#ccc; padding-top:80px;">Las excusas aparecer&aacute;n aqu&iacute;...</div>
    </div>

    <div class="footer-nav">
        <a href="index.html">&larr; Volver al Men&uacute; Principal</a>
    </div>

    <script>
        // URL de tu Worker de Cloudflare
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        function construirPromptExcusas() {
            return `Genera exactamente 3 excusas ABSURDAS y 3 excusas REALISTAS para haber llegado tarde al trabajo.
            Formato de salida estricto:
            ### ABSURDAS
            (aqu&iacute; las 3 l&iacute;neas)
            ### REALISTAS
            (aqu&iacute; las 3 l&iacute;neas)
            No a&ntilde;adas n&uacute;meros ni guiones. Solo el texto por l&iacute;nea.`;
        }

        async function generarContenido() {
            const resultadoDiv = document.getElementById('resultado');
            const btn = document.getElementById('mainButton');
            
            resultadoDiv.innerHTML = '<div class="cargando"><span>&#128161; Inventando historias...</span></div>';
            btn.disabled = true;

            const prompt = construirPromptExcusas();
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                if (!response.ok) throw new Error('Error en la respuesta del servidor');

                const data = await response.json();
                
                // Ajuste seg&uacute;n la estructura de respuesta de tu Worker
                let textoGenerado = data.candidates?.[0]?.content?.parts?.[0]?.text || data.text || "";

                if (!textoGenerado) throw new Error('No se recibi&oacute; contenido v&aacute;lido');

                const partes = textoGenerado.split('###');
                let htmlResultado = '';

                partes.forEach(parte => {
                    const lineas = parte.trim().split('\n').filter(l => l.trim().length > 0);
                    if (lineas.length === 0) return;

                    const titulo = lineas[0].trim();
                    const excusas = lineas.slice(1);

                    htmlResultado += `<div class="categoria-titulo">${titulo}</div><ul>`;
                    excusas.forEach(excusa => {
                        htmlResultado += `<li>${excusa.trim()}</li>`;
                    });
                    htmlResultado += '</ul>';
                });

                resultadoDiv.innerHTML = htmlResultado;

            } catch (error) {
                resultadoDiv.innerHTML = `
                    <div class="error-msg">
                        <strong>&#9888; Error:</strong> No se pudo conectar con el generador.<br>
                        Detalle: ${error.message}
                    </div>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
