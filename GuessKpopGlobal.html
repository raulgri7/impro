<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adivina el Grupo | K-Pop Hits & Variedad</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* BARRA SUPERIOR */
    .toolbar {
      width: 100%;
      max-width: 500px;
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 10px;
    }

    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar { -ms-overflow-style: none; scrollbar-width: none; }

    .stat-badge {
      background-color: #2a2a2a;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #ffcc00;
      flex-shrink: 0;
    }

    .tag-viral {
      background: linear-gradient(90deg, #ff0000, #ff007f);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* BANNER DE NOTIFICACIÓN DE CANCIÓN AÑADIDA */
    .new-song-banner {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(90deg, #ff0000 0%, #ff007f 100%);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
      display: none;
      animation: popIn 0.3s ease-out;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* CONTENEDOR PRINCIPAL */
    .canvas-container {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1.2;
      background-color: #1e1e1e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .album-art-container {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #333;
      margin-top: 5px;
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
      cursor: pointer;
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(16px);
      transition: filter 0.5s ease;
    }

    .album-art.revealed {
      filter: blur(0px);
    }

    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: rgba(0, 0, 0, 0.35);
    }

    .song-info {
      font-size: 13px;
      font-weight: bold;
      color: #ff007f;
      text-align: center;
      min-height: 20px;
      margin: 6px 0;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .option-btn {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 2px solid #333;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s, border-color 0.15s;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .option-btn:active {
      transform: scale(0.97);
    }

    .option-btn.correct {
      background-color: #00e676 !important;
      border-color: #00c853 !important;
      color: #000;
      font-weight: 800;
    }

    .option-btn.incorrect {
      background-color: #ff1744 !important;
      border-color: #d50000 !important;
      color: #fff;
    }

    /* BOTÓN INFERIOR */
    .bottom-bar {
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
    }

    .next-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff007f 0%, #ff0055 100%);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.1s;
    }

    .next-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="toolbar">
    <div class="stat-badge" id="scoreDisplay">PUNTOS: 0</div>
    <span class="tag-viral">🔥 POPULAR & B-SIDES</span>
    <div class="stat-badge" id="roundDisplay">1/10</div>
  </div>

  <!-- NOTIFICACIÓN DE CANCIÓN DEL ÁLBUM -->
  <div class="new-song-banner" id="newSongBanner">
    ✨ ¡Nueva canción en juego!
  </div>

  <!-- CONTENEDOR CENTRAL -->
  <div class="canvas-container">
    <div class="album-art-container" onclick="replayAudio()" title="Toca para escuchar de nuevo">
      <img id="albumArt" class="album-art" src="" alt="Album Art">
      <div id="playOverlay" class="play-overlay">▶️</div>
    </div>

    <div id="songInfo" class="song-info">¿Qué grupo o artista canta esta canción?</div>

    <div class="options-grid" id="optionsGrid">
      <!-- Opciones dinámicas -->
    </div>
  </div>

  <!-- BOTÓN INFERIOR -->
  <div class="bottom-bar">
    <button class="next-btn" id="nextBtn">
      <span id="btnText">SIGUIENTE CANCIÓN</span> ⚡
    </button>
  </div>

  <script>
    // BASE DE DATOS AMPLIADA: MÁS DE 70 CANCIONES VARIADAS DE SUS ÁLBUMES Y SHORTS
    const VIRAL_SHORTS_DATABASE = [
      // BLACKPINK
      { artist: "BLACKPINK", song: "How You Like That" },
      { artist: "BLACKPINK", song: "Pink Venom" },
      { artist: "BLACKPINK", song: "Kill This Love" },
      { artist: "BLACKPINK", song: "Shut Down" },
      { artist: "BLACKPINK", song: "DDU-DU DDU-DU" },
      { artist: "BLACKPINK", song: "Lovesick Girls" },
      { artist: "BLACKPINK", song: "Pretty Savage" },
      { artist: "BLACKPINK", song: "As If It's Your Last" },

      // BTS
      { artist: "BTS", song: "Dynamite" },
      { artist: "BTS", song: "Butter" },
      { artist: "BTS", song: "Boy With Luv" },
      { artist: "BTS", song: "Mic Drop" },
      { artist: "BTS", song: "Permission to Dance" },
      { artist: "BTS", song: "DNA" },
      { artist: "BTS", song: "Run BTS" },
      { artist: "BTS", song: "Fake Love" },

      // KATSEYE
      { artist: "KATSEYE", song: "Touch" },
      { artist: "KATSEYE", song: "Debut" },
      { artist: "KATSEYE", song: "My Way" },

      // ITZY
      { artist: "ITZY", song: "WANNABE" },
      { artist: "ITZY", song: "UNTOUCHABLE" },
      { artist: "ITZY", song: "LOCO" },
      { artist: "ITZY", song: "Not Shy" },
      { artist: "ITZY", song: "DALLA DALLA" },
      { artist: "ITZY", song: "SNEAKERS" },
      { artist: "ITZY", song: "CAKE" },

      // LE SSERAFIM
      { artist: "LE SSERAFIM", song: "ANTIFRAGILE" },
      { artist: "LE SSERAFIM", song: "EASY" },
      { artist: "LE SSERAFIM", song: "UNFORGIVEN" },
      { artist: "LE SSERAFIM", song: "FEARLESS" },
      { artist: "LE SSERAFIM", song: "Smart" },
      { artist: "LE SSERAFIM", song: "Perfect Night" },
      { artist: "LE SSERAFIM", song: "Eve, Psyche & the Bluebeard's wife" },

      // BABYMONSTER
      { artist: "BABYMONSTER", song: "SHEESH" },
      { artist: "BABYMONSTER", song: "DRIP" },
      { artist: "BABYMONSTER", song: "BATTER UP" },
      { artist: "BABYMONSTER", song: "LIKE THAT" },
      { artist: "BABYMONSTER", song: "Stuck In The Middle" },

      // MEOVV
      { artist: "MEOVV", song: "MEOW" },
      { artist: "MEOVV", song: "BODY" },

      // NMIXX
      { artist: "NMIXX", song: "DASH" },
      { artist: "NMIXX", song: "Love Me Like This" },
      { artist: "NMIXX", song: "O.O" },
      { artist: "NMIXX", song: "DICE" },
      { artist: "NMIXX", song: "See that?" },
      { artist: "NMIXX", song: "Roller Coaster" },

      // ILLIT
      { artist: "ILLIT", song: "Magnetic" },
      { artist: "ILLIT", song: "Cherish (My Love)" },
      { artist: "ILLIT", song: "Lucky Girl Attitude" },

      // KiiiKiii / Hearts2Hearts
      { artist: "KiiiKiii", song: "I Do Me" },
      { artist: "Hearts2Hearts", song: "RUDE!" },

      // Stray Kids
      { artist: "Stray Kids", song: "S-Class" },
      { artist: "Stray Kids", song: "Maniac" },
      { artist: "Stray Kids", song: "God's Menu" },
      { artist: "Stray Kids", song: "LALALALA" },
      { artist: "Stray Kids", song: "Chk Chk Boom" },
      { artist: "Stray Kids", song: "Thunderous" },

      // TWICE
      { artist: "TWICE", song: "The Feels" },
      { artist: "TWICE", song: "FANCY" },
      { artist: "TWICE", song: "What is Love?" },
      { artist: "TWICE", song: "Talk that Talk" },

      // NewJeans
      { artist: "NewJeans", song: "Super Shy" },
      { artist: "NewJeans", song: "OMG" },
      { artist: "NewJeans", song: "Hype Boy" },
      { artist: "NewJeans", song: "ETA" },
      { artist: "NewJeans", song: "Ditto" },
      { artist: "NewJeans", song: "How Sweet" },

      // aespa
      { artist: "aespa", song: "Supernova" },
      { artist: "aespa", song: "Armageddon" },
      { artist: "aespa", song: "Next Level" },
      { artist: "aespa", song: "Drama" },

      // IVE
      { artist: "IVE", song: "LOVE DIVE" },
      { artist: "IVE", song: "I AM" },
      { artist: "IVE", song: "AFTER LIKE" },
      { artist: "IVE", song: "HEYA" }
    ];

    let playlist = [];
    let currentTrackIndex = 0;
    let score = 0;
    let isAnswered = false;
    let audioPlayer = new Audio();

    const scoreDisplay = document.getElementById("scoreDisplay");
    const roundDisplay = document.getElementById("roundDisplay");
    const albumArt = document.getElementById("albumArt");
    const playOverlay = document.getElementById("playOverlay");
    const songInfo = document.getElementById("songInfo");
    const optionsGrid = document.getElementById("optionsGrid");
    const nextBtn = document.getElementById("nextBtn");
    const btnText = document.getElementById("btnText");
    const newSongBanner = document.getElementById("newSongBanner");

    // INICIALIZAR EL JUEGO
    async function initGame() {
      audioPlayer.pause();
      score = 0;
      currentTrackIndex = 0;
      scoreDisplay.textContent = `PUNTOS: ${score}`;
      btnText.textContent = "CARGANDO TEMAZOS...";

      // Seleccionar 10 canciones totalmente al azar del catálogo variado
      let pool = [...VIRAL_SHORTS_DATABASE].sort(() => Math.random() - 0.5);
      const selected = pool.slice(0, 10);

      playlist = [];
      for (const item of selected) {
        try {
          const query = encodeURIComponent(`${item.artist} ${item.song}`);
          const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
          const data = await res.json();

          if (data.results && data.results.length > 0) {
            const track = data.results[0];
            playlist.push({
              artist: item.artist,
              songTitle: track.trackName,
              previewUrl: track.previewUrl,
              artwork: track.artworkUrl100.replace('100x100bb', '300x300bb')
            });
          }
        } catch (e) {
          console.error("Error cargando tema:", e);
        }
      }

      if (playlist.length === 0) {
        songInfo.textContent = "Error al cargar la música. Inténtalo de nuevo.";
        return;
      }

      btnText.textContent = "SIGUIENTE CANCIÓN ⚡";
      loadTrack();
    }

    // CARGAR CADA RONDA
    function loadTrack() {
      isAnswered = false;
      const current = playlist[currentTrackIndex];

      roundDisplay.textContent = `${currentTrackIndex + 1}/${playlist.length}`;
      songInfo.textContent = "¿Qué grupo o artista canta esta canción?";
      albumArt.src = current.artwork;
      albumArt.classList.remove("revealed");
      playOverlay.style.display = "flex";

      // AVISO EN PANTALLA
      newSongBanner.style.display = "block";
      newSongBanner.innerHTML = `🎵 Suena: <b>"${current.songTitle}"</b> de <b>${current.artist}</b>`;

      // 4 opciones con los nombres de los grupos principales
      const allArtists = Array.from(new Set(VIRAL_SHORTS_DATABASE.map(a => a.artist)));
      const wrong = allArtists.filter(a => a !== current.artist).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [current.artist, ...wrong].sort(() => Math.random() - 0.5);

      optionsGrid.innerHTML = "";
      options.forEach(artistName => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = artistName;
        btn.onclick = () => checkAnswer(artistName, btn);
        optionsGrid.appendChild(btn);
      });

      audioPlayer.src = current.previewUrl;
      playAudio();
    }

    function playAudio() {
      audioPlayer.currentTime = 0;
      audioPlayer.play().then(() => {
        playOverlay.style.display = "none";
      }).catch(() => {
        playOverlay.style.display = "flex";
      });
    }

    function replayAudio() {
      if (audioPlayer.src) playAudio();
    }

    // VERIFICAR RESPUESTA
    function checkAnswer(selectedArtist, btn) {
      if (isAnswered) return;
      isAnswered = true;

      const current = playlist[currentTrackIndex];
      albumArt.classList.add("revealed");
      songInfo.textContent = `🎵 ${current.songTitle} - ${current.artist}`;

      const allBtns = document.querySelectorAll(".option-btn");

      if (selectedArtist === current.artist) {
        btn.classList.add("correct");
        score += 100;
        scoreDisplay.textContent = `PUNTOS: ${score}`;
      } else {
        btn.classList.add("incorrect");
        allBtns.forEach(b => {
          if (b.textContent === current.artist) b.classList.add("correct");
        });
      }

      allBtns.forEach(b => b.onclick = null);
    }

    // BOTÓN INFERIOR
    nextBtn.addEventListener("click", () => {
      if (currentTrackIndex < playlist.length - 1) {
        currentTrackIndex++;
        loadTrack();
      } else {
        btnText.textContent = "NUEVA RONDA ALEATORIA 🔄";
        initGame();
      }
    });

    // Iniciar juego al abrir
    initGame();
  </script>
</body>
</html>
