<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Pop Global & New Generation Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* BARRA SUPERIOR CON SCROLL SI NO CABE */
    .toolbar {
      width: 100%;
      max-width: 500px;
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      margin-bottom: 10px;
    }

    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar { -ms-overflow-style: none; scrollbar-width: none; }

    .stat-badge {
      background-color: #2a2a2a;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #ffcc00;
      flex-shrink: 0;
    }

    .tag-kpop-global {
      background: linear-gradient(90deg, #00f2fe, #ff007f);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* BANNER NOTIFICACIÓN DE CANCIÓN NUEVA */
    .new-song-banner {
      width: 100%;
      max-width: 500px;
      background: linear-gradient(90deg, #00f2fe 0%, #ff007f 100%);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 10px;
      display: none;
      animation: popIn 0.3s ease-out;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* CONTENEDOR CENTRAL DE JUEGO */
    .canvas-container {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1.2;
      background-color: #1e1e1e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .album-art-container {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #333;
      margin-top: 5px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
      cursor: pointer;
    }

    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(16px);
      transition: filter 0.5s ease;
    }

    .album-art.revealed {
      filter: blur(0px);
    }

    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: rgba(0, 0, 0, 0.35);
    }

    .song-info {
      font-size: 13px;
      font-weight: bold;
      color: #00f2fe;
      text-align: center;
      min-height: 20px;
      margin: 6px 0;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .option-btn {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 2px solid #333;
      padding: 12px 8px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s, border-color 0.15s;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .option-btn:active {
      transform: scale(0.97);
    }

    .option-btn.correct {
      background-color: #00e676 !important;
      border-color: #00c853 !important;
      color: #000;
      font-weight: 800;
    }

    .option-btn.incorrect {
      background-color: #ff1744 !important;
      border-color: #d50000 !important;
      color: #fff;
    }

    /* BOTÓN INFERIOR ADAPTADO */
    .bottom-bar {
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
    }

    .next-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000000;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
      transition: transform 0.1s;
    }

    .next-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="toolbar">
    <div class="stat-badge" id="scoreDisplay">PUNTOS: 0</div>
    <span class="tag-kpop-global">GLOBAL K-POP & ROOKIES</span>
    <div class="stat-badge" id="roundDisplay">1/10</div>
  </div>

  <!-- BANNER NOTIFICACIÓN DE CANCIÓN AÑADIDA -->
  <div class="new-song-banner" id="newSongBanner">
    ✨ ¡Se ha añadido un nuevo tema a la lista!
  </div>

  <!-- CONTENEDOR CENTRAL -->
  <div class="canvas-container">
    <div class="album-art-container" onclick="replayAudio()" title="Haz clic para volver a escuchar">
      <img id="albumArt" class="album-art" src="" alt="Album Art">
      <div id="playOverlay" class="play-overlay">▶️</div>
    </div>

    <div id="songInfo" class="song-info">¿Qué grupo o artista canta esta canción?</div>

    <div class="options-grid" id="optionsGrid">
      <!-- Opciones dinámicas -->
    </div>
  </div>

  <!-- BOTÓN INFERIOR CAMBIADO -->
  <div class="bottom-bar">
    <button class="next-btn" id="nextBtn">
      <span id="btnText">SIGUIENTE PISTA GLOBAL</span> ⚡
    </button>
  </div>

  <script>
    // BASE DE DATOS EXCLUSIVA: K-POP GLOBAL, ROOKIES Y NUEVA GENERACIÓN
    const KPOP_GLOBAL_DATABASE = [
      { artist: "KATSEYE", song: "Touch" },
      { artist: "KATSEYE", song: "My Way" },
      { artist: "SAINT SATINE", song: "Prelude" },
      { artist: "KiiiKiii", song: "I Do Me" },
      { artist: "KiiiKiii", song: "Dancing Alone" },
      { artist: "ILLIT", song: "Magnetic" },
      { artist: "ILLIT", song: "Cherish (My Love)" },
      { artist: "MEOVV", song: "MEOW" },
      { artist: "MEOVV", song: "BODY" },
      { artist: "BABYMONSTER", song: "DRIP" },
      { artist: "BABYMONSTER", song: "SHEESH" },
      { artist: "TWS", song: "Plot Twist" },
      { artist: "TWS", song: "Last Bell" },
      { artist: "izna", song: "IZNA" },
      { artist: "KickFlip", song: "Twenty" },
      { artist: "BADVILLAIN", song: "BADVILLAIN" },
      { artist: "RESCENE", song: "Love Attack" },
      { artist: "ARTMS", song: "Virtual Angel" },
      { artist: "Hearts2Hearts", song: "RUDE!" },
      { artist: "NMIXX", song: "DASH" },
      { artist: "RIIZE", song: "Impossible" },
      { artist: "ZEROBASEONE", song: "GOOD SO BAD" },
      { artist: "KISS OF LIFE", song: "Sticky" },
      { artist: "QWER", song: "T.B.H" }
    ];

    let playlist = [];
    let currentTrackIndex = 0;
    let score = 0;
    let isAnswered = false;
    let audioPlayer = new Audio();

    const scoreDisplay = document.getElementById("scoreDisplay");
    const roundDisplay = document.getElementById("roundDisplay");
    const albumArt = document.getElementById("albumArt");
    const playOverlay = document.getElementById("playOverlay");
    const songInfo = document.getElementById("songInfo");
    const optionsGrid = document.getElementById("optionsGrid");
    const nextBtn = document.getElementById("nextBtn");
    const btnText = document.getElementById("btnText");
    const newSongBanner = document.getElementById("newSongBanner");

    // INICIALIZAR EL JUEGO MEZCLANDO LA BASE DE DATOS
    async function initGame() {
      audioPlayer.pause();
      score = 0;
      currentTrackIndex = 0;
      scoreDisplay.textContent = `PUNTOS: ${score}`;
      btnText.textContent = "BUSCANDO PISTAS NUEVAS...";

      // Seleccionar 10 temas al azar sin repetir
      let pool = [...KPOP_GLOBAL_DATABASE].sort(() => Math.random() - 0.5);
      const selected = pool.slice(0, 10);

      playlist = [];
      for (const item of selected) {
        try {
          const query = encodeURIComponent(`${item.artist} ${item.song}`);
          const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=1`);
          const data = await res.json();

          if (data.results && data.results.length > 0) {
            const track = data.results[0];
            playlist.push({
              artist: item.artist,
              songTitle: track.trackName,
              previewUrl: track.previewUrl,
              artwork: track.artworkUrl100.replace('100x100bb', '300x300bb')
            });
          }
        } catch (e) {
          console.error("Error buscando pista de audio:", e);
        }
      }

      if (playlist.length === 0) {
        songInfo.textContent = "Error al conectar con la red de canciones.";
        return;
      }

      btnText.textContent = "SIGUIENTE PISTA GLOBAL ⚡";
      loadTrack();
    }

    // CARGAR CADA CANCIÓN Y MOSTRAR LA NOTIFICACIÓN DE CANCIÓN AÑADIDA
    function loadTrack() {
      isAnswered = false;
      const current = playlist[currentTrackIndex];

      roundDisplay.textContent = `${currentTrackIndex + 1}/${playlist.length}`;
      songInfo.textContent = "¿Qué grupo o artista canta esta canción?";
      albumArt.src = current.artwork;
      albumArt.classList.remove("revealed");
      playOverlay.style.display = "flex";

      // MOSTRAR BANNER NOTIFICANDO LA CANCIÓN INCORPORADA A LA RONDA
      newSongBanner.style.display = "block";
      newSongBanner.innerHTML = `🔥 ¡Se ha añadido una nueva canción!: <b>"${current.songTitle}"</b> de <b>${current.artist}</b>`;

      // Generar 4 opciones (1 correcta + 3 distractores del ecosistema K-Pop / K-Pop Global)
      const allArtists = Array.from(new Set(KPOP_GLOBAL_DATABASE.map(a => a.artist)));
      const wrong = allArtists.filter(a => a !== current.artist).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [current.artist, ...wrong].sort(() => Math.random() - 0.5);

      optionsGrid.innerHTML = "";
      options.forEach(artistName => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = artistName;
        btn.onclick = () => checkAnswer(artistName, btn);
        optionsGrid.appendChild(btn);
      });

      audioPlayer.src = current.previewUrl;
      playAudio();
    }

    function playAudio() {
      audioPlayer.currentTime = 0;
      audioPlayer.play().then(() => {
        playOverlay.style.display = "none";
      }).catch(() => {
        playOverlay.style.display = "flex";
      });
    }

    function replayAudio() {
      if (audioPlayer.src) playAudio();
    }

    // COMPROBAR LA RESPUESTA
    function checkAnswer(selectedArtist, btn) {
      if (isAnswered) return;
      isAnswered = true;

      const current = playlist[currentTrackIndex];
      albumArt.classList.add("revealed");
      songInfo.textContent = `🎵 ${current.songTitle} - ${current.artist}`;

      const allBtns = document.querySelectorAll(".option-btn");

      if (selectedArtist === current.artist) {
        btn.classList.add("correct");
        score += 100;
        scoreDisplay.textContent = `PUNTOS: ${score}`;
      } else {
        btn.classList.add("incorrect");
        allBtns.forEach(b => {
          if (b.textContent === current.artist) b.classList.add("correct");
        });
      }

      allBtns.forEach(b => b.onclick = null);
    }

    // EVENTO DEL BOTÓN INFERIOR CAMBIADO
    nextBtn.addEventListener("click", () => {
      if (currentTrackIndex < playlist.length - 1) {
        currentTrackIndex++;
        loadTrack();
      } else {
        btnText.textContent = "REINICIAR RONDA GLOBAL 🔄";
        initGame();
      }
    });

    // Arrancar el juego automáticamente al cargar
    initGame();
  </script>
</body>
</html>
