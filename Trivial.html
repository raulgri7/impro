<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivial Pursuit Genus 🧠</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            touch-action: manipulation;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            user-select: none;
            overflow: hidden;
            gap: 12px;
        }

        h1 {
            font-size: clamp(1.1rem, 3.5vh, 1.6rem);
            letter-spacing: 1.5px;
            color: #ccc;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
        }

        .quesito-container {
            width: clamp(220px, 42vh, 320px);
            height: clamp(220px, 42vh, 320px);
            position: relative;
            flex-shrink: 0;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
        }

        .sector-path {
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            transform-origin: 160px 160px;
        }

        .sector-path:hover {
            filter: brightness(1.25);
            transform: scale(1.03);
        }

        .sector-icon {
            font-size: 28px;
            pointer-events: none;
            user-select: none;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .card-pregunta {
            display: none;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 15px 18px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-height: 80svh;
            overflow-y: auto;
        }

        .categoria-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: clamp(0.75rem, 2vh, 0.85rem);
            margin-bottom: 10px;
            color: #fff;
        }

        .texto-pregunta {
            font-size: clamp(1rem, 2.8vh, 1.25rem);
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .opciones-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .btn-opcion {
            background: #2a2a2a;
            color: #fff;
            border: 2px solid #444;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: clamp(0.85rem, 2.3vh, 1rem);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.2;
        }

        .btn-opcion:hover:not([disabled]) {
            background: #3a3a3a;
            border-color: #666;
        }

        .btn-opcion.correcta {
            background-color: #27ae60 !important;
            border-color: #2ecc71 !important;
            color: white !important;
            font-weight: bold;
        }

        .btn-opcion.incorrecta {
            background-color: #c0392b !important;
            border-color: #e74c3c !important;
            color: white !important;
        }

        .btn-reiniciar {
            display: none;
            margin-top: 10px;
            background: #ffffff;
            color: #121212;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.1s ease;
        }

        .btn-reiniciar:active {
            transform: scale(0.95);
        }

        .loading-text {
            display: none;
            font-size: 1.1rem;
            color: #aaa;
            margin-top: 15px;
            text-align: center;
        }

        /* RESPONSIVE EN PANTALLA HORIZONTAL */
        @media (orientation: landscape) {
            body {
                flex-direction: row;
                justify-content: space-evenly;
                padding: 10px 20px;
                gap: 20px;
            }
            h1 { display: none; }
            .quesito-container {
                width: clamp(180px, 65vh, 280px);
                height: clamp(180px, 65vh, 280px);
            }
            .card-pregunta {
                max-width: 500px;
                padding: 12px 15px;
            }
            .texto-pregunta {
                font-size: 0.95rem;
                margin-bottom: 8px;
            }
            .opciones-grid { gap: 6px; }
            .btn-opcion {
                padding: 8px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <h1>Trivial Pursuit</h1>

    <!-- El Quesito -->
    <div id="quesito" class="quesito-container">
        <svg viewBox="0 0 320 320">
            <circle cx="160" cy="160" r="155" fill="none" stroke="#333" stroke-width="4"/>
            <path class="sector-path" fill="#0072ce" d="M160,160 L310,160 A150,150 0 0,1 235,289.9 Z" onclick="seleccionarCategoria('Geografía', '#0072ce')"/>
            <text x="235" y="200" class="sector-icon">🌍</text>
            <path class="sector-path" fill="#e03c8a" d="M160,160 L235,289.9 A150,150 0 0,1 85,289.9 Z" onclick="seleccionarCategoria('Espectáculos', '#e03c8a')"/>
            <text x="160" y="245" class="sector-icon">🎭</text>
            <path class="sector-path" fill="#ffcc00" d="M160,160 L85,289.9 A150,150 0 0,1 10,160 Z" onclick="seleccionarCategoria('Historia', '#ffcc00')"/>
            <text x="85" y="200" class="sector-icon">📜</text>
            <path class="sector-path" fill="#8d5524" d="M160,160 L10,160 A150,150 0 0,1 85,30.1 Z" onclick="seleccionarCategoria('Arte y Literatura', '#8d5524')"/>
            <text x="85" y="120" class="sector-icon">🎨</text>
            <path class="sector-path" fill="#009e49" d="M160,160 L85,30.1 A150,150 0 0,1 235,30.1 Z" onclick="seleccionarCategoria('Ciencias y Naturaleza', '#009e49')"/>
            <text x="160" y="75" class="sector-icon">🔬</text>
            <path class="sector-path" fill="#ff6600" d="M160,160 L235,30.1 A150,150 0 0,1 310,160 Z" onclick="seleccionarCategoria('Ocio y Deportes', '#ff6600')"/>
            <text x="235" y="120" class="sector-icon">⚽</text>
        </svg>
    </div>

    <div id="loading" class="loading-text">Preparando pregunta... 🧠</div>

    <!-- Card de la Pregunta -->
    <div id="card" class="card-pregunta">
        <div id="badge" class="categoria-badge">CATEGORÍA</div>
        <div id="pregunta" class="texto-pregunta">Cargando pregunta...</div>
        <div id="opciones" class="opciones-grid"></div>
    </div>

    <button id="btn-nuevo" class="btn-reiniciar" onclick="volverAlQuesito()">Elegir otro quesito</button>

    <script>
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';

        // Caché donde guardaremos las Promesas de las peticiones en curso
        const cachePreguntas = {};
        
        const categoriasColores = {
            'Geografía': '#0072ce',
            'Espectáculos': '#e03c8a',
            'Historia': '#ffcc00',
            'Arte y Literatura': '#8d5524',
            'Ciencias y Naturaleza': '#009e49',
            'Ocio y Deportes': '#ff6600'
        };

        let respuestaCorrectaIndex = null;
        let respondido = false;

        // Función base que hace el Fetch a tu Worker
        async function pedirPreguntaAIA(categoria) {
            const prompt = `Genera una pregunta tipo Trivial Pursuit de nivel medio sobre la categoría: ${categoria}.
            Devuelve ÚNICAMENTE un objeto JSON válido (sin Markdown, sin explicaciones) con la siguiente estructura:
            {
              "pregunta": "Texto de la pregunta aquí",
              "opciones": ["Opción A", "Opción B", "Opción C", "Opción D"],
              "correcta": 0
            }
            Donde "correcta" es el índice (0, 1, 2 o 3) de la respuesta correcta.`;

            const response = await fetch(URL_WORKER, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            let rawText = data.candidates[0].content.parts[0].text;
            
            rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
            return JSON.parse(rawText);
        }

        // Lanza la petición y guarda LA PROMESA en el caché
        function precargarCategoria(categoria) {
            cachePreguntas[categoria] = pedirPreguntaAIA(categoria).catch(e => {
                console.error(`Fallo al precargar ${categoria}:`, e);
                return null; // Si falla, devolvemos null para saber que hay que reintentar
            });
        }

        // AL CARGAR LA PÁGINA: Lanzamos las 6 peticiones en segundo plano
        window.onload = () => {
            Object.keys(categoriasColores).forEach(cat => {
                precargarCategoria(cat);
            });
        };

        // AL HACER CLIC EN UN QUESITO
        async function seleccionarCategoria(categoria, color) {
            document.getElementById('quesito').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                // Hacemos await de la promesa que ya estaba en curso
                let jsonPregunta = await cachePreguntas[categoria];

                // Si por lo que sea falló en segundo plano (devolvió null), la pedimos ahora en directo
                if (!jsonPregunta) {
                    jsonPregunta = await pedirPreguntaAIA(categoria);
                }

                mostrarPregunta(jsonPregunta, categoria, color);

                // ¡LA MAGIA! Mientras el usuario lee la pregunta, reponemos la de esta categoría
                precargarCategoria(categoria);

            } catch (e) {
                alert("Error al conectar con la IA. Inténtalo de nuevo.");
                volverAlQuesito();
                // Si hay un error gordo, al menos intentamos volver a precargarla
                precargarCategoria(categoria);
            }
        }

        function mostrarPregunta(datos, categoria, color) {
            document.getElementById('loading').style.display = 'none';
            
            const badge = document.getElementById('badge');
            badge.innerText = categoria;
            badge.style.backgroundColor = color;

            document.getElementById('pregunta').innerText = datos.pregunta;
            respuestaCorrectaIndex = datos.correcta;
            respondido = false;

            const contenedorOpciones = document.getElementById('opciones');
            contenedorOpciones.innerHTML = '';

            datos.opciones.forEach((opcion, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcion';
                btn.innerText = `${String.fromCharCode(65 + index)}) ${opcion}`;
                btn.onclick = () => responder(index, btn);
                contenedorOpciones.appendChild(btn);
            });

            document.getElementById('card').style.display = 'block';
        }

        function responder(indiceSeleccionado, botonPulsado) {
            if (respondido) return;
            respondido = true;

            const botones = document.querySelectorAll('.btn-opcion');
            botones.forEach(btn => btn.disabled = true);

            if (indiceSeleccionado === respuestaCorrectaIndex) {
                botonPulsado.classList.add('correcta');
            } else {
                botonPulsado.classList.add('incorrecta');
                botones[respuestaCorrectaIndex].classList.add('correcta');
            }

            document.getElementById('btn-nuevo').style.display = 'block';
        }

        function volverAlQuesito() {
            document.getElementById('card').style.display = 'none';
            document.getElementById('btn-nuevo').style.display = 'none';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('quesito').style.display = 'block';
        }

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
