<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo ImproLUNES 60 💜</title>
    <style>
        /* ----------------------------------------------------------
            ESTILOS (BASADOS EN COLORES DE IMPROLAB 60)
            ---------------------------------------------------------- */
        :root {
            --color-lila-principal: #6c5ce7; /* Morado/Lila de la imagen */
            --color-lila-oscuro: #483d8b;
            --color-fondo-claro: #f5f5f5;
            --color-texto-claro: #ffffff;
            --color-texto-oscuro: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: var(--color-fondo-claro);
            color: var(--color-texto-oscuro);
            min-height: 100vh;
        }

        h1 { /* El h1 ahora será un contenedor para la imagen */
            color: var(--color-lila-oscuro);
            font-size: 2.5em; /* Se mantiene para compatibilidad si hubiera texto */
            margin-bottom: 5px;
            cursor: pointer; /* Para mantener la interacción de cierre de zoom */
        }

        /* Estilos específicos para la imagen del logo (en h1) */
        .logo-img {
            max-width: 100%; /* Asegura que la imagen no se desborde */
            height: auto; /* Mantiene la proporción */
            max-height: 100px; /* Limita la altura máxima del logo */
            display: block; /* Elimina espacio extra debajo de la imagen */
            margin: 0 auto; /* Centra la imagen si el h1 es más ancho */
        }

        /* Contenedor Principal (Simula la cartelera) */
        .container {
            background-color: var(--color-texto-claro);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
            border-top: 5px solid var(--color-lila-principal);
            display: flex;
            flex-direction: column;
        }

        /* Estilo de la imagen de encabezado (improlab60.jpg) */
        .header-image {
            order: 1; 
            width: 100%;
            height: 150px; /* Altura fija para el contenedor de la imagen */
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Asegura que la imagen no se desborde si es muy grande */
            background-color: #f0f0f0; /* Color de fondo si hay espacio vacío con 'contain' */
        }
        
        /* Estilos para la imagen dentro del header-image */
        .header-image img {
            width: 100%; /* La imagen ocupará todo el ancho del contenedor */
            height: 100%; /* La imagen ocupará toda la altura del contenedor */
            object-fit: contain; /* La imagen se escalará para caber */
            border-radius: 10px; /* Para que la imagen también tenga los bordes redondeados */
        }

        /* Estilos del Botón de Sorteo */
        #sortear-btn {
            order: 2; 
            width: 100%;
            padding: 15px;
            background-color: var(--color-lila-principal);
            color: var(--color-texto-claro);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 30px; 
            transition: background-color 0.3s;
        }

        #sortear-btn:hover:not(:disabled) {
            background-color: var(--color-lila-oscuro);
        }

        #sortear-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        /* Contenedores de Listas (Setup) */
        .setup-section {
            order: 4; 
            border-top: 2px dashed #ddd;
            padding-top: 20px;
            margin-top: 10px;
        }

        .setup-list {
            margin-bottom: 25px;
            padding: 0 10px;
            display: flex;
            gap: 20px;
        }

        .setup-list div {
            flex: 1;
        }

        /* Estilos de la lista de resultados */
        #resultados-sorteo {
            order: 3; 
            padding-top: 0; 
            margin-top: 0;
            margin-bottom: 0;
        }


        .resultado-grupo {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            cursor: pointer; 
        }

        /* Estilo para el resultado más reciente (el de arriba) */
        .resultado-grupo.nuevo {
            background-color: #ede7f6; 
            border: 2px solid var(--color-lila-principal);
            border-left: 5px solid var(--color-lila-principal);
            font-size: 1.1em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .resultado-grupo.nuevo strong {
            color: var(--color-lila-oscuro);
            font-size: 1.2em;
        }
        
        /* Estilo para los resultados antiguos (grises) */
        .resultado-grupo.antiguo {
            background-color: #f9f9f9;
            color: #777;
            border: 1px solid #ddd;
            border-left: 3px solid #ddd;
            font-size: 0.9em;
        }

        .resultado-grupo strong {
            color: inherit;
            font-size: 1.1em;
            display: block;
            margin-bottom: 5px;
        }

        /* NUEVO: Estilo para la pequeña explicación del juego */
        .juego-explicacion {
            font-size: 0.85em;
            color: #555;
            margin: 6px 0 10px 0;
            font-style: italic;
            border-left: 3px solid var(--color-lila-principal);
            padding-left: 8px;
            display: block;
        }
        
        /* Para mostrar la lista de personas y ejercicios en el Setup */
        .list-display {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            height: 150px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        
        /* Estilo general para las etiquetas de las listas */
        .list-display label {
            display: flex;
            align-items: center;
            margin: 2px 0;
            cursor: pointer;
        }
        
        .list-display input[type="checkbox"] {
            margin-right: 5px;
            transform: scale(1.1);
        }
        
        /* ESTILOS ESPECÍFICOS PARA PARTICIPANTES */
        .list-display label.ausente span {
            text-decoration: line-through;
            color: #c53929;
            font-style: italic;
        }
        
        .list-display label.sorteado span {
            color: #6c6c6c;
            font-style: italic;
        }
        
        /* ESTILOS ESPECÍFICOS PARA EJERCICIOS */
        .list-display label.ejercicio-excluido span, 
        .list-display label.ejercicio-usado span {
            text-decoration: line-through;
            color: #999;
            font-style: italic;
        }
        .list-display label.ejercicio-excluido input {
            /* Checkbox marcado para exclusión */
            filter: hue-rotate(90deg); 
        }

        /* --- CLASE DE AMPLIACIÓN (ZOOM) --- */
        .resultado-zoom {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000; 
            cursor: pointer; 
        }

        .resultado-zoom .resultado-grupo {
            max-width: 90%; 
            width: 800px;
            padding: 40px;
            font-size: 2em; 
            border-radius: 15px;
            background-color: var(--color-texto-claro); 
            border: 5px solid var(--color-lila-principal);
            box-shadow: 0 0 50px rgba(108, 92, 231, 0.8); 
            transform: scale(1);
            transition: transform 0.3s ease;
            text-align: center; 
        }
        
        /* ESTILO ESPECÍFICO PARA EL TÍTULO DENTRO DEL ZOOM */
        .resultado-zoom .resultado-grupo strong:first-child {
            font-size: 1.5em !important; 
            margin-bottom: 15px; 
            color: var(--color-lila-oscuro); 
            display: block; 
        }

        /* ESTILO ESPECÍFICO PARA LA EXPLICACIÓN DENTRO DEL ZOOM */
        .resultado-zoom .juego-explicacion {
            font-size: 0.6em !important;
            margin: 15px auto 20px auto;
            max-width: 90%;
            padding-left: 12px;
            border-left-width: 5px;
        }

        /* ESTILO ESPECÍFICO PARA LOS NOMBRES DENTRO DEL ZOOM */
        .resultado-zoom .resultado-grupo strong:last-child {
            font-size: 1.2em !important; 
            color: var(--color-texto-oscuro); 
            display: block;
        }
        
    </style>
</head>
<body>

    <h1 onclick="if (document.querySelector('.resultado-zoom')) document.querySelector('.resultado-zoom').remove();">
        <img src="ballena60logo.jpg" alt="Logo Impro LAB 60" class="logo-img">
    </h1>

    <div class="container">
        
        <div class="header-image">
            <img src="improlab60.jpg" alt="Impro LAB 60 - Generador de Escenas Improvisadas">
        </div>

        <button id="sortear-btn" onclick="iniciarSorteo()">INICIAR SORTEO (Asignar Escenas)</button>

        <div id="resultados-sorteo">
            </div>
        
        <div class="setup-section">
            <h2>⚙️ Estado y Configuración</h2>
            
            <div class="setup-list">
                <div>
                    <strong>Ejercicios Disponibles (Marca para Excluir):</strong>
                    <div id="ejercicios-display" class="list-display"></div>

                <div>
                    <strong>Participantes (Marca a los Ausentes):</strong>
                    <div id="participantes-display" class="list-display"></div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // ----------------------------------------------------------
        // --- DATA DE CONFIGURACIÓN Y EXPLICACIONES ---
        // ----------------------------------------------------------
        
        // Diccionario de explicaciones breves para cada juego de la lista
        const EXPLICACIONES_JUEGOS = {
            "2min. 1min. 30seg. 15seg": "La misma escena se repite cuatro veces comprimiendo el tiempo cada vez, obligando a ir directos al grano.",
            "50 años más tarde": "Los personajes se reencuentran medio siglo después, arrastrando el pasado y su nueva realidad física. O bien son personajes nuevos en el mismo lugar, 50 años después.",
            "Abecedario": "A cada participante se le asigna una letra del Abecedario, y siempre tiene que empezar a hablar con esa letra.",
            "Cambio de estilo": "A lo largo de la escena, se grita ¡Cambio! y los actores deben adoptar un género cinematográfico o teatral diferente.",
            "Completar la frase": "Dos personas del público completan las frases de los actores.",
            "Congelados": "A una señal, dos actores deben congelarse en su postura actual y los otros dos les reemplazan en la misma postura, empezando otra escena completamente distinta.",
            "Detective": "Ha habido un crimen y el detective tiene que adivinar, quién ha muerto, cómo ha muerto y quién lo ha matado.",
            "Cuatro Emociones": "El espacio se divide en cuatro zonas y cada cuadrante obliga a los actores a interpretar una emoción radicalmente distinta.",
            "Entrevista rara": "Un presentador excéntrico entrevista a invitados peculiares con una característica física o manía inusual.",
            "Estatuas": "El público coloca a los improvisadores en tres posturas: inicial, media y final, y la impro tiene que pasar por esas tres posturas.",
            "Excusa para llegar tarde": "Un personaje llega tardísimo a una cita y debe inventar tres justificaciones por las que ha llegado tarde.",
            "Final alternativo": "Se hace una impro, y cuando se termina, se rebobina a cierto momento, y hay que acabarla distinto.",
            "Giratoria y esquinas": "Actúan dos, dos más se colocan detrás formando un cuadrado, y el director va cambiándoles de posición de manera que sólo los dos de delante improvisan.",
            "Idioma inventado": "Se improvisa íntegramente en un idioma jerigonzoso o inventado, donde la emoción y la corporalidad mandan.",
            "La caja que no se abre": "Todos entran de dos en dos. Hay una caja que nunca llegan a abrir; los últimos dos deciden si la abren o no.",
            "Libro": "Uno lee frases sueltas de un libro, y el otro le da réplica improvisando.",
            "Marcas": "Los actores tienen que meter en la impro palabras relacionadas con alguna cosa que les diga el público (ej: marcas de coche, marcas de ropa...).",
            "Morir": "Los personajes deben encontrar una forma creativa, dramática o cómica de despedirse y morir en escena, las decide el público.",
            "Neutro+ entra y dice (ronda)": "Todos. Uno espera en neutro, entra otro que le tiene que proponer la escena, y así pasan todos.",
            "No me chiles que no te veo": "Con auriculares dos. Los otros dos hacen escena y tienen que repetir la misma escena los de los auriculares, que no habrán oído nada.",
            "Objeto/Animal 100%": "Un personaje adopta por completo los manierismos, tics o la personalidad de un animal u objeto inanimado, poco a poco, en porcentajes.",
            "Objeto misterioso (empieza cuando adivina)": "Un actor hace como que manipula un objeto; cuando el otro adivina qué objeto es, empieza la impro.",
            "Objeto sin nombre, sin usar": "Hay un objeto en escena que no se puede nombrar ni usar, pero que afecta a los personajes o hablan de él sin nombrarlo.",
            "Palabras que meter": "Los actores tienen que colar de forma natural en su diálogo una serie de palabras extrañas o impuestas.",
            "Pitonisa": "Una adivina lee el futuro de un cliente; tiene que adivinar la respuesta a sus tres preguntas.",
            "Secreto de dos y otro no sabe": "Dos personajes comparten un secreto jugoso del que el tercero está totalmente excluido, generando tensión cómica.",
            "Sólo preguntas": "Toda la conversación entre los personajes debe desarrollarse exclusivamente a base de preguntas.",
            "Sonidos/Banda sonora": "Los actores improvisan, y otros dos actores o alguien del público tiene que hacer sonidos ambientales.",
            "Tema absurdo, emoción real": "Se improvisa sobre algo absurdo o irreal, pero los actores tienen que sentir como reales todas las emociones.",
            "Títulos distintos + título escena": "Cada actor tiene un título distinto y tiene que llevar a eso la escena. La escena transcurre y son lo que diga el público.",
            "Tostadora": "El que se gira, improvisa.",
            "Votación público": "El público decide al finalizar la impro quién se va, y los que quedan tienen que repetir la impro haciendo el papel de ese actor. Se repite hasta que quede uno."
        };

        // Ejercicios ordenados alfabéticamente y con variantes/TODOS
        const EJERCICIOS_RAW = [
            "2min. 1min. 30seg. 15seg;TODOS",
            "50 años más tarde;4",
            "Abecedario;TODOS",
            "Cambio de estilo;3|2",
            "Completar la frase;2",
            "Congelados;4",
            "Detective;2",
            "Cuatro Emociones;4|3",
            "Entrevista rara;4|3",
            "Estatuas;3|2",
            "Excusa para llegar tarde;3",
            "Final alternativo;3|2",
            "Giratoria y esquinas;4",
            "Idioma inventado;4",
            "La caja que no se abre;TODOS",
            "Libro;2",
            "Marcas;2",
            "Morir;3|2",
            "Neutro+ entra y dice (ronda);TODOS",
            "No me chiles que no te veo;4",
            "Objeto/Animal 100%;3|2",
            "Objeto misterioso (empieza cuando adivina);2",
            "Objeto sin nombre, sin usar;2",
            "Palabras que meter;2",
            "Pitonisa;3",
            "Secreto de dos y otro no sabe;3",
            "Sólo preguntas;2",
            "Sonidos/Banda sonora;2",
            "Tema absurdo, emoción real;2",
            "Títulos distintos + título escena;3|2",
            "Tostadora;TODOS",
            "Votación público;4|3"
         ];

        const NOMBRES_INICIALES = [
            "Alba", "Bea G", "Bea O", "Cloe", "Cristina L", "Cristina M", "Elena", 
            "Irene", "Lucía", "María", "Marta", 
            "Vic"
        ];

        // ----------------------------------------------------------
        // --- ESTADO GLOBAL ---
        // ----------------------------------------------------------
        
        let ejerciciosDisponibles = []; 
        let ejerciciosExcluidos = new Set(); 
        let participantesDisponibles = []; 
        let participantesIniciales = [];  
        let participantesAusentes = new Set(); 
        let participantesSorteados = new Set(); 
        let ruletaIntervalId = null; 
        let minActoresRequeridos = 0;
        let ultimoEjercicioFueTodos = false; 

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function procesarEjercicios(rawList) {
            return rawList.map(e => {
                const [nombre, actoresStr] = e.split(';');
                const actores = actoresStr === 'TODOS' 
                    ? [0] 
                    : actoresStr.split('|').map(n => parseInt(n)).sort((a, b) => b - a);
                return { nombre, actores, usado: false };
            });
        }

        function inicializarDatos() {
            participantesIniciales = [...NOMBRES_INICIALES]; 
            participantesDisponibles = [...participantesIniciales];
            
            ejerciciosDisponibles = procesarEjercicios(EJERCICIOS_RAW);

            const actoresRequeridos = ejerciciosDisponibles
                .filter(e => e.actores[0] > 0)
                .flatMap(e => e.actores);
                
            minActoresRequeridos = actoresRequeridos.length > 0 
                ? Math.min(...actoresRequeridos) 
                : 0;

            mostrarEstadoSetup();
            document.body.addEventListener('click', manejarZoomResultado); 
            
            document.getElementById('participantes-display').addEventListener('change', manejarAusencia);
            document.getElementById('ejercicios-display').addEventListener('change', manejarExclusion);
        }

        function manejarExclusion(event) {
            if (event.target.type === 'checkbox' && event.target.name === 'excluir-ejercicio') {
                const nombre = event.target.value;
                if (event.target.checked) ejerciciosExcluidos.add(nombre);
                else ejerciciosExcluidos.delete(nombre);
                mostrarEstadoSetup();
            }
        }

        function manejarAusencia(event) {
            if (event.target.type === 'checkbox') {
                const nombre = event.target.value;
                if (event.target.checked) participantesAusentes.add(nombre);
                else participantesAusentes.delete(nombre);
                reinicializarParticipantesDisponibles();
                mostrarEstadoSetup();
            }
        }

        function reinicializarParticipantesDisponibles() {
            participantesDisponibles = participantesIniciales.filter(nombre => 
                !participantesAusentes.has(nombre) && !participantesSorteados.has(nombre)
            );
        }

        function mostrarEstadoSetup() {
            const ejerciciosHTML = ejerciciosDisponibles
                .map(e => {
                    const esUsado = e.usado;
                    const esExcluido = ejerciciosExcluidos.has(e.nombre);
                    let estadoClase = '';
                    let isDisabled = false;
                    let isChecked = false;
                    
                    if (esUsado) { estadoClase = 'ejercicio-usado'; isDisabled = true; } 
                    else if (esExcluido) { estadoClase = 'ejercicio-excluido'; isChecked = true; }

                    let actoresStr = e.actores[0] === 0 ? 'TODOS' : e.actores.join('|') + ' pers.';
                        
                    return `
                        <label class="${estadoClase}">
                            <input type="checkbox" name="excluir-ejercicio" value="${e.nombre}" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
                            <span>${e.nombre} (${actoresStr})</span>
                        </label>
                    `;
                })
                .join('');
            document.getElementById('ejercicios-display').innerHTML = ejerciciosHTML || '<p style="color:red;">Ninguno disponible</p>';

            const participantesHTML = participantesIniciales
                .map(nombre => {
                    const isAusente = participantesAusentes.has(nombre);
                    const isSorteado = participantesSorteados.has(nombre);
                    let estadoClase = '';
                    let estadoTexto = '';
                    let isDisabled = false;
                    let isChecked = false;

                    if (isAusente) { estadoClase = 'ausente'; estadoTexto = '(Ausente)'; isChecked = true; } 
                    else if (isSorteado) { estadoClase = 'sorteado'; estadoTexto = '(Sorteado)'; isDisabled = true; }

                    return `
                        <label class="${estadoClase}">
                            <input type="checkbox" value="${nombre}" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
                            <span>${nombre} ${estadoTexto}</span>
                        </label>
                    `;
                })
                .join('');
                
            document.getElementById('participantes-display').innerHTML = participantesHTML;

            const btn = document.getElementById('sortear-btn');
            const participantesPresentesRestantes = participantesDisponibles.length; 
            
            const ejerciciosNumeradosRestantes = ejerciciosDisponibles
                .filter(e => e.actores[0] > 0 && !e.usado && !ejerciciosExcluidos.has(e.nombre));
            
            const ejerciciosTodosRestantes = ejerciciosDisponibles
                .filter(e => e.actores[0] === 0 && !e.usado && !ejerciciosExcluidos.has(e.nombre));
            
            if (ejerciciosNumeradosRestantes.length === 0 && ejerciciosTodosRestantes.length === 0) {
                 btn.disabled = true;
                 btn.textContent = "✅ ¡FIN DEL SORTEO! No quedan más ejercicios.";
                 btn.onclick = null;
            } else if (participantesPresentesRestantes < minActoresRequeridos) {
                 if (ejerciciosTodosRestantes.length > 0) {
                    btn.disabled = false;
                    btn.textContent = `🛑 ÚLTIMO EJERCICIO DE RONDA (Sortear TODOS)`;
                    btn.onclick = iniciarSorteoTodos;
                 } else {
                    btn.disabled = false;
                    btn.textContent = "INICIAR NUEVA RONDA (Resetear Participantes)";
                    btn.onclick = iniciarNuevaRonda;
                 }
            } else {
                 btn.disabled = false;
                 btn.textContent = `SORTEAR PRÓXIMA ESCENA (Quedan ${participantesPresentesRestantes} personas)`;
                 btn.onclick = iniciarSorteo;
            }
        }
        
        function iniciarNuevaRonda() {
            participantesSorteados = new Set();
            reinicializarParticipantesDisponibles();
            
            document.getElementById('resultados-sorteo').insertAdjacentHTML('afterbegin', `
                <div class="resultado-grupo nuevo" style="background-color: #fce4ec; border-color: #e91e63;">
                    <strong>¡NUEVA RONDA INICIADA!</strong>
                    <span class="juego-explicacion">Participantes reseteados. Sorteando con ejercicios restantes.</span>
                    <strong>Participantes reseteados.</strong>
                </div>
            `);

            mostrarEstadoSetup();
        }

        function abrirZoomResultado(resultadoElement) {
            const zoomExistente = document.querySelector('.resultado-zoom');
            if(zoomExistente) zoomExistente.remove();

            const zoomContainer = document.createElement('div');
            zoomContainer.classList.add('resultado-zoom');
            
            resultadoElement.remove(); 
            zoomContainer.appendChild(resultadoElement);
            document.body.appendChild(zoomContainer);

            return resultadoElement;
        }

        function iniciarRuleta(elementoResultado, resultadoFinal) {
            const TAMANO_FIJO_RULETA = 6; 
            const DURACION_TOTAL = 2500;
            const INTERVALO_INICIAL = 75;
            
            const actoresDisponiblesRuleta = participantesIniciales.filter(nombre => !participantesAusentes.has(nombre));
            const ejerciciosDisponiblesRuleta = EJERCICIOS_RAW.map(e => e.split(';')[0]);

            const nombreElemento = elementoResultado.querySelector('strong:first-child');
            const explicacionElemento = elementoResultado.querySelector('.juego-explicacion');
            const improvisanElemento = elementoResultado.querySelector('strong:last-child');
            const ruletaAudio = document.getElementById('ruleta-audio');
            const bingAudio = document.getElementById('bing-audio'); 
            
            let tiempoTranscurrido = 0;
            elementoResultado.style.cursor = 'wait';
            
            ruletaAudio.play().catch(e => console.log('Audio no iniciado.'));

            const rotar = () => {
                const improFalsa = ejerciciosDisponiblesRuleta[Math.floor(Math.random() * ejerciciosDisponiblesRuleta.length)];
                shuffleArray(actoresDisponiblesRuleta);
                const grupoFalso = actoresDisponiblesRuleta.slice(0, TAMANO_FIJO_RULETA).join(', '); 

                nombreElemento.innerHTML = `${improFalsa}`;
                if (explicacionElemento) explicacionElemento.innerHTML = "Girando ruleta...";
                improvisanElemento.innerHTML = `${grupoFalso}`;
            };
            
            const loopRuleta = () => {
                const porcentaje = Math.min(tiempoTranscurrido / DURACION_TOTAL, 1);
                const factorDesaceleracion = porcentaje * porcentaje;
                const maxIntervalo = 500;
                const nuevoIntervalo = INTERVALO_INICIAL + (maxIntervalo - INTERVALO_INICIAL) * factorDesaceleracion;
                
                rotar();
                tiempoTranscurrido += nuevoIntervalo;

                if (tiempoTranscurrido < DURACION_TOTAL) {
                    ruletaIntervalId = setTimeout(loopRuleta, nuevoIntervalo);
                } else {
                    clearTimeout(ruletaIntervalId);
                    ruletaIntervalId = null;
                    
                    ruletaAudio.pause();
                    ruletaAudio.currentTime = 0; 
                    bingAudio.play().catch(e => console.log('Audio BING no iniciado.'));
                    
                    const textoExplicacion = EXPLICACIONES_JUEGOS[resultadoFinal.impro.nombre] || "Ejercicio libre de improvisación.";
                    
                    nombreElemento.innerHTML = `${resultadoFinal.impro.nombre}`;
                    if (explicacionElemento) explicacionElemento.innerHTML = `${textoExplicacion}`;
                    improvisanElemento.innerHTML = `${resultadoFinal.grupo.join(', ')}`;
                    
                    elementoResultado.style.cursor = 'pointer';
                }
            };
            
            loopRuleta();
        }

        function iniciarSorteo() {
            if (ruletaIntervalId) return;
            
            const btn = document.getElementById('sortear-btn');
            btn.disabled = true; 
            
            const N = participantesDisponibles.length;
            
            let ejerciciosPosibles = ejerciciosDisponibles
                .filter(e => e.actores[0] > 0 && !e.usado && !ejerciciosExcluidos.has(e.nombre));
            
            let improElegida = null;
            let actoresReales = 0;

            let ejerciciosAjustados = ejerciciosPosibles.filter(e => 
                e.actores[e.actores.length - 1] <= N
            );

            let ejerciciosFiltrados = ejerciciosAjustados.filter(e => {
                const opcionesQueCaben = e.actores.filter(a => a <= N);
                const cumpleAntiUno = opcionesQueCaben.some(a => (N - a) !== 1);
                if (!cumpleAntiUno) return false;

                if (N === 5 && e.actores.includes(4)) {
                    if (!e.actores.includes(3) && !e.actores.includes(2)) return false; 
                }
                return true;
            });

            if (ejerciciosFiltrados.length > 0) ejerciciosAjustados = ejerciciosFiltrados;
            if (ejerciciosAjustados.length === 0) return iniciarSorteoTodos();

            const indiceImpro = Math.floor(Math.random() * ejerciciosAjustados.length);
            improElegida = ejerciciosAjustados[indiceImpro];

            for (const numActores of improElegida.actores) {
                if (numActores <= N) { actoresReales = numActores; break; }
            }
            
            if (N === 5) {
                if (improElegida.actores.includes(3)) actoresReales = 3;
                else if (improElegida.actores.includes(2)) actoresReales = 2;
            } else if (N === 3 && improElegida.actores.includes(3)) {
                actoresReales = 3;
            } else if (N === 2 && improElegida.actores.includes(2)) {
                actoresReales = 2;
            }

            improElegida.usado = true;

            const grupoElegido = [];
            const disponiblesParaSorteo = [...participantesDisponibles];
            
            for (let i = 0; i < actoresReales; i++) {
                const indicePersona = Math.floor(Math.random() * disponiblesParaSorteo.length);
                grupoElegido.push(disponiblesParaSorteo.splice(indicePersona, 1)[0]);
            }
            
            grupoElegido.forEach(nombre => participantesSorteados.add(nombre));
            reinicializarParticipantesDisponibles(); 

            const resultadoTemporal = { impro: { nombre: '... ROTANDO ...', actores: actoresReales }, grupo: [''] }; 
            const nuevoResultadoElement = mostrarResultado(resultadoTemporal.impro, resultadoTemporal.grupo);
            const elementoZoom = abrirZoomResultado(nuevoResultadoElement);

            iniciarRuleta(elementoZoom, { impro: improElegida, grupo: grupoElegido, actores: actoresReales });
        }

        function iniciarSorteoTodos() {
            if (ruletaIntervalId) return;

            const btn = document.getElementById('sortear-btn');
            btn.disabled = true;
            ultimoEjercicioFueTodos = true; 

            const participantesPresentesTotales = participantesIniciales.filter(nombre => !participantesAusentes.has(nombre));
            let ejerciciosTodosPosibles = ejerciciosDisponibles.filter(e => e.actores[0] === 0 && !e.usado && !ejerciciosExcluidos.has(e.nombre));

            if (ejerciciosTodosPosibles.length === 0) {
                btn.disabled = false;
                ultimoEjercicioFueTodos = false; 
                return iniciarNuevaRonda();
            }

            const indiceImpro = Math.floor(Math.random() * ejerciciosTodosPosibles.length);
            const improElegida = ejerciciosTodosPosibles[indiceImpro];
            improElegida.usado = true;

            const grupoElegidoDisplay = ["Todos"];
            const resultadoTemporal = { impro: { nombre: '... ROTANDO ...', actores: participantesPresentesTotales.length }, grupo: [''] }; 
            const nuevoResultadoElement = mostrarResultado(resultadoTemporal.impro, resultadoTemporal.grupo);
            const elementoZoom = abrirZoomResultado(nuevoResultadoElement);

            iniciarRuleta(elementoZoom, { impro: improElegida, grupo: grupoElegidoDisplay, actores: participantesPresentesTotales.length });
        }

        function mostrarResultado(impro, grupo) {
            const resultadosDiv = document.getElementById('resultados-sorteo');
            
            const resultadoAnterior = resultadosDiv.querySelector('.resultado-grupo.nuevo');
            if (resultadoAnterior) {
                resultadoAnterior.classList.remove('nuevo');
                resultadoAnterior.classList.add('antiguo');
            }

            const grupoTexto = grupo.join(', ');
            const textoExplicacion = EXPLICACIONES_JUEGOS[impro.nombre] || "";
            
            const nuevoResultadoHTML = `
                <div class="resultado-grupo nuevo">
                    <strong>${impro.nombre}</strong>
                    <span class="juego-explicacion">${textoExplicacion}</span>
                    <strong>${grupoTexto}</strong>
                </div>
            `;
            
            resultadosDiv.insertAdjacentHTML('afterbegin', nuevoResultadoHTML);
            return resultadosDiv.querySelector('.resultado-grupo.nuevo');
        }
        
        function manejarZoomResultado(event) {
            if (ruletaIntervalId) return; 

            let resultadoGrupo = event.target.closest('.resultado-grupo.nuevo');
            const resultadosDiv = document.getElementById('resultados-sorteo');
            const btn = document.getElementById('sortear-btn'); 

            if ((resultadoGrupo && resultadoGrupo.parentNode.classList.contains('resultado-zoom')) || event.target.classList.contains('resultado-zoom')) {
                const zoomContainer = event.target.classList.contains('resultado-zoom') ? event.target : resultadoGrupo.parentNode;
                const grupoZoomed = zoomContainer.querySelector('.resultado-grupo.nuevo');
                
                if (ultimoEjercicioFueTodos) {
                    if (grupoZoomed) resultadosDiv.insertAdjacentElement('afterbegin', grupoZoomed);
                    zoomContainer.remove(); 
                    ultimoEjercicioFueTodos = false;
                    iniciarNuevaRonda();
                    return;
                }
                
                if (grupoZoomed) resultadosDiv.insertAdjacentElement('afterbegin', grupoZoomed);
                zoomContainer.remove(); 
                
                if (btn.disabled) mostrarEstadoSetup(); 
                return;
            }
            
            if (resultadoGrupo && !resultadoGrupo.parentNode.classList.contains('resultado-zoom')) {
                abrirZoomResultado(resultadoGrupo);
            }
        }

        window.onload = inicializarDatos;
    </script>
