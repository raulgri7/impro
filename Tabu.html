<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tabú Express 🚫</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            user-select: none;
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin-bottom: 10px;
        }

        .titulo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #f43f5e;
            text-transform: uppercase;
        }

        .timer-box {
            background: #1e293b;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #fbbf24;
            border: 2px solid #334155;
        }

        /* --- TARJETA DE TABÚ --- */
        .tarjeta-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 480px;
            margin: 10px 0;
        }

        .card {
            background: #ffffff;
            color: #0f172a;
            border-radius: 24px;
            padding: 25px 20px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: none;
        }

        .palabra-clave {
            font-size: clamp(1.8rem, 5vh, 2.3rem);
            font-weight: 900;
            color: #2563eb;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 12px;
            border-bottom: 4px solid #f1f5f9;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .seccion-prohibidas {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prohibida-tag {
            background: #ffe4e6;
            color: #e11d48;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- BOTÓN DE CONTROL ÚNICO --- */
        .controles-container {
            width: 100%;
            max-width: 480px;
        }

        .btn {
            border: none;
            padding: 18px;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s;
            width: 100%;
            background: #3b82f6;
            color: white;
        }

        .btn:active { transform: scale(0.96); }

        .loading {
            font-size: 1.1rem;
            color: #94a3b8;
            text-align: center;
        }

        .status-badge {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

        </div>

            <div id="prohibidas" class="seccion-prohibidas"></div>

            { palabra: "PELOTA", prohibidas: ["JUGAR", "REDONDA", "BOTAR", "BALÓN"] },
            { palabra: "CONCIERTO", prohibidas: ["MÚSICA", "CANTANTE", "ENTRADAS", "EN DIRECTO"] },
            { palabra: "CEMENTERIO", prohibidas: ["MUERTOS", "TUMBAS", "FLORES", "FANTASMA"] },
            { palabra: "CASTILLO", prohibidas: ["REY", "PRÍNCIPE", "TORRE", "MURALLA"] },
            { palabra: "VACACIONES", prohibidas: ["VERANO", "VIAJAR", "DESCANSO", "TRABAJO"] },
            { palabra: "TAXI", prohibidas: ["COCHE", "CONDUCTOR", "PAGAR", "CIUDAD"] },
            { palabra: "AUTOBÚS", prohibidas: ["VIAJEROS", "PARADA", "CONDUCTOR", "TRANSPORTE"] },
            { palabra: "METRO", prohibidas: ["TREN", "SUBTERRÁNEO", "ESTACIÓN", "CIUDAD"] },
            { palabra: "AVIONETA", prohibidas: ["AVIÓN", "VOLAR", "PEQUEÑA", "PILOTO"] }
        ];

        let bancoIA = [];
        let palabrasUsadas = [];
        let pidiendoIA = false;
        
        let tiempoRestante = 60;
        let timerInterval = null;
        let audioCtx = null;

        window.addEventListener('DOMContentLoaded', () => {
            pedirLoteTarjetasIA();
        });

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function sonarBuzzer() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);

            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- PRECARGA Y LÓGICA DE IA (LOTES DE 10, RECARGA EN <= 3) ---

        async function pedirLoteTarjetasIA() {
            if (pidiendoIA) return;
            pidiendoIA = true;

            const prompt = `Genera un lote de 10 tarjetas para el juego Tabú en español.
            CRÍTICO Y OBLIGATORIO:
            1. Usa SOLO palabras clave muy sencillas, conocidas y cotidianas (ejemplos: Parapente, Microondas, Dentista, Acuario, Canguro, Barco, Fotógrafo).
            2. NUNCA utilices expresiones compuestas, modismos raros ni conceptos rebuscados/técnicos.
            ${palabrasUsadas.length > 0 ? `3. NO repitas NINGUNA de estas palabras ya usadas: ${palabrasUsadas.join(', ')}.` : ''}
            
            Devuelve ÚNICAMENTE un array JSON válido de objetos (sin Markdown, sin bloques de código):
            [
              { "palabra": "PALABRA 1", "prohibidas": ["PROHIBIDA 1", "PROHIBIDA 2", "PROHIBIDA 3", "PROHIBIDA 4"] },
              { "palabra": "PALABRA 2", "prohibidas": ["PROHIBIDA 1", "PROHIBIDA 2", "PROHIBIDA 3", "PROHIBIDA 4"] }
            ]`;

            try {
                const response = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const nuevasTarjetas = JSON.parse(rawText);
                
                if (Array.isArray(nuevasTarjetas) && nuevasTarjetas.length > 0) {
                    const filtradas = nuevasTarjetas.filter(t => !palabrasUsadas.includes(t.palabra.toUpperCase()));
                    bancoIA.push(...filtradas);
                    document.getElementById('status-cargando').innerText = `IA activa 🤖 (${bancoIA.length} preparadas)`;
                }
            } catch (e) {
                console.error("Error al cargar tarjetas de IA:", e);
                document.getElementById('status-cargando').innerText = "Modo offline (lista local) 📦";
            } finally {
                pidiendoIA = false;
            }
        }

        function obtenerSiguienteTarjeta() {
            // Si nos quedan 3 o menos en el saco de la IA, pedimos 10 más de inmediato
            if (bancoIA.length <= 3) {
                pedirLoteTarjetasIA();
            }

            let seleccion = null;

            // Prioridad a la IA si tiene tarjetas disponibles
            if (bancoIA.length > 0) {
                const idx = Math.floor(Math.random() * bancoIA.length);
                seleccion = bancoIA.splice(idx, 1)[0];
            } 
            // Si aún no ha vuelto la IA, usamos la lista de 100 locales
            else {
                const idx = Math.floor(Math.random() * tarjetasIniciales.length);
                seleccion = tarjetasIniciales[idx];
            }

            if (seleccion) {
                const palabraUpper = seleccion.palabra.toUpperCase();
                if (!palabrasUsadas.includes(palabraUpper)) {
                    palabrasUsadas.push(palabraUpper);
                    if (palabrasUsadas.length > 150) palabrasUsadas.shift();
                }
            }

            return seleccion;
        }

        // --- CONTROL DE TIEMPO Y FLUJO DE JUEGO ---

        function iniciarTimer() {
            clearInterval(timerInterval);
            tiempoRestante = 60;
            document.getElementById('timer').innerText = tiempoRestante + 's';

            timerInterval = setInterval(() => {
                tiempoRestante--;
                document.getElementById('timer').innerText = tiempoRestante + 's';

                if (tiempoRestante <= 0) {
                    clearInterval(timerInterval);
                    sonarBuzzer();
                    alert("¡TIEMPO AGOTADO! ⌛");
                }
            }, 1000);
        }

        function nuevaTarjeta() {
            initAudio();
            const datos = obtenerSiguienteTarjeta();
            
            if (datos) {
                renderizarTarjeta(datos);
                document.getElementById('btn-siguiente').innerText = '¡Siguiente Tarjeta! ⏩';
                iniciarTimer();
            }
        }

        function renderizarTarjeta(datos) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('palabra-clave').innerText = datos.palabra;

            const contProhibidas = document.getElementById('prohibidas');
            contProhibidas.innerHTML = '';

            datos.prohibidas.forEach(p => {
                const div = document.createElement('div');
                div.className = 'prohibida-tag';
                div.innerText = p;
                contProhibidas.appendChild(div);
            });

            document.getElementById('card').style.display = 'block';
        }
