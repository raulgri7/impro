<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo ImproLAB 60 💜</title>
    <style>
        /* ----------------------------------------------------------
           ESTILOS (BASADOS EN COLORES DE IMPROLAB 60)
           ---------------------------------------------------------- */
        :root {
            --color-lila-principal: #6c5ce7; /* Morado/Lila de la imagen */
            --color-lila-oscuro: #483d8b;
            --color-fondo-claro: #f5f5f5;
            --color-texto-claro: #ffffff;
            --color-texto-oscuro: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: var(--color-fondo-claro);
            color: var(--color-texto-oscuro);
            min-height: 100vh;
        }

        h1 {
            color: var(--color-lila-oscuro);
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        /* Contenedor Principal (Simula la cartelera) */
        .container {
            background-color: var(--color-texto-claro);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
            border-top: 5px solid var(--color-lila-principal);
        }

        /* Estilo de la imagen abstracta (Fondo Lila) */
        .header-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(45deg, var(--color-lila-principal), #b2a4ff);
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: var(--color-texto-claro);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* Estilos del Botón de Sorteo */
        #sortear-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--color-lila-principal);
            color: var(--color-texto-claro);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        #sortear-btn:hover:not(:disabled) {
            background-color: var(--color-lila-oscuro);
        }

        #sortear-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        /* Contenedores de Listas */
        .setup-list {
            margin-bottom: 25px;
            padding: 0 10px;
            display: flex;
            gap: 20px;
        }

        .setup-list div {
            flex: 1;
        }

        /* Estilos de la lista de resultados */
        #resultados-sorteo {
            margin-top: 30px;
            border-top: 2px dashed var(--color-lila-principal);
            padding-top: 20px;
        }

        .resultado-grupo {
            background-color: #ede7f6; /* Lila muy claro */
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid var(--color-lila-principal);
        }

        .resultado-grupo strong {
            color: var(--color-lila-oscuro);
            font-size: 1.1em;
            display: block;
            margin-bottom: 5px;
        }
        
        /* Para mostrar la lista de personas y ejercicios en el Setup */
        .list-display {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            height: 150px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        
        .list-display p {
            margin: 2px 0;
        }
    </style>
</head>
<body>

    <h1>Sorteador IMPRO LAB 60</h1>
    <p>Organiza a tu elenco en grupos al azar para los ejercicios.</p>

    <div class="container">
        
        <div class="header-image">
            GENERADOR DE ESCENAS IMPROVISADAS 🎭
        </div>

        <h2>⚙️ Configuración del Sorteo</h2>
        
        <div class="setup-list">
            <div>
                <strong>Ejercicios Disponibles (Nombre; Actores):</strong>
                <div id="ejercicios-display" class="list-display"></div>
            </div>
            <div>
                <strong>Participantes Iniciales:</strong>
                <div id="participantes-display" class="list-display"></div>
            </div>
        </div>

        <button id="sortear-btn" onclick="iniciarSorteo()">INICIAR SORTEO (Asignar Escenas)</button>

        <div id="resultados-sorteo">
            <p style="text-align: center; color: #777;">Haz clic en el botón para comenzar a sortear ejercicios y asignar participantes.</p>
        </div>
    </div>


    <script>
        // ----------------------------------------------------------
        // --- DATA DE CONFIGURACIÓN (TÚ PUEDES EDITAR ESTO) ---
        // ----------------------------------------------------------
        
        // Formato: "Nombre del ejercicio;Número de actores necesarios"
        const EJERCICIOS_RAW = [
            "La Congelación;2",
            "Monólogo a Cuatro;4",
            "Objeto Extraño;3",
            "Carrera de Géneros;5",
            "El Juicio del Siglo;8",
            "El Barco Se Hunde;7",
            "Máquina del Tiempo;3",
            "Noticias Absurdas;2" 
        ];

        // Lista de todos los nombres (puedes añadir o quitar)
        const NOMBRES_INICIALES = [
            "Dani", "Raúl", "Álvaro", "Juan", "Pedro", "Ángeles", 
            "Marta", "Silvia", "Javi", "Carlos", "Elena", "Lucas",
            "Paco", "Nuria" // Inventando unos cuantos para pruebas
        ];

        // ----------------------------------------------------------
        // --- LÓGICA DEL SORTEO ---
        // ----------------------------------------------------------
        
        let ejerciciosDisponibles = [];
        let participantesDisponibles = [];
        let ejerciciosYaUsados = new Set();


        /** Inicializa los datos, parseando los raw y mostrando en la interfaz. */
        function inicializarDatos() {
            // Clonar listas para que los arrays originales no se modifiquen
            participantesDisponibles = [...NOMBRES_INICIALES];
            
            ejerciciosDisponibles = EJERCICIOS_RAW.map(e => {
                const [nombre, actores] = e.split(';');
                return { nombre, actores: parseInt(actores) };
            });

            // Mostrar el estado inicial en la interfaz
            mostrarEstadoSetup();
            document.getElementById('resultados-sorteo').innerHTML = '<p style="text-align: center; color: #777;">Haz clic en el botón para comenzar a sortear ejercicios y asignar participantes.</p>';
        }

        /** Muestra las listas iniciales y el estado actual de los participantes. */
        function mostrarEstadoSetup() {
            const ejerciciosHTML = ejerciciosDisponibles
                .map(e => `<p>${e.nombre} (${e.actores} pers.)</p>`)
                .join('');
            document.getElementById('ejercicios-display').innerHTML = ejerciciosHTML;

            const participantesHTML = participantesDisponibles
                .map(n => `<p>${n}</p>`)
                .join('');
            document.getElementById('participantes-display').innerHTML = participantesHTML;

            const btn = document.getElementById('sortear-btn');
            if (participantesDisponibles.length === 0 || ejerciciosDisponibles.length === 0) {
                 btn.disabled = true;
                 btn.textContent = "FIN DEL SORTEO (No quedan ejercicios o personas)";
            } else {
                 btn.disabled = false;
                 btn.textContent = `INICIAR SORTEO (Quedan ${participantesDisponibles.length} personas)`;
            }
        }

        /**
         * Realiza la lógica principal: sortea una impro y el número de personas requerido.
         */
        function iniciarSorteo() {
            if (participantesDisponibles.length === 0 || ejerciciosDisponibles.length === 0) {
                mostrarEstadoSetup();
                return;
            }

            // 1. Sortear Ejercicio (sin repetir)
            // Filtramos solo los ejercicios que no se hayan usado y que se puedan hacer con los participantes restantes
            const ejerciciosPosibles = ejerciciosDisponibles.filter(e => 
                !ejerciciosYaUsados.has(e.nombre) && e.actores <= participantesDisponibles.length
            );

            if (ejerciciosPosibles.length === 0) {
                document.getElementById('resultados-sorteo').innerHTML += `
                    <p style="color: #c53929; font-weight: bold;">
                        🛑 ¡SORTEO PARADO! No quedan ejercicios que se ajusten al número de personas restantes (${participantesDisponibles.length}).
                    </p>
                `;
                ejerciciosDisponibles = []; // Marcar como acabado
                mostrarEstadoSetup();
                return;
            }

            const indiceImpro = Math.floor(Math.random() * ejerciciosPosibles.length);
            const improElegida = ejerciciosPosibles[indiceImpro];

            // 2. Marcar ejercicio como usado
            ejerciciosYaUsados.add(improElegida.nombre);
            
            // 3. Sortear Participantes
            const grupoElegido = [];
            for (let i = 0; i < improElegida.actores; i++) {
                // Sortea un índice dentro de los participantes disponibles
                const indicePersona = Math.floor(Math.random() * participantesDisponibles.length);
                
                // Mueve la persona de disponibles al grupo de la impro
                grupoElegido.push(participantesDisponibles.splice(indicePersona, 1)[0]);
            }

            // 4. Mostrar Resultado
            mostrarResultado(improElegida, grupoElegido);

            // 5. Actualizar interfaz
            mostrarEstadoSetup();
        }

        /** Formatea y añade el resultado a la interfaz. */
        function mostrarResultado(impro, grupo) {
            const resultadosDiv = document.getElementById('resultados-sorteo');
            
            // Limpiar mensaje inicial si es el primer sorteo
            if (resultadosDiv.querySelector('p[style*="center"]')) {
                resultadosDiv.innerHTML = '<h2>Resultados del Sorteo:</h2>';
            }

            const nuevoResultadoHTML = `
                <div class="resultado-grupo">
                    <strong>🎬 Escena: ${impro.nombre}</strong> (Requiere ${impro.actores} actores)<br>
                    <strong>👥 Grupo Asignado:</strong> ${grupo.join(', ')}
                </div>
            `;
            
            // Añadir el nuevo resultado al inicio de la lista
            resultadosDiv.insertAdjacentHTML('beforeend', nuevoResultadoHTML);
        }

        // Ejecutar al cargar la página
        window.onload = inicializarDatos;
    </script>

</body>
</html>
