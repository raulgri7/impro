<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo ImproLAB 60 💜</title>
    <style>
        /* ----------------------------------------------------------
           ESTILOS (BASADOS EN COLORES DE IMPROLAB 60)
           ---------------------------------------------------------- */
        :root {
            --color-lila-principal: #6c5ce7; /* Morado/Lila de la imagen */
            --color-lila-oscuro: #483d8b;
            --color-fondo-claro: #f5f5f5;
            --color-texto-claro: #ffffff;
            --color-texto-oscuro: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: var(--color-fondo-claro);
            color: var(--color-texto-oscuro);
            min-height: 100vh;
        }

        h1 { /* El h1 ahora será un contenedor para la imagen */
            color: var(--color-lila-oscuro);
            font-size: 2.5em; /* Se mantiene para compatibilidad si hubiera texto */
            margin-bottom: 5px;
            cursor: pointer; /* Para mantener la interacción de cierre de zoom */
        }

        /* Estilos específicos para la imagen del logo (en h1) */
        .logo-img {
            max-width: 100%; /* Asegura que la imagen no se desborde */
            height: auto; /* Mantiene la proporción */
            max-height: 100px; /* Limita la altura máxima del logo */
            display: block; /* Elimina espacio extra debajo de la imagen */
            margin: 0 auto; /* Centra la imagen si el h1 es más ancho */
        }

        /* Contenedor Principal (Simula la cartelera) */
        .container {
            background-color: var(--color-texto-claro);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
            border-top: 5px solid var(--color-lila-principal);
            display: flex;
            flex-direction: column;
        }

        /* Estilo de la imagen de encabezado (improlab60.jpg) */
        .header-image {
            order: 1; 
            width: 100%;
            height: 150px; /* Altura fija para el contenedor de la imagen */
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Asegura que la imagen no se desborde si es muy grande */
            background-color: #f0f0f0; /* Color de fondo si hay espacio vacío con 'contain' */
        }
        
        /* Estilos para la imagen dentro del header-image */
        .header-image img {
            width: 100%; /* La imagen ocupará todo el ancho del contenedor */
            height: 100%; /* La imagen ocupará toda la altura del contenedor */
            object-fit: contain; /* La imagen se escalará para caber */
            border-radius: 10px; /* Para que la imagen también tenga los bordes redondeados */
        }

        /* Estilos del Botón de Sorteo */
        #sortear-btn {
            order: 2; 
            width: 100%;
            padding: 15px;
            background-color: var(--color-lila-principal);
            color: var(--color-texto-claro);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 30px; 
            transition: background-color 0.3s;
        }

        #sortear-btn:hover:not(:disabled) {
            background-color: var(--color-lila-oscuro);
        }

        #sortear-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        /* Contenedores de Listas (Setup) */
        .setup-section {
            order: 4; 
            border-top: 2px dashed #ddd;
            padding-top: 20px;
            margin-top: 10px;
        }

        .setup-list {
            margin-bottom: 25px;
            padding: 0 10px;
            display: flex;
            gap: 20px;
        }

        .setup-list div {
            flex: 1;
        }

        /* Estilos de la lista de resultados */
        #resultados-sorteo {
            order: 3; 
            padding-top: 0; 
            margin-top: 0;
            margin-bottom: 0;
        }


        .resultado-grupo {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            cursor: pointer; 
        }

        /* Estilo para el resultado más reciente (el de arriba) */
        .resultado-grupo.nuevo {
            background-color: #ede7f6; 
            border: 2px solid var(--color-lila-principal);
            border-left: 5px solid var(--color-lila-principal);
            font-size: 1.1em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .resultado-grupo.nuevo strong {
            color: var(--color-lila-oscuro);
            font-size: 1.2em;
        }
        
        /* Estilo para los resultados antiguos (grises) */
        .resultado-grupo.antiguo {
            background-color: #f9f9f9;
            color: #777;
            border: 1px solid #ddd;
            border-left: 3px solid #ddd;
            font-size: 0.9em;
        }

        .resultado-grupo strong {
            color: inherit;
            font-size: 1.1em;
            display: block;
            margin-bottom: 5px;
        }
        
        /* Para mostrar la lista de personas y ejercicios en el Setup */
        .list-display {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            height: 150px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        
        .list-display label {
            display: flex;
            align-items: center;
            margin: 2px 0;
            cursor: pointer;
        }
        
        .list-display label.ausente span {
            text-decoration: line-through;
            color: #c53929;
            font-style: italic;
        }
        
        .list-display label.sorteado span {
            color: #6c6c6c;
            font-style: italic;
        }
        
        .list-display input[type="checkbox"] {
            margin-right: 5px;
            transform: scale(1.1);
        }
        
        /* NUEVO ESTILO: Tachar ejercicios ya usados */
        .list-display p.ejercicio-usado {
            text-decoration: line-through;
            color: #999;
        }

        /* --- CLASE DE AMPLIACIÓN (ZOOM) --- */
        .resultado-zoom {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9); 
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000; 
            cursor: pointer; 
        }

        .resultado-zoom .resultado-grupo {
            max-width: 90%; 
            width: 800px;
            padding: 40px;
            font-size: 2em; 
            border-radius: 15px;
            background-color: var(--color-texto-claro); 
            border: 5px solid var(--color-lila-principal);
            box-shadow: 0 0 50px rgba(108, 92, 231, 0.8); 
            transform: scale(1);
            transition: transform 0.3s ease;
            text-align: center; 
        }
        
        /* ESTILO ESPECÍFICO PARA EL TÍTULO DENTRO DEL ZOOM */
        .resultado-zoom .resultado-grupo strong:first-child {
            font-size: 1.5em !important; 
            margin-bottom: 15px; 
            color: var(--color-lila-oscuro); 
            display: block; 
        }

        /* ESTILO ESPECÍFICO PARA LOS NOMBRES DENTRO DEL ZOOM */
        .resultado-zoom .resultado-grupo strong:last-child {
            font-size: 1.2em !important; 
            color: var(--color-texto-oscuro); 
            display: block;
        }
        
    </style>
</head>
<body>
    
    <audio id="ruleta-audio" loop>
        <source src="482663__joao_janz__roulette-wheel-spin-loop-1_1.wav" type="audio/mpeg"> 
        Tu navegador no soporta el elemento de audio.
    </audio>

    <audio id="bing-audio">
        <source src="83769__digifishmusic__skip_that_1.wav" type="audio/mpeg"> 
        Tu navegador no soporta el elemento de audio.
    </audio>

    <h1 onclick="if (document.querySelector('.resultado-zoom')) document.querySelector('.resultado-zoom').remove();">
        <img src="ballena60logo.jpg" alt="Logo Impro LAB 60" class="logo-img">
    </h1>

    <div class="container">
        
        <div class="header-image">
            <img src="improlab60.jpg" alt="Impro LAB 60 - Generador de Escenas Improvisadas">
        </div>

        <button id="sortear-btn" onclick="iniciarSorteo()">INICIAR SORTEO (Asignar Escenas)</button>

        <div id="resultados-sorteo">
       
        </div>
        
        <div class="setup-section">
            <h2>⚙️ Estado y Configuración</h2>
            
            <div class="setup-list">
                <div>
                    <strong>Ejercicios Disponibles (Nombre; Actores):</strong>
                    <div id="ejercicios-display" class="list-display"></div>
                </div>
                <div>
                    <strong>Participantes (Marca a los Ausentes):</strong>
                    <div id="participantes-display" class="list-display"></div>
                </div>
            </div>
        </div>
    </div>


    <script>
        // ----------------------------------------------------------
        // --- DATA DE CONFIGURACIÓN ---
        // ----------------------------------------------------------
        
        // Ejercicios ordenados alfabéticamente y con variantes/TODOS
        const EJERCICIOS_RAW = [
            "2min. 1min. 30seg. 15seg;TODOS", 
            "50 años más tarde;4", 
            "Detective;2", 
            "Emociones (escenario en cuatro);4|3", 
            "Entrevista rara;4|3", 
            "Estatuas;3|2", 
            "Excusa para llegar tarde;3", 
            "Giratoria y esquinas;4", 
            "Idioma inventado;4", 
            "La caja que no se abre;TODOS", 
            "Libro;2", 
            "Morir;3|2", 
            "Neutro+ entra y dice (ronda);TODOS", 
            "Objeto 100%;2", 
            "Objeto misterioso (empieza cuando adivina);2", 
            "Objeto sin nombre, sin usar;2", 
            "Pitonisa;3", 
            "Títulos distintos + título escena;3|2", 
            "Votación público;4|3"
        ];

        const NOMBRES_INICIALES = [
            "Ángeles", "Aroa", "Bea", "Beloki", "Chuchi", "Elena", "Elenita", "Esther",
            "Isa", "Isra", "Jesús", "María G", "María M", "Natalia", "Paloma",
            "Paula", "Pilar", "Raúl", "Rosa", "Virgi", "Yesi"
        ];

        // ----------------------------------------------------------
        // --- LÓGICA DEL SORTEO ---
        // ----------------------------------------------------------
        
        let ejerciciosDisponibles = []; // Ejercicios NO usados desde la carga de la página
        let participantesDisponibles = []; // Participantes presentes Y sin asignar (lista activa)
        let participantesIniciales = [];  // Lista completa al inicio (para la gestión de ausencias)
        let participantesAusentes = new Set(); // Nombres de los participantes marcados como ausentes
        let participantesSorteados = new Set(); // Nombres de los participantes ya asignados en la ronda
        let ruletaIntervalId = null; 

        // Función auxiliar para mezclar un array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /** Procesa la lista de ejercicios RAW. */
        function procesarEjercicios(rawList) {
            return rawList.map(e => {
                const [nombre, actoresStr] = e.split(';');
                // Si es 'TODOS', actores es 0, si no, es un array de posibles actores [4, 3, 2]
                const actores = actoresStr === 'TODOS' 
                    ? [0] 
                    : actoresStr.split('|').map(n => parseInt(n)).sort((a, b) => b - a); // Ordenar de mayor a menor
                
                return { nombre, actores, usado: false };
            });
        }

        /** Inicializa los datos al cargar la página. */
        function inicializarDatos() {
            participantesIniciales = [...NOMBRES_INICIALES]; 
            participantesDisponibles = [...participantesIniciales];
            
            // Procesar los ejercicios y establecer el estado de 'usado'
            ejerciciosDisponibles = procesarEjercicios(EJERCICIOS_RAW);

            // Obtener el número mínimo de actores requeridos por cualquier ejercicio (excluyendo 'TODOS')
            const actoresRequeridos = ejerciciosDisponibles
                .filter(e => e.actores[0] > 0)
                .flatMap(e => e.actores);
                
            minActoresRequeridos = actoresRequeridos.length > 0 
                ? Math.min(...actoresRequeridos) 
                : 0;

            mostrarEstadoSetup();
            document.body.addEventListener('click', manejarZoomResultado);
            
            // Listener específico para los checkboxes de ausentes
            document.getElementById('participantes-display').addEventListener('change', manejarAusencia);
        }

        /** Maneja el marcado/desmarcado de un participante como ausente. */
        function manejarAusencia(event) {
            if (event.target.type === 'checkbox') {
                const nombre = event.target.value;
                
                if (event.target.checked) {
                    participantesAusentes.add(nombre);
                } else {
                    participantesAusentes.delete(nombre);
                }
                
                reinicializarParticipantesDisponibles();
                mostrarEstadoSetup();
            }
        }

        /** Regenera la lista de participantes disponibles (activos), excluyendo ausentes y sorteados. */
        function reinicializarParticipantesDisponibles() {
            participantesDisponibles = participantesIniciales.filter(nombre => 
                !participantesAusentes.has(nombre) && !participantesSorteados.has(nombre)
            );
        }


        /** Muestra las listas de participantes y ejercicios en el Setup. */
        function mostrarEstadoSetup() {
            // Muestra todos los ejercicios, tachando los que ya fueron sorteados.
            const ejerciciosHTML = ejerciciosDisponibles
                .map(e => {
                    const esUsado = e.usado;
                    const clase = esUsado ? 'ejercicio-usado' : '';
                    
                    let actoresStr = e.actores[0] === 0 
                        ? 'TODOS' 
                        : e.actores.join('|') + ' pers.';
                        
                    return `<p class="${clase}">${e.nombre} (${actoresStr})</p>`;
                })
                .join('');
            document.getElementById('ejercicios-display').innerHTML = ejerciciosHTML || '<p style="color:red;">Ninguno disponible</p>';

            // Mostrar el listado COMPLETO, pero con el estado correcto (Ausente/Sorteado)
            const participantesHTML = participantesIniciales
                .map(nombre => {
                    const isAusente = participantesAusentes.has(nombre);
                    const isSorteado = participantesSorteados.has(nombre);
                    
                    let estadoClase = '';
                    let estadoTexto = '';
                    let isDisabled = false;
                    let isChecked = false;

                    if (isAusente) {
                        estadoClase = 'ausente';
                        estadoTexto = '(Ausente)';
                        isChecked = true;
                    } else if (isSorteado) {
                        estadoClase = 'sorteado';
                        estadoTexto = '(Sorteado)';
                        isDisabled = true; 
                    }

                    return `
                        <label class="${estadoClase}">
                            <input type="checkbox" value="${nombre}" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
                            <span>${nombre} ${estadoTexto}</span>
                        </label>
                    `;
                })
                .join('');
                
            document.getElementById('participantes-display').innerHTML = participantesHTML;

            const btn = document.getElementById('sortear-btn');
            const participantesPresentesRestantes = participantesDisponibles.length; 
            
            const ejerciciosNumeradosRestantes = ejerciciosDisponibles
                .filter(e => e.actores[0] > 0 && !e.usado);
            
            const ejerciciosTodosRestantes = ejerciciosDisponibles
                .filter(e => e.actores[0] === 0 && !e.usado);
            
            // Lógica para el botón principal
            
            // 1. Caso: NO QUEDA NINGÚN EJERCICIO DISPONIBLE (Final total)
            if (ejerciciosNumeradosRestantes.length === 0 && ejerciciosTodosRestantes.length === 0) {
                 btn.disabled = true;
                 btn.textContent = "✅ ¡FIN DEL SORTEO! No quedan más ejercicios.";
                 btn.onclick = null; // No hace nada

            } else if (participantesPresentesRestantes < minActoresRequeridos) {
                 // 2. Caso: No hay suficientes participantes para los ejercicios numerados.
                 if (ejerciciosTodosRestantes.length > 0) {
                     // Si quedan ejercicios TODOS, sortea TODOS
                    btn.disabled = false;
                    btn.textContent = `🛑 ÚLTIMO EJERCICIO DE RONDA (Sortear TODOS)`;
                    btn.onclick = iniciarSorteoTodos;
                 } else {
                     // Si no quedan TODOS, solo queda resetear
                    btn.disabled = false;
                    btn.textContent = "INICIAR NUEVA RONDA (Resetear Participantes)";
                    btn.onclick = iniciarNuevaRonda;
                 }


            } else {
                 // 3. Caso: Sorteo normal
                 btn.disabled = false;
                 btn.textContent = `SORTEAR PRÓXIMA ESCENA (Quedan ${participantesPresentesRestantes} personas)`;
                 btn.onclick = iniciarSorteo;
            }
        }
        
        /** Resetea la lista de participantes sorteados para iniciar una nueva ronda. */
        function iniciarNuevaRonda() {
            participantesSorteados = new Set(); // Vaciamos los sorteados
            reinicializarParticipantesDisponibles();
            
            document.getElementById('resultados-sorteo').insertAdjacentHTML('afterbegin', `
                <div class="resultado-grupo nuevo" style="background-color: #fce4ec; border-color: #e91e63;">
                    <strong>¡NUEVA RONDA INICIADA!</strong><br>
                    <strong>Participantes reseteados. Sorteando con ejercicios restantes.</strong>
                </div>
            `);

            mostrarEstadoSetup();
        }

        /** Lógica de apertura del zoom. Mueve el elemento a la vista de pantalla completa. */
        function abrirZoomResultado(resultadoElement) {
            const zoomExistente = document.querySelector('.resultado-zoom');
            if(zoomExistente) zoomExistente.remove();

            const zoomContainer = document.createElement('div');
            zoomContainer.classList.add('resultado-zoom');
            
            resultadoElement.remove(); 
            zoomContainer.appendChild(resultadoElement);
            document.body.appendChild(zoomContainer);

            return resultadoElement;
        }

        /** Inicia el efecto de ruleta con duración fija y desaceleración. */
        function iniciarRuleta(elementoResultado, resultadoFinal) {
            
            const TAMANO_FIJO_RULETA = 6; 
            const DURACION_TOTAL = 2500; // 2.5 segundos
            const INTERVALO_INICIAL = 75; // Rotación rápida inicial (75ms)
            
            const actoresDisponiblesRuleta = participantesIniciales.filter(nombre => !participantesAusentes.has(nombre));
            const ejerciciosDisponiblesRuleta = EJERCICIOS_RAW.map(e => e.split(';')[0]);

            const nombreElemento = elementoResultado.querySelector('strong:first-child');
            const improvisanElemento = elementoResultado.querySelector('strong:last-child');
            const ruletaAudio = document.getElementById('ruleta-audio');
            const bingAudio = document.getElementById('bing-audio'); 
            
            let tiempoTranscurrido = 0;
            
            elementoResultado.style.cursor = 'wait';
            
            // 1. Iniciar Audio de Ruleta
            ruletaAudio.play().catch(e => console.log('El audio de ruleta no pudo iniciar.'));

            // Función que realiza una rotación
            const rotar = () => {
                // Rotar Ejercicio
                const improFalsa = ejerciciosDisponiblesRuleta[Math.floor(Math.random() * ejerciciosDisponiblesRuleta.length)];
                
                // Rotar Participantes (generar grupo aleatorio usando el TAMAÑO FIJO)
                shuffleArray(actoresDisponiblesRuleta);
                const grupoFalso = actoresDisponiblesRuleta.slice(0, TAMANO_FIJO_RULETA).join(', '); 

                nombreElemento.innerHTML = `${improFalsa}`;
                improvisanElemento.innerHTML = `${grupoFalso}`;
            };
            
            // Función de control de intervalo y desaceleración
            const loopRuleta = () => {
                // Calcular el porcentaje de tiempo transcurrido
                const porcentaje = Math.min(tiempoTranscurrido / DURACION_TOTAL, 1);
                
                // Usamos una función cuadrática para simular desaceleración (más lento al final)
                const factorDesaceleracion = porcentaje * porcentaje;
                const maxIntervalo = 500; // Intervalo máximo antes de parar
                
                // Calculamos el nuevo intervalo (más largo cuanto más cerca del final)
                const nuevoIntervalo = INTERVALO_INICIAL + (maxIntervalo - INTERVALO_INICIAL) * factorDesaceleracion;
                
                // Rotar
                rotar();

                tiempoTranscurrido += nuevoIntervalo;

                if (tiempoTranscurrido < DURACION_TOTAL) {
                    ruletaIntervalId = setTimeout(loopRuleta, nuevoIntervalo);
                } else {
                    // 3. Detener la ruleta y mostrar resultado FINAL
                    clearTimeout(ruletaIntervalId);
                    ruletaIntervalId = null;
                    
                    // Detener y resetear el audio de giro
                    ruletaAudio.pause();
                    ruletaAudio.currentTime = 0; 
                    
                    // Reproducir el BING
                    bingAudio.play().catch(e => console.log('El audio BING no pudo iniciar.'));
                    
                    // Mostrar el resultado FINAL y real
                    nombreElemento.innerHTML = `${resultadoFinal.impro.nombre}`;
                    improvisanElemento.innerHTML = `${resultadoFinal.grupo.join(', ')}`;
                    
                    elementoResultado.style.cursor = 'pointer';
                }
            };
            
            // Iniciar el bucle de la ruleta
            loopRuleta();
        }

        /** Lógica para sortear un ejercicio con un número fijo de participantes. */
        function iniciarSorteo() {
            if (ruletaIntervalId) return;
            
            const btn = document.getElementById('sortear-btn');
            btn.disabled = true; 
            
            const mensajeInicial = document.getElementById('mensaje-inicial');
            if (mensajeInicial) mensajeInicial.remove();
            
            
            const participantesPresentesRestantes = participantesDisponibles.length; 
            
            // 1. Obtener ejercicios numerados posibles (excluyendo 'TODOS' y usados)
            let ejerciciosPosibles = ejerciciosDisponibles
                .filter(e => e.actores[0] > 0 && !e.usado);
            
            let improElegida = null;
            let actoresReales = 0;


            // 2. Filtrar ejercicios que puedan ser jugados con los participantes restantes (N)
            // Criterio: el número MÁS PEQUEÑO de actores que permite el ejercicio debe ser <= N.
            let ejerciciosAjustados = ejerciciosPosibles.filter(e => 
                e.actores[e.actores.length - 1] <= participantesPresentesRestantes
            );


            // --- NUEVA LÓGICA DE FORZADO DE CONSUMO ---
            
            const N = participantesPresentesRestantes;

            // FASE A: Filtrar ejercicios para forzar el consumo total o necesario.
            if (N === 3 || N === 2 || N === 4) {
                // Buscamos ejercicios que puedan consumir el número exacto restante (o un número necesario para 'matar' la ronda).
                
                let ejerciciosPrioritarios = ejerciciosAjustados.filter(e => 
                    e.actores.includes(N) || 
                    (N === 4 && e.actores.includes(2)) ||
                    (N === 3 && e.actores.includes(2)) ||
                    (N === 2 && e.actores.includes(2))
                );

                if (ejerciciosPrioritarios.length > 0) {
                    ejerciciosAjustados = ejerciciosPrioritarios;
                } 
                // Si no hay prioritarios, se sigue con los ajustados (pueden ser ejercicios de N=4 que solo permitan 2 o 3, lo cual es subóptimo pero posible).
            }

            // Si después del filtro estricto no quedan ejercicios, revisamos si se puede sortear TODOS.
            if (ejerciciosAjustados.length === 0) {
                return iniciarSorteoTodos();
            }

            // 3. Elegir un ejercicio ajustado al azar
            const indiceImpro = Math.floor(Math.random() * ejerciciosAjustados.length);
            const improCandidata = ejerciciosAjustados[indiceImpro];
            
            improElegida = improCandidata;

            // 4. Seleccionar el número de actores (el más grande que quepa, o el forzado)
            
            // Si N=4 o N=3 y forzamos a 2, debe cumplirse la regla de seleccionar el más grande que quepa.
            for (const numActores of improElegida.actores) {
                if (numActores <= N) {
                    actoresReales = numActores;
                    break;
                }
            }
            
            // VALIDACIÓN POST-SELECCIÓN (Aseguramos que el ejercicio de 2 no se haya sacado con N=3 si había de 3 disponibles)
            // Esta validación se simplifica si el filtro de la FASE A es bueno. 
            // Si N=3 y se seleccionó un ejercicio de 2, es porque no había de 3 en los ajustados (o el aleatorio lo escogió mal).
            
            // Asegurar que si quedan 3, y el ejercicio elegido permite 3, SE ELIJA 3.
            if (N === 3 && improElegida.actores.includes(3)) {
                actoresReales = 3;
            }
            // Asegurar que si quedan 2, y el ejercicio elegido permite 2, SE ELIJA 2.
            else if (N === 2 && improElegida.actores.includes(2)) {
                actoresReales = 2;
            }


            // Marcar el ejercicio como usado
            improElegida.usado = true;

            // 5. Sortear Participantes
            const grupoElegido = [];
            const disponiblesParaSorteo = [...participantesDisponibles];
            
            for (let i = 0; i < actoresReales; i++) {
                const indicePersona = Math.floor(Math.random() * disponiblesParaSorteo.length);
                grupoElegido.push(disponiblesParaSorteo.splice(indicePersona, 1)[0]);
            }
            
            // 6. ACTUALIZAR: Añadir a los sorteados y recalcular disponibles.
            grupoElegido.forEach(nombre => participantesSorteados.add(nombre));
            reinicializarParticipantesDisponibles(); 

            // 7. Mostrar Resultado temporal en la lista
            const resultadoTemporal = { impro: { nombre: '... ROTANDO ...', actores: actoresReales }, grupo: [''] }; 
            const nuevoResultadoElement = mostrarResultado(resultadoTemporal.impro, resultadoTemporal.grupo);
            
            // 8. Abrir el zoom
            const elementoZoom = abrirZoomResultado(nuevoResultadoElement);

            // 9. Iniciar la ruleta (incluye desaceleración y audio)
            iniciarRuleta(elementoZoom, { impro: improElegida, grupo: grupoElegido, actores: actoresReales });


            // 10. Actualizar Setup.
            setTimeout(() => {
                mostrarEstadoSetup();
            }, 3000); 
        }

        /** Lógica para sortear un ejercicio de la lista "TODOS" al final de la ronda. */
        function iniciarSorteoTodos() {
            if (ruletaIntervalId) return;

            const btn = document.getElementById('sortear-btn');
            btn.disabled = true;

            const participantesPresentesTotales = participantesIniciales.filter(nombre => !participantesAusentes.has(nombre));
            
            // Obtener ejercicios "TODOS" restantes
            let ejerciciosTodosPosibles = ejerciciosDisponibles.filter(e => e.actores[0] === 0 && !e.usado);

            // Si no quedan, pasamos a la nueva ronda (o al fin si ya no hay más)
            if (ejerciciosTodosPosibles.length === 0) {
                btn.disabled = false;
                return iniciarNuevaRonda();
            }

            // Elegir un ejercicio "TODOS" al azar
            const indiceImpro = Math.floor(Math.random() * ejerciciosTodosPosibles.length);
            const improElegida = ejerciciosTodosPosibles[indiceImpro];

            // Marcar el ejercicio como usado
            improElegida.usado = true;

            // El grupo para el DISPLAY es solo "Todos"
            const grupoElegidoDisplay = ["Todos"];
            
            // Mostrar Resultado temporal
            const resultadoTemporal = { impro: { nombre: '... ROTANDO ...', actores: participantesPresentesTotales.length }, grupo: [''] }; 
            const nuevoResultadoElement = mostrarResultado(resultadoTemporal.impro, resultadoTemporal.grupo);
            
            const elementoZoom = abrirZoomResultado(nuevoResultadoElement);

            // Iniciar la ruleta.
            iniciarRuleta(elementoZoom, { impro: improElegida, grupo: grupoElegidoDisplay, actores: participantesPresentesTotales.length });
            
            // Después del sorteo de "TODOS", forzamos el inicio de una nueva ronda.
            setTimeout(() => {
                iniciarNuevaRonda();
            }, 3000); 
        }


        /** Formatea y añade el resultado a la interfaz. Devuelve la referencia al nuevo elemento DIV. */
        function mostrarResultado(impro, grupo) {
            const resultadosDiv = document.getElementById('resultados-sorteo');
            
            const resultadoAnterior = resultadosDiv.querySelector('.resultado-grupo.nuevo');
            if (resultadoAnterior) {
                resultadoAnterior.classList.remove('nuevo');
                resultadoAnterior.classList.add('antiguo');
            }

            const grupoTexto = grupo.join(', ');
            
            const nuevoResultadoHTML = `
                <div class="resultado-grupo nuevo">
                    <strong>${impro.nombre}</strong><br>
                    <strong>${grupoTexto}</strong>
                </div>
            `;
            
            resultadosDiv.insertAdjacentHTML('afterbegin', nuevoResultadoHTML);
            const nuevoElemento = resultadosDiv.querySelector('.resultado-grupo.nuevo');
            
            return nuevoElemento;
        }
        
        /** Maneja la funcionalidad de zoom/pantalla completa. */
        function manejarZoomResultado(event) {
            // No permitir el cierre si la ruleta está activa.
            if (ruletaIntervalId) return; 

            let resultadoGrupo = event.target.closest('.resultado-grupo.nuevo');
            const resultadosDiv = document.getElementById('resultados-sorteo');
            const btn = document.getElementById('sortear-btn'); 

            // Lógica de CIERRE:
            if ((resultadoGrupo && resultadoGrupo.parentNode.classList.contains('resultado-zoom')) || event.target.classList.contains('resultado-zoom')) {
                
                const zoomContainer = event.target.classList.contains('resultado-zoom') ? event.target : resultadoGrupo.parentNode;
                const grupoZoomed = zoomContainer.querySelector('.resultado-grupo.nuevo');
                
                if (grupoZoomed) {
                    resultadosDiv.insertAdjacentElement('afterbegin', grupoZoomed);
                }
                zoomContainer.remove(); 
                
                // HABILITAMOS EL BOTÓN INMEDIATAMENTE AL CERRAR
                if (btn.disabled) { 
                    mostrarEstadoSetup(); 
                }
                
                return;
            }
            
            // Lógica de APERTURA MANUAL: 
            if (resultadoGrupo && !resultadoGrupo.parentNode.classList.contains('resultado-zoom')) {
                abrirZoomResultado(resultadoGrupo);
            }
        }

        // Ejecutar al cargar la página
        window.onload = inicializarDatos;
    </script>
