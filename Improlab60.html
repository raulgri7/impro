<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo ImproLAB 60 💜</title>
    <style>
        /* ----------------------------------------------------------
           ESTILOS (BASADOS EN COLORES DE IMPROLAB 60)
           ---------------------------------------------------------- */
        :root {
            --color-lila-principal: #6c5ce7; /* Morado/Lila de la imagen */
            --color-lila-oscuro: #483d8b;
            --color-fondo-claro: #f5f5f5;
            --color-texto-claro: #ffffff;
            --color-texto-oscuro: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: var(--color-fondo-claro);
            color: var(--color-texto-oscuro);
            min-height: 100vh;
        }

        h1 {
            color: var(--color-lila-oscuro);
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        /* Contenedor Principal (Simula la cartelera) */
        .container {
            background-color: var(--color-texto-claro);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
            border-top: 5px solid var(--color-lila-principal);
        }

        /* Estilo de la imagen abstracta (Fondo Lila) */
        .header-image {
            width: 100%;
            height: 150px;
            background: linear-gradient(45deg, var(--color-lila-principal), #b2a4ff);
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            color: var(--color-texto-claro);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* Estilos del Botón de Sorteo */
        #sortear-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--color-lila-principal);
            color: var(--color-texto-claro);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        #sortear-btn:hover:not(:disabled) {
            background-color: var(--color-lila-oscuro);
        }

        #sortear-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        /* Contenedores de Listas */
        .setup-list {
            margin-bottom: 25px;
            padding: 0 10px;
            display: flex;
            gap: 20px;
        }

        .setup-list div {
            flex: 1;
        }

        /* Estilos de la lista de resultados */
        #resultados-sorteo {
            margin-top: 30px;
            border-top: 2px dashed var(--color-lila-principal);
            padding-top: 20px;
        }

        .resultado-grupo {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        /* Estilo para el resultado más reciente (el de arriba) */
        .resultado-grupo.nuevo {
            background-color: #ede7f6; /* Lila muy claro */
            border: 2px solid var(--color-lila-principal);
            border-left: 5px solid var(--color-lila-principal);
            font-size: 1.1em;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .resultado-grupo.nuevo strong {
            color: var(--color-lila-oscuro);
            font-size: 1.2em;
        }
        
        /* Estilo para los resultados antiguos (grises) */
        .resultado-grupo.antiguo {
            background-color: #f9f9f9;
            color: #777;
            border: 1px solid #ddd;
            border-left: 3px solid #ddd;
            font-size: 0.9em;
        }

        .resultado-grupo strong {
            color: inherit;
            font-size: 1.1em;
            display: block;
            margin-bottom: 5px;
        }
        
        /* Para mostrar la lista de personas y ejercicios en el Setup */
        .list-display {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
            height: 150px;
            overflow-y: auto;
            font-size: 0.9em;
        }
        
        .list-display p {
            margin: 2px 0;
        }
    </style>
</head>
<body>

    <h1>Sorteador IMPRO LAB 60</h1>
    <p>Organiza a tu elenco en grupos al azar para los ejercicios.</p>

    <div class="container">
        
        <div class="header-image">
            GENERADOR DE ESCENAS IMPROVISADAS 🎭
        </div>

        <h2>⚙️ Configuración del Sorteo</h2>
        
        <div class="setup-list">
            <div>
                <strong>Ejercicios Disponibles (Nombre; Actores):</strong>
                <div id="ejercicios-display" class="list-display"></div>
            </div>
            <div>
                <strong>Participantes Iniciales:</strong>
                <div id="participantes-display" class="list-display"></div>
            </div>
        </div>

        <button id="sortear-btn" onclick="iniciarSorteo()">INICIAR SORTEO (Asignar Escenas)</button>

        <div id="resultados-sorteo">
            <p style="text-align: center; color: #777;" id="mensaje-inicial">Haz clic en el botón para comenzar a sortear ejercicios y asignar participantes.</p>
        </div>
    </div>


    <script>
        // ----------------------------------------------------------
        // --- DATA DE CONFIGURACIÓN (ACTUALIZADA) ---
        // ----------------------------------------------------------
        
        // El máximo es 4 personas, el mínimo es 2.
        const EJERCICIOS_RAW = [
            "El Interrogatorio de Espejos;2", 
            "La Pelea de Siluetas;2",
            "La Congelación;2",
            "Noticias Absurdas;2",
            "El Espejo Roto;2",         // NUEVO 2P
            "Cambio de Posición;2",     // NUEVO 2P
            
            "Monstruo de Tres Cabezas;3",    
            "Subasta de Sentimientos;3",      
            "Objeto Extraño;3",
            "Carrera de Géneros;3",
            "Máquina del Tiempo;3",
            "Traducción Simultánea;3",  // NUEVO 3P
            "El Confesionario Múltiple;3", // NUEVO 3P
            
            "Monólogo a Cuatro;4",
            "El Barco Se Hunde;4",
            "La Rueda de Emociones;4",  // NUEVO 4P
            "El Círculo de Historias;4", // NUEVO 4P
        ];

        const NOMBRES_INICIALES = [
            "Ángeles", "Aroa", "Bea", "Beloki", "Chuchi", "Elena", "Elenita", "Esther",
            "Isa", "Isra", "Jesús", "María G", "María M", "Natalia", "Paloma",
            "Paula", "Pilar", "Raúl", "Rosa", "Virgi", "Yesi"
        ];

        // ----------------------------------------------------------
        // --- LÓGICA DEL SORTEO ---
        // ----------------------------------------------------------
        
        let ejerciciosDisponibles = [];
        let participantesDisponibles = [];
        let ejerciciosYaUsados = new Set();
        let minActoresRequeridos = 0; // Debería ser 2


        /** Inicializa los datos al cargar la página. */
        function inicializarDatos() {
            participantesDisponibles = [...NOMBRES_INICIALES];
            
            ejerciciosDisponibles = EJERCICIOS_RAW.map(e => {
                const [nombre, actores] = e.split(';');
                return { nombre, actores: parseInt(actores) };
            });

            if (ejerciciosDisponibles.length > 0) {
                 minActoresRequeridos = Math.min(...ejerciciosDisponibles.map(e => e.actores));
            } else {
                 minActoresRequeridos = 0;
            }

            mostrarEstadoSetup();
        }

        /** Muestra las listas de participantes y ejercicios en el Setup. */
        function mostrarEstadoSetup() {
            const ejerciciosRestantes = ejerciciosDisponibles.filter(e => !ejerciciosYaUsados.has(e.nombre));
            const ejerciciosHTML = ejerciciosRestantes
                .map(e => `<p>${e.nombre} (${e.actores} pers.)</p>`)
                .join('');
            document.getElementById('ejercicios-display').innerHTML = ejerciciosHTML || '<p style="color:red;">Ninguno disponible</p>';

            const participantesHTML = participantesDisponibles
                .map(n => `<p>${n}</p>`)
                .join('');
            document.getElementById('participantes-display').innerHTML = participantesHTML;

            const btn = document.getElementById('sortear-btn');
            const participantesRestantes = participantesDisponibles.length;

            if (participantesRestantes < minActoresRequeridos) {
                 btn.disabled = true;
                 btn.textContent = `🛑 FIN DEL SORTEO (Solo quedan ${participantesRestantes} pers. - Insuficientes)`;
            } else if (ejerciciosRestantes.length === 0) {
                 btn.disabled = true;
                 btn.textContent = "🛑 FIN DEL SORTEO (No quedan ejercicios disponibles)";
            } else {
                 btn.disabled = false;
                 btn.textContent = `SORTEAR PRÓXIMA ESCENA (Quedan ${participantesRestantes} personas)`;
            }
        }

        /** Realiza el sorteo y asignación de grupo con la nueva lógica estricta. */
        function iniciarSorteo() {
            const resultadosDiv = document.getElementById('resultados-sorteo');
            const btn = document.getElementById('sortear-btn');
            
            btn.disabled = true; 
            
            const mensajeInicial = document.getElementById('mensaje-inicial');
            if (mensajeInicial) mensajeInicial.remove();
            
            
            const participantesRestantes = participantesDisponibles.length;
            const ejerciciosRestantes = ejerciciosDisponibles.filter(e => !ejerciciosYaUsados.has(e.nombre));
            
            // 1. Obtener ejercicios posibles que NO se han usado y para los que hay gente.
            let ejerciciosPosibles = ejerciciosRestantes.filter(e => e.actores <= participantesRestantes);
            
            // 2. APLICAR REGLAS DE FILTRADO ESTRICTO PARA EVITAR SOLITARIOS AL FINAL
            switch (participantesRestantes) {
                case 5:
                    // Si quedan 5, NO se pueden usar ejercicios de 4, porque quedaría 1 persona sola.
                    ejerciciosPosibles = ejerciciosPosibles.filter(e => e.actores !== 4);
                    break;
                case 4:
                    // Si quedan 4, SÓLO se pueden usar ejercicios de 4 (se van todos) o de 2 (quedan 2).
                    // No se permite 3 (quedaría 1).
                    ejerciciosPosibles = ejerciciosPosibles.filter(e => e.actores === 4 || e.actores === 2);
                    break;
                case 3:
                    // Si quedan 3, SÓLO se puede usar ejercicio de 3 (se van todos).
                    // No se permite 2 (quedaría 1).
                    ejerciciosPosibles = ejerciciosPosibles.filter(e => e.actores === 3);
                    break;
                case 2:
                    // Si quedan 2, SÓLO se puede usar ejercicio de 2 (se van todos).
                    ejerciciosPosibles = ejerciciosPosibles.filter(e => e.actores === 2);
                    break;
            }
            // ----------------------------------------------------------------------

            // 3. Verificar si queda algún ejercicio posible tras el filtrado estricto
            if (ejerciciosPosibles.length === 0) {
                 document.getElementById('resultados-sorteo').insertAdjacentHTML('afterbegin', `
                    <p style="color: #c53929; font-weight: bold; margin-bottom: 15px;">
                        🛑 ¡SORTEO PARADO! Quedan ${participantesRestantes} participantes. Ninguno de los ejercicios restantes cumple con la regla de no dejar a nadie solo. ¡Ajuste manual!
                    </p>
                `);
                mostrarEstadoSetup();
                return;
            }


            // 4. Sortear Ejercicio (Usando la lista filtrada)
            const indiceImpro = Math.floor(Math.random() * ejerciciosPosibles.length);
            const improElegida = ejerciciosPosibles[indiceImpro];

            // 5. Marcar ejercicio como usado
            ejerciciosYaUsados.add(improElegida.nombre);
            
            // 6. Sortear Participantes
            const grupoElegido = [];
            for (let i = 0; i < improElegida.actores; i++) {
                const indicePersona = Math.floor(Math.random() * participantesDisponibles.length);
                grupoElegido.push(participantesDisponibles.splice(indicePersona, 1)[0]);
            }

            // 7. Mostrar Resultado y actualizar Setup
            mostrarResultado(improElegida, grupoElegido);
            mostrarEstadoSetup();
            
            // Rehabilitar el botón
            btn.disabled = false;
        }

        /** Formatea y añade el resultado a la interfaz (último arriba, grandes y coloridos). */
        function mostrarResultado(impro, grupo) {
            const resultadosDiv = document.getElementById('resultados-sorteo');
            
            // 1. Desgrisar el resultado más reciente anterior (si existe)
            const resultadoAnterior = resultadosDiv.querySelector('.resultado-grupo.nuevo');
            if (resultadoAnterior) {
                resultadoAnterior.classList.remove('nuevo');
                resultadoAnterior.classList.add('antiguo');
            }

            // 2. Crear el nuevo resultado (en formato 'nuevo')
            const nuevoResultadoHTML = `
                <div class="resultado-grupo nuevo">
                    <strong>🎬 Escena: ${impro.nombre}</strong> (Requiere ${impro.actores} actores)<br>
                    <strong>👥 Grupo Asignado:</strong> ${grupo.join(', ')}
                </div>
            `;
            
            // 3. Añadir el nuevo resultado al inicio (prepend)
            resultadosDiv.insertAdjacentHTML('afterbegin', nuevoResultadoHTML);
        }

        // Ejecutar al cargar la página
        window.onload = inicializarDatos;
    </script>

</body>
</html>
