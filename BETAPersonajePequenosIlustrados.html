<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller de Híbridos Creativos 🎨</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #8a2be2;
            --color-secondary: #ff9800;
            --color-bg: #fdfbff;
            --color-card: #ffffff;
            --color-text: #2c3e50;
        }

        body { 
            font-family: 'Open Sans', sans-serif; 
            padding: 20px; 
            max-width: 850px; 
            margin: 0 auto; 
            background-color: var(--color-bg); 
            color: var(--color-text);
        }

        h1 { 
            color: var(--color-primary); 
            text-align: center;
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px rgba(138, 43, 226, 0.1);
        }

        p.instruccion { 
            text-align: center;
            color: #7f8c8d; 
            margin-bottom: 30px; 
            font-style: italic;
            font-size: 1.1em;
        }
        
        .botones-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        button { 
            padding: 16px 28px; 
            background-color: var(--color-primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold;
            transition: all 0.2s ease; 
            box-shadow: 0 4px 0 #6a1ba5; 
            text-transform: uppercase;
        }

        button:hover { background-color: #7b1fa2; transform: translateY(-2px); }
        button:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
        
        .suerte-btn {
            background-color: var(--color-secondary);
            box-shadow: 0 4px 0 #e68a00;
        }
        .suerte-btn:hover { background-color: #f57c00; }

        #resultado { 
            margin-top: 20px; 
            padding: 30px; 
            background-color: var(--color-card);
            border-radius: 20px; 
            border: 3px solid #eee;
            min-height: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.5s ease;
        }
        
        .categoria-titulo { 
            color: var(--color-primary); 
            font-size: 1.2em; 
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px; 
            margin-bottom: 15px; 
            background: #f0e6ff;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 50px;
            font-weight: 800;
        }

        .item-generado {
            font-size: 3em;
            font-weight: 900;
            color: #4b0082;
            margin: 15px 0;
            filter: drop-shadow(2px 2px 0px #d5baff);
        }

        .instrucciones-hibrido {
            margin-top: 30px;
            padding: 20px;
            background-color: #fff9f0;
            border-radius: 15px;
            border-left: 5px solid var(--color-secondary);
            font-size: 1.1em;
            color: #5d4037;
            line-height: 1.6;
        }

        /* Estilo para listas */
        ul { 
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        li { 
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold; 
            color: #4b0082; 
            border: 1px solid #eee;
            text-align: center;
        }

        /* CARGA */
        .cargando { 
            color: var(--color-primary); 
            font-weight: bold; 
            animation: pulse 1.5s infinite; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 40px;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .windmill-spin {
            font-size: 3em;
            animation: spin 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <h1>✨ Taller de Híbridos</h1>
    <p class="instruccion">Genera combinaciones locas para tus dibujos.</p>
    
    <div class="botones-container">
        <button id="btn-lista" onclick="generarContenido(4)">Generar 4 Opciones</button>
        <button id="btn-suerte" class="suerte-btn" onclick="generarContenido(1)">Voy a tener suerte</button>
    </div>
    
    <div id="resultado">
        <div style="text-align: center; color: #ccc; padding-top: 40px;">
            Haz clic arriba para empezar a crear...
        </div>
    </div>


    <script>
        // URL de tu Worker de Cloudflare
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        const personajesOffline = [
            "Águila", "Alce", "Alien", "Ángel", "Araña", "Ardilla", "Astronauta", "Ballena", "Búfalo", "Búho", "Burro", "Caballo", "Cabra", "Calamar", "Camello", "Canguro", "Castor", "Chef", "Cebra", "Ciempiés", "Cerdito", "Cíclope", "Colibrí", "Conejo", "Cocodrilo", "Cuervo", "Delfín", "Demonio", "Dinosaurio", "Dragón", "Duende", "Elefante", "Enano", "Escarabajo", "Erizo", "Fantasma", "Flamenco", "Gacela", "Gallo", "Garza", "Gato", "Gato Montés", "Gaviota", "Gigante", "Gusano", "Halcón", "Hada", "Hámster", "Hormiga", "Hurón", "Jirafa", "Koala", "León", "León Marino", "Lince", "Llama", "Lobo", "Mago", "Mariquita", "Medusa", "Mono", "Muñeco", "Murciélago", "Ninja", "Nutria", "Oso", "Oso Polar", "Pájaro", "Panda", "Panadero", "Periquito", "Perezoso", "Pez", "Pollo", "Príncipe", "Princesa", "Pulpo", "Puercoespín", "Ratón", "Reno", "Rey", "Robot", "Saltamontes", "Serpiente", "Sirena", "Tigre", "Tiburón", "Topo", "Troll", "Unicornio", "Vampiro", "Vaca", "Zorro"
        ];
        
        const objetosOffline = [
            "Alfombra", "Anillo", "Avión", "Balón", "Barco", "Baúl", "Bicicleta", "Bota", "Brújula", "Burbuja", "Candelabro", "Cámara", "Candado", "Casa", "Caja", "Cofre", "Cohete", "Cometa", "Corona", "Cristal", "Cuerda", "Cuchara", "Diamante", "Dron", "Espejo", "Estrella", "Estatua", "Farol", "Flauta", "Flor", "Fuente", "Gafas", "Guitarra", "Globo", "Guante", "Helicóptero", "Hoja", "Imán", "Jabón", "Lámpara", "Lápiz", "Llave", "Libro", "Linterna", "Luna", "Mapa", "Martillo", "Micrófono", "Microscopio", "Moneda", "Mochila", "Nevera", "Nube", "Patín", "Pincel", "Poción", "Puente", "Radio", "Rayo", "Reloj", "Submarino", "Tambor", "Telescopio", "Teléfono", "Tijera", "Tren", "Tronco", "Vela", "Ventana"
        ];
        
        function limpiarTexto(texto) {
            if (!texto) return '';
            return texto.trim()
                .replace(/^(un|una|el|la|los|las|unos|unas)\s+/i, '')
                .replace(/\s*\(.*\)\s*/g, '')
                .replace(/\.$/, '')
                .split(/\s+/)[0]; // Nos quedamos solo con la primera palabra
        }

        function construirPromptHibridos(numElementos) {
            const numero = numElementos === 1 ? 'UN' : numElementos;
            return `Genera exactamente ${numero} personajes (animal o ser vivo) y ${numero} objetos. 
            Formato:
            ### PERSONAJES
            (Lista de ${numero} sustantivos, uno por línea)
            ### OBJETOS
            (Lista de ${numero} sustantivos, uno por línea)
            REGLA: Solo sustantivos sueltos, sin adjetivos ni frases.`;
        }

        function obtenerResultadosOffline(numElementos) {
            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
            const p = shuffle(personajesOffline).slice(0, numElementos);
            const o = shuffle(objetosOffline).slice(0, numElementos);
            return `### PERSONAJES\n${p.join('\n')}\n\n### OBJETOS\n${o.join('\n')}`;
        }

        async function generarContenido(numElementos) {
            const resDiv = document.getElementById('resultado');
            const btns = document.querySelectorAll('button');
            
            btns.forEach(b => b.disabled = true);
            resDiv.innerHTML = `
                <div class="cargando">
                    <span class="windmill-spin">🎨</span>
                    ${numElementos === 1 ? 'Mezclando pociones mágicas...' : 'Preparando lienzos en blanco...'}
                </div>`;

            const usarIA = Math.random() < 0.5; 
            let textoGenerado;
            
            try {
                if (usarIA) {
                    const response = await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: construirPromptHibridos(numElementos), temp: 0.9 })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        textoGenerado = data.candidates[0].content.parts[0].text;
                    } else {
                        textoGenerado = obtenerResultadosOffline(numElementos);
                    }
                } else {
                    await new Promise(r => setTimeout(r, 1000));
                    textoGenerado = obtenerResultadosOffline(numElementos);
                }

                renderizarHibrido(textoGenerado, numElementos);

            } catch (e) {
                resDiv.innerHTML = "<p style='color:red; text-align:center;'>¡Vaya! La pintura se ha derramado. Prueba otra vez.</p>";
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }

        function renderizarHibrido(texto, num) {
            const resDiv = document.getElementById('resultado');
            const bloques = texto.split('###').filter(b => b.trim().length > 0);
            let html = '';
            let pPrim = '', oPrim = '';

            bloques.forEach(bloque => {
                const lineas = bloque.trim().split('\n');
                const titulo = lineas[0].trim();
                const items = lineas.slice(1).map(i => limpiarTexto(i)).filter(i => i.length > 0);

                html += `<div class="categoria-titulo">${titulo}</div>`;

                if (num === 1) {
                    const item = items[0] || "Algo";
                    html += `<div class="item-generado">${item}</div>`;
                    if (titulo.includes('PERSONAJE')) pPrim = item;
                    else oPrim = item;
                } else {
                    html += `<ul>${items.slice(0,5).map(i => `<li>${i}</li>`).join('')}</ul>`;
                    if (titulo.includes('PERSONAJE')) pPrim = items[0];
                    else oPrim = items[0];
                }
            });

            const instruccion = num === 1 
                ? `⭐ **DESAFÍO ÚNICO:** Dibuja un **${pPrim}${oPrim.toLowerCase()}**. ¡Mézclalos como quieras!` 
                : `⭐ **¡ELIGE TU MIX!** Elige uno de cada lista y crea un híbrido fantástico.`;

            html += `<div class="instrucciones-hibrido">${instruccion}</div>`;
            resDiv.innerHTML = html;
        }
    </script>
</body>
</html>
