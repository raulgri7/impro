<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impro IA - Set de 6 🎭</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #34495e; --acc: #2ecc71; --hi: #3498db; --bg: #f4f7f6; }
        * { box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); padding: 20px; color: var(--main); }
        
        /* Estilos de la cabecera y botones */
        .no-print { text-align: center; margin-bottom: 20px; }
        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        
        .botones-wrap { display: flex; justify-content: center; gap: 10px; }
        
        button { 
            padding: 15px 25px; font-weight: bold; cursor: pointer; 
            color: white; border: none; border-radius: 8px; 
            text-transform: uppercase; transition: all 0.1s;
        }
        
        #btn-generar { background: var(--acc); box-shadow: 0 4px 0 #27ae60; }
        #btn-imprimir { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; }
        
        button:active { transform: translateY(3px); box-shadow: none; }
        button:disabled { background: #ccc; box-shadow: none; opacity: 0.8; cursor: not-allowed; }
        
        /* Estilos del Grid de resultados */
        #resultado { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            background: white; border: 1px solid #ccc; max-width: 1000px; margin: 0 auto; 
        }
        
        .tarjeta { 
            padding: 25px; border-right: 1px dashed #ccc; border-bottom: 1px dashed #ccc; 
            min-height: 280px; background: #fff; 
        }
        
        .t-num { color: var(--hi); font-weight: 900; font-size: 1.1em; border-bottom: 2px solid var(--acc); display: inline-block; margin-bottom: 15px; }
        
        .item { margin-bottom: 12px; }
        .item b { display: block; font-size: 0.75em; color: #95a5a6; text-transform: uppercase; margin-bottom: 2px; }
        .item span { font-size: 1.05em; font-weight: 500; color: #2c3e50; display: block; line-height: 1.2; }

        /* Configuración de Impresión */
        @media print { 
            .no-print { display: none !important; } 
            body { background: white; padding: 0; }
            #resultado { 
                grid-template-columns: repeat(2, 1fr) !important; 
                border: none !important; 
                width: 100%;
            } 
            .tarjeta { 
                border: 1px dashed black !important; 
                break-inside: avoid; 
                min-height: 300px;
            } 
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Circunstancias Dadas 🎭</h1>
        <div class="botones-wrap">
            <button id="btn-generar" onclick="generar()">Generar 6 Tarjetas</button>
            <button id="btn-imprimir" onclick="window.print()" style="display: none;">Imprimir Set</button>
        </div>
    </div>

    <div id="resultado">
        <p style="padding: 60px; text-align: center; grid-column: 1/-1; color: #7f8c8d;">Presiona el botón para generar las 6 escenas.</p>
    </div>

    <script>
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';

        async function generar() {
            const btnGen = document.getElementById('btn-generar');
            const btnImp = document.getElementById('btn-imprimir');
            const resDiv = document.getElementById('resultado');
            
            btnGen.disabled = true;
            btnImp.style.display = 'none';
            resDiv.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:60px;">Generando 6 escenas rápidas...</p>';

            try {
                const response = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Genera exactamente 6 tarjetas de improvisación teatral. Para cada tarjeta escribe: Lugar:, Cuándo:, Antes:, Relación:, Emoción:. Sé breve y directo. No uses asteriscos." }] }]
                    })
                });

                const data = await response.json();
                const texto = data.candidates[0].content.parts[0].text.replace(/\*/g, '');
                
                const etiquetas = ["Lugar", "Cuándo", "Antes", "Relación", "Emoción"];
                const regex = new RegExp(`(${etiquetas.join('|')}):?\\s*([^\\n]+)`, 'gi');
                
                let hallazgos = [];
                let match;
                while ((match = regex.exec(texto)) !== null) {
                    hallazgos.push({ etiqueta: match[1].toUpperCase(), valor: match[2].trim() });
                }

                if (hallazgos.length === 0) throw new Error("Formato no reconocido");

                let html = '';
                let tNum = 1;
                
                for (let i = 0; i < hallazgos.length; i += 5) {
                    html += `<div class="tarjeta"><span class="t-num">TARJETA ${tNum++}</span>`;
                    for (let j = 0; j < 5; j++) {
                        if (hallazgos[i+j]) {
                            html += `<div class="item"><b>${hallazgos[i+j].etiqueta}</b><span>${hallazgos[i+j].valor}</span></div>`;
                        }
                    }
                    html += `</div>`;
                }

                resDiv.innerHTML = html;
                btnImp.style.display = 'inline-block'; // Mostramos el botón tras generar con éxito

            } catch (e) {
                resDiv.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:60px; color:red;">Error: ${e.message}. Reintenta.</p>`;
            } finally {
                btnGen.disabled = false;
            }
        }
    </script>
</body>
</html>
