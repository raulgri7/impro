<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impro IA - Vecinos Reales 🎭</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #2c3e50; --acc: #e67e22; --hi: #2980b9; --bg: #fdfdfd; }
        * { box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); padding: 20px; color: var(--main); }
        .no-print { text-align: center; margin-bottom: 20px; }
        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .botones-wrap { display: flex; justify-content: center; gap: 10px; }
        button { padding: 15px 25px; font-weight: bold; cursor: pointer; color: white; border: none; border-radius: 8px; text-transform: uppercase; transition: background 0.2s; }
        #btn-abrir-config { background: var(--acc); box-shadow: 0 4px 0 #d35400; }
        #btn-imprimir { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; }
        
        #modal-config {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; border: 2px solid var(--main);
            width: 90%; max-width: 450px; max-height: 85vh; overflow-y: auto;
        }
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 90; }
        select { padding: 10px; font-size: 1em; border-radius: 5px; margin: 10px 0; width: 100%; border: 1px solid #ccc; }
        
        .seccion-modal { margin-bottom: 15px; text-align: left; }
        .seccion-modal label { font-weight: bold; display: block; margin-bottom: 5px; }
        
        #lista-alumnos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .alumno-check { font-size: 0.9em; display: flex; align-items: center; gap: 5px; cursor: pointer; }

        #resultado { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); background: white; border: 1px solid #ccc; max-width: 1200px; margin: 0 auto; }
        .tarjeta { padding: 20px; border-right: 1px dashed #ccc; border-bottom: 1px dashed #ccc; min-height: 380px; display: flex; flex-direction: column; background: white; }
        .orden-dia { background-color: #f0f4f8 !important; border: 2px solid var(--hi) !important; }
        .admin-fincas { background-color: #fff4f4 !important; border: 2px solid #c0392b !important; }
        .t-num { color: var(--hi); font-weight: 900; font-size: 1.1em; border-bottom: 2px solid var(--acc); margin-bottom: 12px; display: inline-block; }
        .item { margin-bottom: 10px; }
        .item b { display: block; font-size: 0.7em; color: #7f8c8d; text-transform: uppercase; }
        .item span { font-size: 1em; font-weight: 500; color: #2c3e50; }
        .aviso { background: #fff4e5; border: 1px solid var(--acc); padding: 10px; margin-top: auto; border-radius: 5px; }

        @media print { 
            .no-print, .overlay, #modal-config { display: none !important; } 
            #resultado { display: grid !important; grid-template-columns: 1fr 1fr !important; } 
            .tarjeta { break-inside: avoid; min-height: 14cm !important; } 
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Vecinos de Impro IA 🏢</h1>
        <div class="botones-wrap">
            <button id="btn-abrir-config" onclick="abrirModal()">Configurar Reunión</button>
            <button id="btn-imprimir" onclick="window.print()" style="display: none;">Imprimir Todo</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="cerrarModal()"></div>
    
    <div id="modal-config">
        <h3 style="margin-top:0;">Configurar Reunión</h3>
        
        <div class="seccion-modal">
            <label>1. Elige la Clase:</label>
            <select id="select-clase" onchange="cargarAlumnos()"></select>
        </div>

        <div class="seccion-modal">
            <label>2. ¿Quiénes participan? (<span id="contador">0</span>)</label>
            <div id="lista-alumnos"></div>
        </div>

        <div class="seccion-modal" style="background: #f9f9f9; padding: 10px; border-radius: 5px;">
            <label style="cursor:pointer; display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="check-distintas" checked style="transform: scale(1.2);"> 
                Cada vecino en una casa distinta
            </label>
        </div>

        <button id="btn-generar" onclick="prepararGeneracion()" style="background: var(--hi); width: 100%; margin-top: 10px;">¡Generar con estos Nombres!</button>
    </div>

    <div id="resultado">
        <p style="padding: 60px; text-align: center; grid-column: 1/-1; color: #7f8c8d;">Abre la configuración para elegir a los alumnos.</p>
    </div>

    <script src="datagenero.js"></script>
    
    <script>
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';

        function inicializarClases() {
            const sel = document.getElementById('select-clase');
            if(!window.ALUMNOS_POR_CLASE) {
                alert("No se encontró window.ALUMNOS_POR_CLASE en datagenero.js");
                return;
            }
            for (let clase in window.ALUMNOS_POR_CLASE) {
                let opt = document.createElement('option');
                opt.value = clase; opt.textContent = clase;
                sel.appendChild(opt);
            }
            cargarAlumnos();
        }

        function cargarAlumnos() {
            const alumnos = window.ALUMNOS_POR_CLASE[document.getElementById('select-clase').value];
            const lista = document.getElementById('lista-alumnos');
            lista.innerHTML = '';
            alumnos.forEach(al => {
                const [nombre, genero] = al.split('|');
                const label = document.createElement('label');
                label.className = 'alumno-check';
                label.innerHTML = `<input type="checkbox" class="check-alumno" value="${nombre}|${genero}" checked onchange="actualizarContador()"> ${nombre}`;
                lista.appendChild(label);
            });
            actualizarContador();
        }

        function actualizarContador() {
            document.getElementById('contador').textContent = document.querySelectorAll('.check-alumno:checked').length;
        }

        function abrirModal() { document.getElementById('modal-config').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
        function cerrarModal() { document.getElementById('modal-config').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }

        async function prepararGeneracion() {
            const checks = document.querySelectorAll('.check-alumno:checked');
            const seleccionados = Array.from(checks).map(cb => {
                const [nombre, gen] = cb.value.split('|');
                const descGen = (gen === 'F' || gen === 'f') ? 'mujer' : 'hombre';
                return `${nombre} (${descGen})`;
            });
            
            if (seleccionados.length === 0) return alert("Selecciona al menos un vecino.");
            
            const soloCasasDistintas = document.getElementById('check-distintas').checked;
            cerrarModal();
            await generar(seleccionados, soloCasasDistintas);
        }

        async function generar(vecinosConGenero, soloCasasDistintas) {
            const resDiv = document.getElementById('resultado');
            resDiv.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:60px;">Redactando acta para: ${vecinosConGenero.join(', ')}...</p>`;

            const reglaVivienda = soloCasasDistintas 
                ? "REGLA DE VIVIENDA: Cada personaje DEBE vivir en una vivienda distinta (piso y letra únicos). No repitas la misma combinación de Piso/Letra." 
                : "REGLA DE VIVIENDA: Se permite que algunos personajes compartan el mismo piso y letra.";

            const promptEspecífico = `Crea una reunión de vecinos para estos participantes reales: ${vecinosConGenero.join(', ')}.

REGLAS DE ORO:
1. Crea UNA tarjeta de personaje por cada nombre proporcionado.
2. El apartado "Nombre y mote/alias" DEBE empezar con el NOMBRE REAL seguido de un mote divertido.
3. Respeta estrictamente el género (hombre/mujer) indicado entre paréntesis.
4. Distribución: Edificio de 4 plantas (Bajo, 1º, 2º, 3º) y letras A, B, C.
5. ${reglaVivienda}

Estructura de cada personaje:
Nombre y mote/alias:
Piso y letra: (Ej: 2ºB, Bajo A...)
Rasgo: Una peculiaridad destacable, manía, hábito extraño, gesto, olor, forma de hablar, etc.
Breve historia: Algo que explique su comportamiento. (Si vive con alguien, indica aquí con quién).
Forma de hablar o actitud: Cómo se comporta en la reunión.
Aviso a Navegantes: Información CRÍTICA que el resto de improvisadores deben saber sobre este personaje ANTES de empezar para que la interacción funcione. No des consejos de actuación, da datos contextuales para los demás (ej: deudas, olores, mala fama, vecino nuevo). Si vive con alguien, menciónalo también aquí claramente.

2. Después genera 1 TARJETA de "Orden del Día". Debe tener 4-5 puntos a tratar. Estos puntos deben estar relacionados con los conflictos, pisos o historias de los personajes que acabas de crear. No olvides también que puedes incluir conflictos con zonas comunes como parkings, rellanos, trasteros, jardines interiores, piscinas, pista de padel, columpios, etc. Formato: Título: Orden del Día (Opción A/B/C), Puntos:.

3. Por último, genera una tarjeta especial llamada "TÍTULO: TARJETA DEL ADMINISTRADOR". Esta tarjeta es para el moderador (el profesor). Debe contener 5 frases o estímulos externos para lanzar durante la reunión. Estas frases DEBEN ser congruentes con los personajes creados: si mencionas a un vecino por su nombre o piso para culparle de algo o pedirle explicaciones, asegúrate de que el género (vecino/vecina) y su rasgo o historia coincidan con lo generado anteriormente. Indica si la frase es para decir a todos, a alguien en concreto o a un minigrupo.

No uses asteriscos ni negritas. Sé creativo, breve y asegura conflicto inmediato.`;

            try {
                const response = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptEspecífico }] }] })
                });

                const data = await response.json();
                const texto = data.candidates[0].content.parts[0].text.replace(/\*/g, '');
                
                const seccionesOrden = texto.split(/TÍTULO: ORDEN DEL DÍA/i);
                const personajesTexto = seccionesOrden[0];
                const restoTexto = seccionesOrden.slice(1).join('TÍTULO: ORDEN DEL DÍA');
                const seccionesAdmin = restoTexto.split(/TÍTULO: TARJETA DEL ADMINISTRADOR/i);
                const ordenesTexto = seccionesAdmin[0].split(/TÍTULO: ORDEN DEL DÍA/i).filter(t => t.trim().length > 0);
                const adminTexto = seccionesAdmin[1] || "";

                const etiquetasP = ["Nombre y mote/alias", "Piso y letra", "Rasgo", "Historia", "Actitud", "Aviso a Navegantes"];
                const regexP = new RegExp(`(${etiquetasP.join('|')}):?\\s*([^\\n]+)`, 'gi');
                let hallazgosP = [];
                let match;
                while ((match = regexP.exec(personajesTexto)) !== null) {
                    hallazgosP.push({ etiqueta: match[1].toUpperCase(), valor: match[2].trim() });
                }

                let htmlPersonajes = '';
                for (let i = 0; i < hallazgosP.length; i += 6) {
                    htmlPersonajes += `<div class="tarjeta"><span class="t-num">VECINO</span>`;
                    for (let j = 0; j < 6; j++) {
                        if (hallazgosP[i+j]) {
                            const esAviso = hallazgosP[i+j].etiqueta === "AVISO A NAVEGANTES";
                            htmlPersonajes += `<div class="item ${esAviso ? 'aviso' : ''}"><b>${hallazgosP[i+j].etiqueta}</b><span>${hallazgosP[i+j].valor}</span></div>`;
                        }
                    }
                    htmlPersonajes += `</div>`;
                }

                document.getElementById('btn-imprimir').style.display = 'inline-block';
                resDiv.innerHTML = `<div class="tarjeta admin-fincas"><span class="t-num">ADMINISTRADOR</span><div class="item"><span>${adminTexto.trim().replace(/\n/g, '<br>')}</span></div></div>` + 
                                   `<div class="tarjeta orden-dia"><span class="t-num">ORDEN DEL DÍA</span><div class="item"><span>${ordenesTexto[0]?.trim().replace(/\n/g, '<br>• ') || ''}</span></div></div>` + 
                                   htmlPersonajes;

            } catch (e) {
                resDiv.innerHTML = `<p style="color:red; padding:60px;">Error de conexión. Por favor, reintenta.</p>`;
                console.error(e);
            }
        }
        window.onload = inicializarClases;
    </script>
</body>
</html>
