<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Situaciones al Vuelo - Maestro de Improvisación IA</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --color-principal: #6a1b9a;
    --color-secundario: #00bcd4;
    --color-fondo: #212121;
    --color-claro: #f3e5f5;
    --color-texto: #e0e0e0;
}
body {
    font-family: 'Poppins', sans-serif;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
    background: linear-gradient(135deg, #121212 0%, #212121 100%);
    color: var(--color-texto);
    min-height: 100vh;
}

#resultado {
    margin-top: 35px;
    padding: 30px;
    border: 3px solid var(--color-secundario);
    background-color: #313131;
    border-radius: 15px;
    min-height: 200px;
    position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: all 0.5s ease;
}

/* --- SECCIÓN DE TÍTULO --- */
.categoria-titulo {
    color: var(--color-secundario);
    font-size: 1.6em;
    margin-bottom: 10px;
    border-bottom: 2px dashed var(--color-principal);
    padding-bottom: 10px;
    font-weight: 900;
    text-align: center;
    text-transform: uppercase;
}

/* --- FRASE INTRODUCTORIA (CSS SEPARADO) --- */
.frase-intro-ia {
    display: block;
    color: var(--color-claro);
    font-size: 1rem;
    margin-bottom: 20px;
    text-align: center;
    font-style: italic;
    background: rgba(106, 27, 154, 0.2);
    padding: 10px;
    border-radius: 8px;
}

/* --- LISTA DE SITUACIONES --- */
.lista-situaciones {
    list-style: none;
    padding: 0;
    margin: 0;
    text-align: left;
}
.lista-situaciones li {
    background-color: #424242;
    padding: 15px 20px;
    margin-bottom: 12px;
    border-radius: 8px;
    border-left: 5px solid var(--color-secundario);
    transition: transform 0.2s;
}
.lista-situaciones li:hover { transform: translateX(5px); }

/* --- BOTONES Y OTROS --- */
.botones-container { display: flex; justify-content: center; margin-bottom: 40px; }
button {
    padding: 16px 30px;
    background-color: var(--color-principal);
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 20px;
    font-weight: 700;
    box-shadow: 0 8px 15px rgba(0,0,0,0.4);
}
button:disabled { background-color: #424242; }

.modo-tag {
    position: absolute;
    bottom: -15px;
    right: 20px;
    font-size: 0.8em;
    background-color: var(--color-principal);
    padding: 4px 10px;
    border-radius: 5px;
}

.windmill {
    width: 60px; height: 60px;
    border: 6px solid var(--color-secundario);
    border-radius: 50%;
    border-top-color: transparent;
    animation: spin 1s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="botones-container">
    <button onclick="generarContenido()">Generar 10 Situaciones</button>
</div>

<div id="resultado">
    <p style="text-align:center;">Pulsa el botón para comenzar.</p>
</div>

<script>
const TITULO_SITUACIONES = 'SITUACIONES AL VUELO';
const NUM_ELEMENTOS = 10;
const situacionesOffline = [
    "Te encuentras con tu ex en el supermercado.",
    "Llamas a tu madre desde la cárcel.",
    "Te confundes de funeral y das el pésame.",
    "Intentas devolver un regalo usado.",
    "Tu vecino planta algo ilegal.",
    "Convences a un extraño de que eres famoso.",
    "Atrapado en el ascensor con tu enemigo.",
    "Paquete sospechoso recibido por error.",
    "Error grave en tu primer día de trabajo.",
    "Pagas un chicle con un billete de 100."
];

function limpiarTexto(texto) {
    if (!texto) return '';
    // Elimina números al principio, asteriscos y espacios extra
    let limpio = texto.replace(/^[\d\.\-\s*]+/, '').trim();
    limpio = limpio.charAt(0).toUpperCase() + limpio.slice(1);
    if (!limpio.match(/[.?!]$/)) limpio += '.';
    return limpio;
}

async function generarContenido() {
    const resultadoDiv = document.getElementById('resultado');
    const boton = document.querySelector('button');
    boton.disabled = true;

    resultadoDiv.innerHTML = '<div style="display:flex; justify-content:center; padding:40px;"><div class="windmill"></div></div>';

    let textoGenerado;
    let modo = 'IA';

    try {
        const prompt = "Actúa como maestro de improvisación. Genera EXACTAMENTE 10 situaciones cortas de una sola frase cada una. NO incluyas introducciones ni despedidas, solo las 10 frases numeradas.";
        const res = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                contents:[{ role:"user", parts:[{ text: prompt }] }],
                generationConfig: { temperature:0.8, maxOutputTokens:1000 }
            })
        });

        const data = await res.json();
        textoGenerado = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    } catch(e) {
        textoGenerado = situacionesOffline.join('\n');
        modo = 'Offline';
    }

    // Filtrar: quitamos líneas que sean saludos o muy cortas
    let lineas = textoGenerado.split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 20); // Filtramos frases que probablemente sean saludos cortos

    let html = `<div class="categoria-titulo">${TITULO_SITUACIONES}</div>`;
    html += `<span class="frase-intro-ia">Aquí tienes las 10 situaciones para tu reto de hoy:</span>`;
    html += `<ul class="lista-situaciones">`;
    
    lineas.slice(0, NUM_ELEMENTOS).forEach((l, i) => {
        html += `<li><strong>${i+1}.</strong> ${limpiarTexto(l)}</li>`;
    });
    
    html += `</ul><div class="modo-tag">[Modo: ${modo}]</div>`;

    resultadoDiv.innerHTML = html;
    boton.disabled = false;
}
</script>

<hr style="margin-top: 40px; border-color: #424242;">
<div style="text-align:center; padding-bottom:20px;">
    <a href="index.html" style="text-decoration:none; color:#e0e0e0; font-weight:bold;">← Volver al Menú Principal</a>
</div>

</body>
</html>
