<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dúo Dinámico - Títulos de Impro</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00ff88;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 200, 255, 0.05) 0%, transparent 40%);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-weight: 900;
            letter-spacing: -2px;
            font-size: 2.5rem;
            margin-bottom: 30px;
            background: linear-gradient(to right, #00ff88, #00c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        #resultado {
            width: 100%;
            max-width: 600px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            transition: all 0.5s ease;
        }

        .titulo-impro {
            font-size: 1.2rem;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        button {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s transform;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 255, 136, 0.4);
        }

        button:disabled {
            filter: grayscale(1);
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loader {
            width: 30px;
            height: 30px;
            border: 3px solid var(--accent);
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-link {
            margin-top: 50px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .footer-link:hover { color: var(--accent); }

    </style>
</head>
<body>

    <h1>Titulos para Una Impro</h1>

    <div id="resultado">
        <div style="text-align:center;"><div class="loader"></div></div>
    </div>

    <button id="btnGenerar" onclick="generarTitulos()">Nuevos Títulos</button>

    <a href="index.html" class="footer-link">← Volver al Menú</a>

    <script>
        const API_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';
        
        // El prompt incluye tus ejemplos para guiar a la IA
        const PROMPT_TEXT = `Genera 5 títulos creativos y absurdos para una improvisación teatral entre dos personas. 
        Inspírate en este estilo:
		- Arañas a las que les gustan los Nachos
        - Benito vente pa la Superbowl
		- Los cuñados se van al fútbol y olvidan el bocadillo
		- Las ginecólogas bulgaras van a un congreso
        - La entrevista que no era para ese puesto
        - El ascensor que siempre se para en el 3º
        - El vecino que aplaude a destiempo
        - La llamada perdida a las 3:17
        - La fiesta sorpresa equivocada
        - El compañero que siempre dice “una cosa rápida”
        - La última croqueta de la bandeja

        
        Formato: Devuelve solo los 5 títulos, uno por línea, sin números ni guiones.`;

        async function generarTitulos() {
            const container = document.getElementById('resultado');
            const boton = document.getElementById('btnGenerar');
            
            boton.disabled = true;
            container.innerHTML = '<div style="text-align:center;"><div class="loader"></div><p>Inspirando a los musos...</p></div>';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: PROMPT_TEXT }] }]
                    })
                });

                if (!response.ok) throw new Error("Error en la red");

                const data = await response.json();
                const textoRaw = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                // Limpiar y procesar líneas
                const lineas = textoRaw.split('\n')
                    .map(l => l.trim().replace(/^[\d.-]+/, '').trim())
                    .filter(l => l.length > 5)
                    .slice(0, 5);

                renderizar(lineas);

            } catch (error) {
                container.innerHTML = `<p style="color:#ff4444; text-align:center;">Vaya, parece que la IA se ha quedado en blanco. Inténtalo de nuevo.</p>`;
                console.error(error);
            } finally {
                boton.disabled = false;
            }
        }

        function renderizar(frases) {
            const container = document.getElementById('resultado');
            container.innerHTML = '';
            
            frases.forEach((frase, index) => {
                const div = document.createElement('div');
                div.className = 'titulo-impro';
                div.style.animationDelay = `${index * 0.1}s`;
                div.textContent = frase;
                container.appendChild(div);
            });
        }

        // Carga automática al iniciar
        window.onload = generarTitulos;
    </script>
</body>
</html>
