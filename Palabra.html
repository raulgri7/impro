<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabra al Aire - Maestro de Improvisaci&oacute;n IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-principal: #6a1b9a;
            --color-secundario: #00bcd4;
            --color-fondo: #212121;
            --color-claro: #f3e5f5;
            --color-texto: #e0e0e0;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
            background: linear-gradient(135deg, #121212 0%, #212121 100%);
            color: var(--color-texto);
            min-height: 100vh;
        }

        h1 { 
            color: var(--color-secundario); 
            text-align: center;
            border-bottom: 3px solid var(--color-principal); 
            padding-bottom: 15px; 
            margin-bottom: 40px; 
            text-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
            font-weight: 900;
        }

        .botones-container {
            display: flex;
            justify-content: center; 
            margin-bottom: 40px;
        }

        button { 
            padding: 16px 30px; 
            background-color: var(--color-principal); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 20px; 
            font-weight: 700;
            transition: all 0.3s ease; 
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4), 0 0 15px var(--color-secundario); 
            min-width: 300px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        button:hover:not(:disabled) { 
            background-color: #7b1fa2;
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 20px var(--color-secundario);
        }
        button:disabled {
            background-color: #424242;
            color: #9e9e9e;
            cursor: default;
            box-shadow: none;
        }

        #resultado { 
            margin-top: 35px; 
            padding: 30px; 
            border: 3px solid var(--color-secundario); 
            background-color: #313131; 
            border-radius: 15px; 
            min-height: 200px;
            font-size: 1.2em; 
            line-height: 1.6;
            text-align: center;
            position: relative; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        }

        .modo-tag {
            position: absolute;
            bottom: -15px;
            right: 20px; 
            font-size: 0.8em;
            color: white; 
            background-color: var(--color-principal); 
            padding: 4px 10px;
            border-radius: 5px; 
            font-weight: 700;
        }
        
        .categoria-titulo { 
            color: var(--color-secundario); 
            font-size: 1.6em; 
            margin-bottom: 15px; 
            border-bottom: 2px dashed var(--color-principal); 
            padding-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .palabra-principal {
            font-size: 2.5em;
            font-weight: 900;
            color: var(--color-principal); 
            margin: 15px 0;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px var(--color-secundario); 
            animation: bounce 0.6s ease-out;
        }

        .palabras-reserva {
            margin-top: 15px; 
            padding-top: 15px; 
            border-top: 1px solid var(--color-secundario); 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .palabras-reserva span {
            font-weight: 700;
            color: var(--color-principal);
            background-color: var(--color-claro);
            padding: 5px 15px; 
            border: 2px solid var(--color-principal);
            border-radius: 20px;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(33, 33, 33, 0.8);
            display: flex; align-items: center; justify-content: center;
            border-radius: 15px; z-index: 100;
        }

        .windmill {
            width: 50px; height: 50px;
            border: 5px solid var(--color-secundario);
            border-radius: 50%; 
            border-top-color: transparent; 
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes bounce {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>PALABRAS AL AIRE</h1>

    <div class="botones-container">
        <button id="btnGenerar" onclick="generarContenido()">Generar Palabras</button>
    </div>
    
    <div id="resultado">
        <p style="color: var(--color-claro);">Pulsa el bot&oacute;n para lanzar las palabras al aire.</p>
        <div class="modo-tag">[Modo: Espera]</div>
    </div>

    <script>
        const TITULO_PALABRA = 'PALABRAS AL AIRE';
        const NUM_ELEMENTOS = 5;
        const FALLBACK_MODE = false; // Variable definida para evitar error

        const palabrasOffline = [
            "Abismo", "Abeja", "Abrazo", "Abuelo", "Ajedrez", "Algoritmo", "Alfombra", "Almendra",  
            "Amazon", "Amazonia", "Amapola", "Ancla", "Arena", "Argentina", "Arcoíris", "Atlántico",  
            "Atlántida", "Átomo", "Aurora", "Bailar", "Bad Bunny", "Balón", "Bambú", "Bandera", "Ballena",  
            "Beethoven", "Berlina", "Berlín", "Beso", "Bicicleta", "Bill Murray", "Billie Eilish", "Botella", "Bosque", "Brooklyn",  
            "Brújula", "Buzón", "Café", "Caer", "Cactus", "Cámara", "Canción", "Cangrejo", "Cápsula",  
            "Caracol", "Caramelo", "Caravana", "Carbón", "Cascada", "Castillo", "Caverna", "Cebolla",  
            "Ceniza", "Cereza", "Chicharra", "Chiquito", "Chispa", "Cicatriz", "Circo", "Cielo",  
            "Cleopatra", "Cometa", "Coral", "Corazón", "Corcho", "Crisálida", "Cristal", "Cuchara", "Cuchillo",  
            "Cuarzo", "Darth Vader", "Despertar", "Desierto", "Deseo", "Desvelo", "Diamante", "Dinosaurio", "Drake", "Duda",  
            "Dragón", "Duki", "Dwayne Johnson", "Eco", "Eclipse", "Ecuador", "Edipo", "Einstein", "Electricidad", "Elefante",  
            "Elon Musk", "Espejo", "Espejismo", "Espuma", "Esquí", "Estrella", "Facebook", "Faro", "Fénix",  
            "Filosofía", "Flamenco", "Flauta", "Flor", "Florencia", "Fósforo", "Fractal", "Fragancia",  
            "Frambuesa", "Frida Kahlo", "Fresa", "Frontera", "Fuego", "Futuro", "Galaxia", "Gato", "Gaviota",  
            "Globo", "Google", "Goya", "Gravedad", "Gris", "Guitarra", "Henry Cavill", "Hielo", "Himalaya", "Hoja", "Holograma",  
            "Horizonte", "Huracán", "Iceberg", "IKEA", "Imán", "Invierno", "Italia", "Japón", "Jardín", "Jason Statham", "Júpiter",  
            "Jungla", "Justin Bieber", "Kafka", "Laberinto", "Lady Gaga", "Lágrima", "Lámpara", "Lápiz", "Leonardo DiCaprio", "Libertad",  
            "Limón", "Lisboa", "Lluvia", "Londres", "Luna", "Madrid", "Madonna", "Magma", "Mandarina", "Manta", "Manantial",  
            "Manzana", "Mariposa", "Marte", "Máquina", "Masa", "Melancolía", "Melodrama", "Melón",  
            "Memoria", "Mermelada", "Messi", "Michael Jackson", "Micrófono", "Microscopio", "Miel", "Misterio", "Mochila",  
            "Moneda", "Montaña", "Murciélago", "Murmullo", "Neón", "Neblina", "Netflix", "Nieve", "Nicki Minaj", "Nostalgia",  
            "Nube", "Nueva York", "Obama", "Océano", "Olvido", "Ópera", "Oprah", "Otoño", "Palabra",  
            "Palacio", "Pandora", "Pantera", "Papel", "Paraguas", "Paralelo", "París", "Pájaro",  
            "Pestaña", "Pedro Pascal", "Penélope Cruz", "Perfume", "Piano", "Picasso", "Piedra", "Pirámide", "Pirata", "Pizarra",  
            "Pizza", "Planeta", "Pluma", "Plutón", "Poesía", "Polvo", "Praga", "Prisma", "Pulmón",  
            "Rafa Nadal", "Rascacielos", "Rayo", "Relámpago", "Reloj", "Rihanna", "Río", "Robot", "Robert Pattinson", "Robert Redford", "Romero", "Rosalía", "Rubí", "Rueda",  
            "Rumor", "Samba", "Satélite", "Saturno", "Saltar", "Selva", "Selfie", "Sésamo",  
            "Shakespeare", "Sherlock Holmes", "Shakira", "Silencio", "Silicona", "Sombra", "Sombrero", "Sopa", "Sol", "Sonrisa",  
            "Submarino", "Susurro", "Taberna", "Tambor", "Taylor Swift", "Teatro", "Teclado", "Teléfono", "Telescopio", "Tesoro",  
            "The Weeknd", "Tigre", "TikTok", "Tina Fey", "Tokio", "Tormenta", "Tren", "Trinchera", "Trompeta", "Trump",  
            "Trueno", "Wos", "Twitter", "Unicornio", "Universo", "Valencia", "Válvula", "Ventana", "Venganza", "Vértigo", "Viaje",  
            "Viento", "Vinilo", "Vino", "Volcán", "Whisky", "Zafiro", "Zapatilla", "Zapato", "Zepelín", "Zendaya", "Zorro"
       ];

        function limpiarTexto(texto) {
            if (!texto) return '';
            let limpio = texto.trim().replace(/[.#*]/g, '');
            return limpio.charAt(0).toUpperCase() + limpio.slice(1);
        }

        function obtenerResultadosOffline() {
            const aleatorias = [...palabrasOffline].sort(() => 0.5 - Math.random()).slice(0, NUM_ELEMENTOS);
            return `### ${TITULO_PALABRA}\n` + aleatorias.join('\n');
        }

        async function generarContenido() { 
            const resultadoDiv = document.getElementById('resultado');
            const boton = document.getElementById('btnGenerar');
            
            boton.disabled = true;
            const loadingOverlay = document.createElement('div');
            loadingOverlay.className = 'loading-overlay';
            loadingOverlay.innerHTML = '<div class="windmill"></div>';
            resultadoDiv.appendChild(loadingOverlay);

            // 50% probabilidad de usar IA o Offline
            let usarIA = FALLBACK_MODE ? false : Math.random() < 0.5;
            let modo = usarIA ? 'IA' : 'Offline';
            let textoGenerado = "";

            try {
                if (usarIA) {
                    const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "Genera 5 palabras aleatorias para improvisacion teatral. Formato: ### PALABRAS AL AIRE seguido de las palabras en lineas nuevas." }] }]
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        textoGenerado = data.candidates?.[0]?.content?.parts?.[0]?.text || obtenerResultadosOffline();
                    } else {
                        throw new Error("API Fallida");
                    }
                } else {
                    await new Promise(r => setTimeout(r, 800));
                    textoGenerado = obtenerResultadosOffline();
                }

                // Procesar texto
                const lineas = textoGenerado.split('\n').map(l => l.replace(/###/g, '').trim()).filter(l => l.length > 0);
                const titulo = lineas[0] || TITULO_PALABRA;
                const items = lineas.slice(1).map(limpiarTexto);

                let html = `<div class="categoria-titulo">${titulo}</div>`;
                if(items.length > 0) {
                    html += `<p>&iexcl;Tu palabra principal es!</p><div class="palabra-principal">${items[0]}</div>`;
                    if(items.length > 1) {
                        html += `<div class="palabras-reserva">` + items.slice(1,5).map(p => `<span>${p}</span>`).join('') + `</div>`;
                        html += `<p style="font-size:0.8em; margin-top:15px;">Usa las palabras de apoyo si te quedas en blanco.</p>`;
                    }
                }
                
                resultadoDiv.innerHTML = html + `<div class="modo-tag">[Modo: ${modo}]</div>`;

            } catch (error) {
                resultadoDiv.innerHTML = `<p style="color:red;">Error conectando con la IA. Pulsa de nuevo.</p><div class="modo-tag">[Error]</div>`;
                console.error(error);
            } finally {
                boton.disabled = false;
                if(loadingOverlay) loadingOverlay.remove();
            }
        }
    </script>

    <div style="text-align: center; margin-top: 40px; padding-bottom: 20px;">
        <a href="index.html" style="text-decoration: none; color: #5f6368; font-weight: bold; padding: 10px 20px; border: 1px solid #ccc; border-radius: 5px;">
            &larr; Volver al Men&uacute; Principal
        </a>
    </div>
</body>
</html>
