<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Ejercicios</title>
    <style>
        body { font-family: 'Georgia', serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #f7f7f7; color: #333; }
        h1 { color: #4a148c; text-align: center; border-bottom: 3px solid #7b1fa2; padding-bottom: 10px; }
        .control-container { background: #ede7f6; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        button { padding: 12px 25px; background: #7b1fa2; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        #resultado { background: white; padding: 25px; border: 2px solid #7b1fa2; border-radius: 15px; min-height: 200px; }
        .ejercicio { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .ejercicio h3 { color: #4a148c; margin: 0 0 10px 0; }
        .cargando { color: #7b1fa2; font-weight: bold; display: block; text-align: center; }
    </style>
</head>
<body>

    <h1>Generador de Fichas</h1>
    
    <div class="control-container">
        <label>&iquest;N&uacute;mero de personas?: </label>
        <select id="num-personas">
            <option value="2">2 Personas</option>
            <option value="3">3 Personas</option>
            <option value="4">4 Personas</option>
            <option value="grupo">Grupo (5+)</option>
        </select>
        <button id="btn" onclick="generar()">Generar 10 Ejercicios</button>
    </div>

    <div id="resultado">
        <p style="text-align:center; color:#888;">El resultado aparecer&aacute; aqu&iacute;...</p>
    </div>

    <script>
        async function generar() {
            const resDiv = document.getElementById('resultado');
            const btn = document.getElementById('btn');
            const num = document.getElementById('num-personas').value;

            btn.disabled = true;
            resDiv.innerHTML = '<span class="cargando">Conectando con la IA... espera unos 10 segundos...</span>';

            const miPrompt = "Actua como experto en teatro. Genera 10 ejercicios de impro para " + num + " personas. Usa este formato: ### Titulo / Descripcion: ... / Variante: ...";

            try {
                // He cambiado la estructura del body para que sea la est¨¢ndar que esperan los Workers
                const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: miPrompt }]
                        }]
                    })
                });

                if (!response.ok) throw new Error("Servidor ca&iacute;do (Status: " + response.status + ")");

                const data = await response.json();
                
                // Intentamos sacar el texto de varias formas posibles por si el Worker cambia el formato
                let texto = "";
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    texto = data.candidates[0].content.parts[0].text;
                } else if (data.text) {
                    texto = data.text;
                }

                if (!texto) throw new Error("La IA respondi&oacute; vac&iacute;o.");

                // Procesamos el texto para mostrarlo bonito
                const bloques = texto.split('###').filter(b => b.trim().length > 5);
                let finalHTML = "";

                bloques.forEach(b => {
                    const lineas = b.split('\n');
                    const titulo = lineas.shift();
                    const resto = lineas.join('<br>').replace(/\*\*/g, '');
                    finalHTML += `<div class="ejercicio"><h3>${titulo}</h3><p>${resto}</p></div>`;
                });

                resDiv.innerHTML = finalHTML;

            } catch (err) {
                resDiv.innerHTML = `<div style="color:red; font-weight:bold;">Error: ${err.message}<br><small>Revisa que el Worker est&eacute; "Enabled" en Cloudflare.</small></div>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
