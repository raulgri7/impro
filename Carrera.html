<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador: Carrera Contra el Tiempo</title> 
    <style>
        body { 
            font-family: 'Roboto', sans-serif; 
            padding: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            background-color: #e8f5e9; 
            color: #333;
        }
        h1 { 
            color: #388e3c; 
            border-bottom: 3px solid #66bb6a; 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 2.2em;
        }
        p.instruccion { 
            color: #555; 
            margin-bottom: 25px; 
            text-align: center;
            font-size: 1.1em;
        }
        
        .boton-container {
            text-align: center;
            margin-bottom: 40px;
        }

        button { 
            padding: 16px 30px; 
            background-color: #388e3c; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 1.2em; 
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s; 
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.2); 
            text-transform: uppercase;
        }
        button:hover:not(:disabled) { background-color: #2e7d32; }
        button:active:not(:disabled) { 
            transform: translateY(3px); 
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); 
        }
        button:disabled {
             background-color: #a5d6a7;
             cursor: not-allowed;
             box-shadow: none;
        }
        
        #resultado { 
            margin-top: 35px; 
            padding: 30px; 
            border: 3px solid #388e3c; 
            background-color: #ffffff; 
            border-radius: 15px; 
            min-height: 250px; 
            font-size: 1.1em; 
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .cargando { 
            color: #388e3c; 
            font-weight: bold; 
            animation: pulse 1.5s infinite; 
            display: block;
            text-align: center;
            font-size: 1.2em;
            padding: 20px 0;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        #resultado strong {
            color: #388e3c;
            font-weight: bold;
        }
        #resultado h3 {
             color: #1b5e20;
             margin-top: 25px;
             margin-bottom: 10px;
             border-bottom: 2px dotted #66bb6a;
             padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <h1>&#9201; Escenarios: Carrera contra el Tiempo</h1>
    <p class="instruccion">Genera premisas para un ejercicio de improvisaci&oacute;n de condensaci&oacute;n r&aacute;pida (7-8 actores).</p>
    
    <div class="boton-container">
        <button id="generar-btn" onclick="generarPremisas()">Generar Situaciones</button>
    </div>
    
    <div id="resultado">
        <p style="text-align: center; color: #5f6368;">Pulsa el bot&oacute;n para generar las premisas que tu elenco deber&aacute; condensar en rondas de 2 min, 1 min, 30 seg y 15 seg.</p>
    </div>

    <script>
        // URL segura de tu Cloudflare Worker
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        function construirPromptCarrera() {
            return `Actua como experto en improvisacion. Genera EXACTAMENTE 6 premisas para el ejercicio "Carrera contra el tiempo".
            1. Actores: 7 u 8 personas.
            2. Formato: ### Titulo / **Premisa**: [trama] / **Roles**: [reparto para 7-8].
            3. Tematica: Incluye al menos dos situaciones en vehiculos grandes.
            No incluyas introducciones, solo el contenido.`;
        }

        async function generarPremisas() {
            const resultadoDiv = document.getElementById('resultado');
            const boton = document.getElementById('generar-btn');

            boton.disabled = true;
            resultadoDiv.innerHTML = '<span class="cargando">Generando escenarios de condensacion dramatica...</span>';
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: construirPromptCarrera() }] }],
                        generationConfig: { temperature: 0.7 }
                    })
                });

                if (!response.ok) throw new Error("Error en el servidor");

                const data = await response.json();
                const textoGenerado = data.candidates[0].content.parts[0].text.trim();
                
                // Formateo y visualización
                let htmlFinal = textoGenerado
                    .replace(/###\s*(.*)/g, '<h3>$1</h3>')
                    .replace(/\n/g, '<br>');

                resultadoDiv.innerHTML = htmlFinal;

            } catch (error) {
                resultadoDiv.innerHTML = `<strong style="color: #c53929;">Error:</strong> No se pudo conectar con la IA.`;
            } finally {
                boton.disabled = false;
            }
        }
    </script>

    <div style="text-align: center; margin-top: 40px; padding-bottom: 20px;">
        <a href="index.html" style="text-decoration: none; color: #5f6368; font-weight: bold; padding: 10px 20px; border: 1px solid #ccc; border-radius: 5px;">
            &larr; Volver al Men&uacute; Principal
        </a>
    </div>

</body>
</html>
