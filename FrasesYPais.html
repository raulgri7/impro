<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Generador: Pa&iacute;s, Historia y 6 Frases (Impro)</title>
    <style>
        /* ----------------------------------------------------------
           ESTILOS (LOOK AND FEEL - TEATRO Y DRAMATURGIA)
           ---------------------------------------------------------- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            max-width: 850px;
            margin: 0 auto;
            background-color: #f1f8e9; /* Verde muy claro */
            color: #263238;
            line-height: 1.6;
        }

        h1 {
            color: #2e7d32; /* Verde bosque */
            border-bottom: 4px solid #81c784;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 2.4em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p.instruccion {
            color: #546e7a;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.15em;
            font-style: italic;
        }

        /* Contenedor del Bot&oacute;n */
        .boton-container {
            text-align: center;
            margin-bottom: 40px;
        }

        button {
            padding: 18px 35px;
            background: linear-gradient(145deg, #43a047, #2e7d32);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(145deg, #4caf50, #388e3c);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            background: #b0bec5;
            cursor: not-allowed;
            box-shadow: none;
        }

        #resultado {
            margin-top: 20px;
            padding: 35px;
            border-left: 8px solid #2e7d32;
            background-color: #ffffff;
            border-radius: 12px;
            min-height: 200px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        /* Estilos de la carga */
        .cargando {
            color: #388e3c;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            display: block;
            text-align: center;
            font-size: 1.3em;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Estilos espec&iacute;ficos para la respuesta generada */
        #resultado h3 {
            color: #1b5e20;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px dashed #a5d6a7;
            display: inline-block;
            padding-bottom: 5px;
        }

        #resultado strong {
            color: #2e7d32;
        }

        #resultado em strong {
            color: #d32f2f; /* Rojo para el pa&iacute;s */
            font-size: 1.2em;
            text-decoration: underline;
        }

        .error-detalle {
            background-color: #ffebee;
            border: 1px solid #c62828;
            padding: 15px;
            border-radius: 8px;
            color: #c62828;
            font-family: monospace;
            margin-top: 20px;
        }

        a.volver {
            text-decoration: none;
            color: #455a64;
            font-weight: bold;
            padding: 12px 25px;
            border: 2px solid #cfd8dc;
            border-radius: 8px;
            transition: all 0.3s;
            display: inline-block;
        }

        a.volver:hover {
            background-color: #cfd8dc;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>🌎 Generador: Pa&iacute;s, Historia y Frases</h1>
    <p class="instruccion">Genera 6 frases, 1 pa&iacute;s y 5 hechos hist&oacute;ricos con contexto para tu ejercicio de improvisaci&oacute;n.</p>

    <div class="boton-container">
        <button id="generar-btn" onclick="generarPremisas()">Generar Elementos para Improvisaci&oacute;n</button>
    </div>

    <div id="resultado">
        <p style="text-align: center; color: #78909c;">Pulsa el bot&oacute;n para obtener los elementos dram&aacute;ticos que el destino ha preparado.</p>
    </div>

    <script>
        // --- CONFIGURACI&Oacute;N DEL WORKER ---
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        const listaPaises = [
            "Afganist&aacute;n", "Alemania", "Angola", "Arabia Saud&iacute;", "Argelia", "Argentina", "Australia", "Austria",
            "Bangladesh", "B&eacute;lgica", "Bolivia", "Botsuana", "Brasil", "Bulgaria", "Camer&uacute;n", "Canad&aacute;",
            "Catar", "Chile", "China", "Colombia", "Corea del Norte", "Corea del Sur", "Costa de Marfil", "Costa Rica",
            "Croacia", "Cuba", "Dinamarca", "Ecuador", "Egipto", "El Salvador", "Emiratos &Aacute;rabes Unidos", "Eslovaquia",
            "Eslovenia", "Espa&ntilde;a", "Estados Unidos", "Estonia", "Etiop&iacute;a", "Filipinas", "Finlandia", "Francia",
            "Ghana", "Grecia", "Guatemala", "Guinea", "Hait&iacute;", "Honduras", "Hungr&iacute;a", "India",
            "Indonesia", "Irak", "Ir&aacute;n", "Irlanda", "Islandia", "Israel", "Italia", "Jap&oacute;n",
            "Jordania", "Kazajist&aacute;n", "Kenia", "Kuwait", "Laos", "Letonia", "L&iacute;bano", "Liberia",
            "Libia", "Lituania", "Luxemburgo", "Madagascar", "Marruecos", "M&eacute;xico", "Mozambique", "Namibia",
            "Nepal", "Nicaragua", "Nigeria", "Noruega", "Nueva Zelanda", "Om&aacute;n", "Pa&iacute;ses Bajos", "Pakist&aacute;n",
            "Panam&aacute;", "Paraguay", "Per&uacute;", "Polonia", "Portugal", "Reino Unido", "Rep&uacute;blica Centroafricana", "Rep&uacute;blica Checa",
            "Rep&uacute;blica del Congo", "Rep&uacute;blica Democr&aacute;tica del Congo", "Rep&uacute;blica Dominicana", "Ruman&iacute;a", "Rusia", "Senegal", "Serbia",
            "Singapur", "Siria", "Sri Lanka", "Sud&aacute;frica", "Sud&aacute;n", "Sud&aacute;n del Sur", "Suecia", "Suiza",
            "Tailandia", "Tanzania", "T&uacute;nez", "Turqu&iacute;a", "Ucrania", "Uganda", "Uruguay", "Uzbekist&aacute;n",
            "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabue"
        ];

        function seleccionarPaisAlAzar() {
            const indice = Math.floor(Math.random() * listaPaises.length);
            return listaPaises[indice];
        }

        function construirPromptImproHistoria(pais) {
            // Decodificamos entidades para el prompt de la IA
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = pais;
            const paisDecodificado = tempDiv.textContent;

            return `Act&uacute;a como un generador de premisas para improvisaci&oacute;n teatral. Tu tarea es generar **DOS LISTAS** separadas por encabezados Markdown, sin introducciones.

INSTRUCCIONES:
1. **SECCI&Oacute;N 1 (6 Frases):** Una de cada tipo: refr&aacute;n, canci&oacute;n famosa, cita de cine, jerga de Espa&ntilde;a, frase absurda y frase cotidiana.
2. **SECCI&Oacute;N 2 (Hechos de ${paisDecodificado}):** 5 hechos hist&oacute;ricos o mitos reales de este pa&iacute;s con una explicaci&oacute;n de 2-3 l&iacute;neas cada uno.

FORMATO:
* Usa "### 🗣️ Las 6 Frases Aleatorias"
* Usa "### 🌎 Hechos de ***${paisDecodificado}***" (negrita cursiva para el pa&iacute;s).
* Usa listas numeradas.`;
        }

        function formatearResultado(texto) {
            return texto
                .replace(/###\s*(.*)/g, '<h3>$1</h3>')
                .replace(/\*\*\*(.*?)\*\*\*/g, '<em><strong>$1</strong></em>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }

        async function generarPremisas() {
            const resultadoDiv = document.getElementById('resultado');
            const boton = document.getElementById('generar-btn');

            boton.disabled = true;
            resultadoDiv.innerHTML = '<span class="cargando">Invocando a las musas del teatro...</span>';

            const paisSeleccionado = seleccionarPaisAlAzar();
            const promptFinal = construirPromptImproHistoria(paisSeleccionado);

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptFinal }] }]
                    })
                });

                if (!response.ok) throw new Error('El servidor no responde correctamente.');

                const data = await response.json();
                const textoGenerado = data.candidates[0].content.parts[0].text.trim();

                resultadoDiv.innerHTML = formatearResultado(textoGenerado);
                boton.disabled = false;

            } catch (error) {
                resultadoDiv.innerHTML = `
                    <div class="error-detalle">
                        <strong>Error de Conexi&oacute;n:</strong> No se pudo contactar con el generador.<br>
                        <em>Detalle: ${error.message}</em>
                    </div>
                `;
                boton.disabled = false;
            }
        }
    </script>

    <hr style="margin-top: 50px; border: 0; border-top: 1px solid #cfd8dc;">
    <div style="text-align: center; margin-top: 20px; padding-bottom: 40px;">
        <a href="index.html" class="volver">&larr; Volver al Men&uacute; Principal</a>
    </div>
</body>
</html>
