<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 Generador: País, Historia y 6 Frases (Impro) - Categorías Finales</title>
    <style>
        /* ----------------------------------------------------------
           ESTILOS (LOOK AND FEEL - TEATRO Y DRAMATURGIA)
           ---------------------------------------------------------- */
        body {
            font-family: 'Roboto', sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            background-color: #e8f5e9; /* Verde claro suave */
            color: #333;
        }
        h1 {
            color: #388e3c; /* Verde esmeralda oscuro */
            border-bottom: 3px solid #66bb6a;
            padding-bottom: 15px;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.2em;
        }
        p.instruccion {
            color: #555;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.1em;
        }

        /* Contenedor del Botón */
        .boton-container {
            text-align: center;
            margin-bottom: 40px;
        }

        button {
            padding: 16px 30px;
            background-color: #388e3c; /* Verde principal */
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 5px 8px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
        }
        button:hover:not(:disabled) { background-color: #2e7d32; }
        button:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        button:disabled {
            background-color: #a5d6a7;
            cursor: not-allowed;
            box-shadow: none;
        }

        #resultado {
            margin-top: 35px;
            padding: 30px;
            border: 3px solid #388e3c;
            background-color: #ffffff; /* Fondo blanco para el contenido */
            border-radius: 15px;
            min-height: 250px;
            font-size: 1.1em;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Estilos de la carga */
        .cargando {
            color: #388e3c;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            display: block;
            text-align: center;
            font-size: 1.2em;
            padding: 20px 0;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Estilos específicos para la respuesta generada */
        pre {
            font-family: inherit;
            margin: 0;
            padding: 0;
            white-space: pre-wrap;
            line-height: 1.6;
            font-weight: normal;
        }

        /* Mejorar la legibilidad de la salida */
        #resultado strong {
            color: #388e3c;
            font-weight: bold;
        }
        #resultado h3 {
            color: #1b5e20;
            margin-top: 25px;
            margin-bottom: 5px;
            border-bottom: 2px dotted #66bb6a;
            padding-bottom: 5px;
        }
        
        /* === ESTILO: Destacar el país en el encabezado === */
        #resultado h3 em strong {
            color: #c53929; /* Color rojo oscuro llamativo */
            font-size: 1.1em; /* Un poco más grande */
            font-weight: bolder;
        }

        #resultado li {
            margin-bottom: 10px;
        }
        .error-detalle {
            background-color: #ffebee;
            border: 1px solid #c53929;
            padding: 10px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>🌎 Generador: País, Historia y Frases</h1>
    <p class="instruccion">Genera 6 frases, 1 país y 5 hechos históricos con contexto para tu ejercicio de improvisación.</p>

    <div class="boton-container">
        <button id="generar-btn" onclick="generarPremisas()">Generar Elementos para Improvisación</button>
    </div>

    <div id="resultado">
        <p style="text-align: center; color: #5f6368;">Pulsa el botón para obtener los tres elementos de improvisación que te pide el público.</p>
    </div>

    <script>
        // ----------------------------------------------------------
        // --- CLAVE API Y CONFIGURACIÓN (NO TOCAR) ---
        // ----------------------------------------------------------
        const API_KEY = 'AIzaSyCsbHnWzkKzwqMYV5oRZSfZvO9SNvjPTAM'; // Usar tu clave real aquí
        const MODEL_NAME = 'gemini-2.5-flash';
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;

        // ----------------------------------------------------------
        // --- LISTA DE PAÍSES Y FUNCIÓN DE SELECCIÓN ---
        // ----------------------------------------------------------
        const listaPaises = [
            "Afganistán", "Alemania", "Angola", "Arabia Saudí", "Argelia", "Argentina", "Australia", "Austria",
            "Bangladesh", "Bélgica", "Bolivia", "Botsuana", "Brasil", "Bulgaria", "Camerún", "Canadá",
            "Catar", "Chile", "China", "Colombia", "Corea del Norte", "Corea del Sur", "Costa de Marfil", "Costa Rica",
            "Croacia", "Cuba", "Dinamarca", "Ecuador", "Egipto", "El Salvador", "Emiratos Árabes Unidos", "Eslovaquia",
            "Eslovenia", "España", "Estados Unidos", "Estonia", "Etiopía", "Filipinas", "Finlandia", "Francia",
            "Ghana", "Grecia", "Guatemala", "Guinea", "Haití", "Honduras", "Hungría", "India",
            "Indonesia", "Irak", "Irán", "Irlanda", "Islandia", "Israel", "Italia", "Japón",
            "Jordania", "Kazajistán", "Kenia", "Kuwait", "Laos", "Letonia", "Líbano", "Liberia",
            "Libia", "Lituania", "Luxemburgo", "Madagascar", "Marruecos", "México", "Mozambique", "Namibia",
            "Nepal", "Nicaragua", "Nigeria", "Noruega", "Nueva Zelanda", "Omán", "Países Bajos", "Pakistán",
            "Panamá", "Paraguay", "Perú", "Polonia", "Portugal", "Reino Unido", "República Centroafricana", "República Checa",
            "República del Congo", "República Democrática del Congo", "República Dominicana", "Rumanía", "Rusia", "Senegal", "Serbia",
            "Singapur", "Siria", "Sri Lanka", "Sudáfrica", "Sudán", "Sudán del Sur", "Suecia", "Suiza",
            "Tailandia", "Tanzania", "Túnez", "Turquía", "Ucrania", "Uganda", "Uruguay", "Uzbekistán",
            "Venezuela", "Vietnam", "Yemen", "Zambia", "Zimbabue"
        ];

        function seleccionarPaisAlAzar() {
            const indice = Math.floor(Math.random() * listaPaises.length);
            return listaPaises[indice];
        }

        // ----------------------------------------------------------
        // --- PROMPT MODIFICADO (CATEGORÍA DE ESPAÑA) ---
        // ----------------------------------------------------------

        // Función para construir el PROMPT detallado para el ejercicio de País/Historia/Frases
        function construirPromptImproHistoria(pais) {
            const contexto = `Actúa como un generador de premisas para improvisación teatral. Tu tarea es generar **DOS LISTAS** de contenido, separadas por encabezados, EXCLUSIVAMENTE en formato Markdown, sin introducción ni conclusión.

INSTRUCCIONES CLAVE:
1.  **SECCIÓN 1 (Frases - ALTA DIVERSIDAD):** Genera exactamente 6 frases cortas y sueltas. Deben ser radicalmente distintas en tono y origen para maximizar la dificultad y evitar repetición. Genera una de cada una de las siguientes categorías en orden:
    * 1. Un refrán popular o proverbio.
    * 2. Un fragmento lírico o verso de una canción famosa.
    * 3. Una cita de película o serie de televisión icónica.
    * 4. Un modismo, jerga o frase localista de España.
    * 5. Una frase de diálogo completamente absurda o surrealista.
    * 6. Una frase de diálogo cotidiano, simple e inocua.
2.  **SECCIÓN 2 (País y Hechos):** Genera 5 hechos históricos, mitos o leyendas **relacionados con el país** ${pais}. CADA HECHO DEBE INCLUIR UNA BREVE EXPLICACIÓN de 2 a 3 líneas sobre su contexto o significado.

REGLAS DE FORMATO ESTRICTO:
* Usa el encabezado de nivel 3 (###) "### 🗣️ Las 6 Frases Aleatorias" para la Sección 1.
* Usa el encabezado de nivel 3 (###) **"### 🌎 Hechos de ***${pais}***"** para la Sección 2. **ATENCIÓN: Envuelve el nombre del país en negrita y cursiva (***[País]***) en el encabezado.**
* Usa **listas numeradas** para las Frases.
* Usa **listas numeradas** para los Hechos Históricos. El formato debe ser: "Número. **Hecho/Mito/Leyenda:** Explicación de 2-3 líneas."

Genera el contenido ahora. **NO generes ninguna otra sección, lista o texto adicional.**`;

            return contexto;
        }

        // Función auxiliar para formatear la salida
        function formatearResultado(texto) {
            let html = texto
                .replace(/###\s*(.*)/g, '<h3>$1</h3>')
                .replace(/\*\*\*(.*?)\*\*\*/g, '<em><strong>$1</strong></em>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            return html;
        }

        // Función principal para llamar a la API
        async function generarPremisas() {
            const resultadoDiv = document.getElementById('resultado');
            const boton = document.getElementById('generar-btn');

            boton.disabled = true;
            resultadoDiv.innerHTML = '<span class="cargando">Generando elementos: 6 frases, 1 país y 5 hechos históricos...</span>';

            const paisSeleccionado = seleccionarPaisAlAzar();
            const prompt = construirPromptImproHistoria(paisSeleccionado);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: {
                            temperature: 0.9,
                            maxOutputTokens: 8192,
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({error: {message: 'Respuesta de error no es JSON'}}));
                    throw new Error(`Error HTTP ${response.status}: ${errorData.error ? errorData.error.message : response.statusText}`);
                }

                const data = await response.json();

                let textoGenerado = "";

                try {
                    textoGenerado = data.candidates[0].content.parts[0].text.trim();
                } catch (e) {
                    let safetyReason = "Motivo desconocido (la respuesta JSON estaba vacía o mal formada).";
                    if (data.candidates && data.candidates[0].finishReason === 'SAFETY') {
                        safetyReason = "Bloqueado por política de seguridad (SAFETY BLOCK). Revisa el contenido de tu Prompt.";
                    } else if (data.promptFeedback) {
                           safetyReason = JSON.stringify(data.promptFeedback, null, 2);
                    } else {
                        safetyReason = JSON.stringify(data, null, 2);
                    }

                    resultadoDiv.innerHTML = `
                        <strong style="color: #c53929;">Error: No se pudo generar el contenido útil.</strong><br>
                        El modelo no devolvió texto o el contenido fue bloqueado.<br>
                        <strong style="color: #5f6368;">Diagnóstico detallado:</strong>
                        <div class="error-detalle">
                            <pre>${safetyReason}</pre>
                        </div>
                    `;
                    boton.disabled = false;
                    return;
                }

                resultadoDiv.innerHTML = `<pre>${formatearResultado(textoGenerado)}</pre>`;
                boton.disabled = false;

            } catch (error) {
                let posibleCausa = "Clave API incorrecta, expirada o problema de CORS.";
                if (error.message.includes('Failed to fetch') || error.message.includes('Error HTTP')) {
                     posibleCausa = '⚠️ El problema es casi seguro de **CORS** (si estás en file:///) o la clave API está restringida.';
                }

                resultadoDiv.innerHTML = `
                    <strong style="color: #c53929;">Error crítico de Conexión:</strong> ${error.message}.<br><br>
                    <strong>POSIBLES CAUSAS:</strong><br>
                    - ${posibleCausa}<br>
                    - El modelo no está disponible o el nombre es incorrecto.
                `;
                boton.disabled = false;
            }
        }
    </script>

<hr style="margin-top: 40px; border-color: #ccc;">
    <div style="text-align: center; margin-top: 20px; padding-bottom: 20px;">
        <a href="index.html" style="
            text-decoration: none;
            color: #5f6368;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: background-color 0.3s;
        ">
            ← Volver al Menú Principal
        </a>
    </div>
</body>
</html>
