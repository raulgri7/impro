<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Impro Worker - Objeto Maldito 🔮</title>
    <style>
        body { 
            background: #12002f; color: #b9ffff; font-family: 'Courier New', Courier, monospace; 
            display: flex; flex-direction: column; height: 100vh; margin: 0; text-align: center;
        }
        #display { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .pantalla {
            border: 4px double #00d4ff; background: rgba(0, 212, 255, 0.1);
            padding: 40px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            max-width: 80%;
        }
        h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; color: #00d4ff; }
        #objeto { font-size: 3rem; margin: 20px 0; color: #fff; text-shadow: 0 0 10px #fff; }
        #maldicion { font-size: 1.5rem; color: #ff00ff; min-height: 60px; font-style: italic; }
        
        #controles { background: #000; padding: 30px; border-top: 2px solid #00d4ff; }
        button {
            background: #00d4ff; color: #000; border: none; padding: 20px 40px;
            font-size: 1.5rem; font-weight: bold; cursor: pointer; border-radius: 10px;
            transition: 0.3s;
        }
        button:hover { background: #fff; transform: scale(1.05); }
        button:disabled { background: #444; cursor: not-allowed; }
        .error { color: #ff4444; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="display">
        <div class="pantalla">
            <h1>Objeto Detectado:</h1>
            <div id="objeto">...</div>
            <div id="maldicion">Pulsa el botón para iniciar la escena</div>
        </div>
        <div id="log-error" class="error"></div>
    </div>

    <div id="controles">
        <button id="btn-fetch" onclick="invocarIA()">¡PASAR OBJETO / CAMBIAR!</button>
    </div>

    <script>
        // TU URL DEL WORKER
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';

        async function invocarIA() {
            const btn = document.getElementById('btn-fetch');
            const txtObjeto = document.getElementById('objeto');
            const txtMal = document.getElementById('maldicion');
            const log = document.getElementById('log-error');

            // Reset
            btn.disabled = true;
            log.innerText = "";
            txtObjeto.innerText = "SINTONIZANDO...";
            txtMal.innerText = "Cargando efecto desde el Worker...";

            // PROMPT OPTIMIZADO PARA EVITAR ERRORES DE PARSEO
            const miPrompt = "Dame un objeto cotidiano y una maldicion absurda que afecte a quien lo toca. Formato: OBJETO: [nombre] | EFECTO: [descripcion corta]. Ejemplo: OBJETO: Un paraguas | EFECTO: Crees que eres un presentador del tiempo en medio de un huracan.";

            try {
                const response = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: miPrompt }] }]
                    })
                });

                if (!response.ok) throw new Error(`Error en Worker: ${response.status}`);

                const data = await response.json();
                
                // Extraemos el texto de la respuesta de Gemini
                const respuestaIA = data.candidates[0].content.parts[0].text;
                
                // Dividimos el texto por el separador "|"
                const partes = respuestaIA.split('|');
                
                if (partes.length >= 2) {
                    txtObjeto.innerText = partes[0].replace('OBJETO:', '').trim().toUpperCase();
                    txtMal.innerText = partes[1].replace('EFECTO:', '').trim();
                } else {
                    // Si la IA no sigue el formato, mostramos el texto tal cual
                    txtObjeto.innerText = "OBJETO EXTRAÑO";
                    txtMal.innerText = respuestaIA;
                }

            } catch (err) {
                log.innerText = "ERROR: " + err.message + ". Revisa si el Worker está encendido y tiene CORS habilitado.";
                txtObjeto.innerText = "FALLO DE CONEXIÓN";
                txtMal.innerText = "No se pudo contactar con la IA.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
