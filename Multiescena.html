<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impro IA - Generador de Escenarios 🎭</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #2c3e50; --acc: #e67e22; --hi: #2980b9; --bg: #fdfdfd; }
        * { box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg); padding: 20px; color: var(--main); }
        .no-print { text-align: center; margin-bottom: 20px; }
        h1 { font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .subtitulo { font-size: 0.9em; color: #444; margin-bottom: 20px; }
        
        .header-ejercicio { 
            grid-column: 1 / -1; background: #eee; padding: 20px; 
            border-radius: 8px; margin-bottom: 20px; border-left: 5px solid var(--acc);
            text-align: left;
        }
        .header-ejercicio h2 { margin: 0 0 5px 0; text-transform: uppercase; color: var(--main); }
        .header-ejercicio p { margin: 0; font-style: italic; color: #555; }

        .botones-wrap { display: flex; justify-content: center; gap: 10px; }
        button { padding: 15px 25px; font-weight: bold; cursor: pointer; color: white; border: none; border-radius: 8px; text-transform: uppercase; transition: all 0.1s; }
        #btn-abrir-config { background: var(--acc); box-shadow: 0 4px 0 #d35400; }
        #btn-imprimir { background: #e74c3c; box-shadow: 0 4px 0 #c0392b; }
        
        #modal-genero {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; text-align: center; border: 2px solid var(--main);
            width: 400px; max-height: 90vh; overflow-y: auto;
        }
        .overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 90; }
        select { padding: 10px; font-size: 1em; border-radius: 5px; margin: 5px 0 15px; width: 100%; border: 1px solid #ccc; }
        .opcion-modal { text-align: left; margin-bottom: 10px; }
        .opcion-modal label { font-weight: bold; font-size: 0.85em; display: block; }

        #resultado { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); background: white; border: 1px solid #ccc; max-width: 1200px; margin: 0 auto; }
        .tarjeta { padding: 20px; border-right: 1px dashed #ccc; border-bottom: 1px dashed #ccc; min-height: 380px; background: #fff; display: flex; flex-direction: column; }
        .orden-dia { background-color: #f0f4f8 !important; border: 2px solid var(--hi) !important; }
        .t-num { color: var(--hi); font-weight: 900; font-size: 1.1em; border-bottom: 2px solid var(--acc); display: inline-block; margin-bottom: 12px; }
        .item { margin-bottom: 10px; }
        .item b { display: block; font-size: 0.7em; color: #7f8c8d; text-transform: uppercase; margin-bottom: 1px; }
        .item span { font-size: 1em; font-weight: 500; color: #2c3e50; display: block; line-height: 1.2; }
        .aviso { background: #fff4e5; border: 1px solid var(--acc); padding: 10px; margin-top: auto; border-radius: 5px; }
        .aviso b { color: #d35400; font-size: 0.75em; }

        @media print { 
            @page { size: A4 portrait; margin: 0.4cm; }
            .no-print, #modal-genero, .overlay { display: none !important; } 
            #resultado { display: grid !important; grid-template-columns: 1fr 1fr !important; width: 100% !important; border: none !important; } 
            .tarjeta { border: 1px dashed black !important; break-inside: avoid; min-height: 14cm !important; }
            .header-ejercicio { border: 1px solid #000; background: white; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Impro IA Multi-Tool 🎭</h1>
        <div class="subtitulo">Generador de personajes y contextos para ejercicios específicos.</div>
        <div class="botones-wrap">
            <button id="btn-abrir-config" onclick="toggleModal(true)">Elegir Ejercicio</button>
            <button id="btn-imprimir" onclick="window.print()" style="display: none;">Imprimir Set</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleModal(false)"></div>
    <div id="modal-genero">
        <h3>Configurar Escena</h3>
        
        <div class="opcion-modal">
            <label>Ejercicio de Impro:</label>
            <select id="select-ejercicio"></select>
        </div>

        <div class="opcion-modal">
            <label>Nº de Personajes:</label>
            <select id="select-total"></select>
        </div>

        <div class="opcion-modal">
            <label>Nº de Mujeres:</label>
            <select id="select-mujeres"></select>
        </div>

        <button id="btn-generar" onclick="confirmarGeneracion()" style="background: var(--hi); width: 100%; margin-top: 10px;">¡Generar Todo!</button>
    </div>

    <div id="resultado">
        <p style="padding: 60px; text-align: center; grid-column: 1/-1; color: #7f8c8d;">Selecciona un ejercicio para generar las fichas de los actores.</p>
    </div>

    <script>
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';

        const infoEjercicios = {
            medium: { titulo: "Sala de Espera del Médium", desc: "Los personajes han muerto de formas absurdas y esperan su turno para contactar con los vivos.", prompt: "Contexto: Sala de espera de un médium. Los personajes están MUERTOS. El vínculo es su causa de muerte y el aviso es el mensaje que quieren enviar a un vivo." },
            arca: { titulo: "El Arca de Noé Moderna", desc: "El mundo se acaba y solo hay sitio para unos pocos. Cada personaje debe defender su utilidad.", prompt: "Contexto: Nave espacial final. Solo hay sitio para la mitad. El vínculo es su profesión útil para el nuevo mundo y el aviso es su mayor defecto moral." },
            testamento: { titulo: "Lectura de Testamento", desc: "Un millonario excéntrico ha muerto. Para heredar, hay que cumplir condiciones raras.", prompt: "Contexto: Mansión de un rico fallecido. El vínculo es su relación con el muerto. El aviso es la condición absurda que deben cumplir para heredar." },
            reality: { titulo: "Casting Reality Show", desc: "Competición por entrar en 'Gran Vecino'. Perfiles extremos buscando fama.", prompt: "Contexto: Casting final para un programa de TV polémico. El vínculo es su arquetipo (rebelde, diva, etc). El aviso es qué están dispuestos a hacer por fama." },
            superheroe: { titulo: "Terapia para Superhéroes", desc: "Héroes con poderes inútiles o ridículos que intentan superar sus traumas.", prompt: "Contexto: Terapia de grupo de héroes con poderes ridículos. El aviso es por qué su poder les arruinó la vida." },
            cena_empresa: { titulo: "Cena de Empresa (Mesa de Olvidados)", desc: "Gente de distintos departamentos que no se conoce. Chismes y precariedad.", prompt: "Contexto: Cena de Navidad. Mesa de empleados que nadie conoce. El vínculo es su puesto precario. El aviso es el cotilleo que saben del jefe." },
            fans: { titulo: "Fila de Estreno", desc: "Fans extremos acampando por su saga favorita. Tensión y frikismo.", prompt: "Contexto: Fila de 3 días para un estreno. El vínculo es qué parte de la saga aman. El aviso es el objeto sagrado de coleccionista que llevan encima." },
            tiempo: { titulo: "Convención de Viajeros en el Tiempo", desc: "Encuentro en un punto neutro de la historia. Choque cultural.", prompt: "Contexto: Bar en el fin del tiempo. Personajes de distintas épocas. El vínculo es su siglo de origen. El aviso es el anacronismo que no entienden del presente." },
            corazones: { titulo: "Club de Corazones Rotos", desc: "Reunión de apoyo para gente recién dejada. Despecho y tristeza.", prompt: "Contexto: Grupo de apoyo para abandonados. El vínculo es cuánto tiempo duró su relación. El aviso es la mentira que les dijo su ex al romper." },
            bunker: { titulo: "Búnker Post-Apocalíptico", desc: "Supervivencia al límite. Recursos que desaparecen.", prompt: "Contexto: Búnker tras el apocalipsis. El vínculo es su tarea asignada (comida, defensa). El aviso es qué recurso vital están escondiendo para sí mismos." },
            magia: { titulo: "Tribunal de Examen de Magia", desc: "Aprendices ante jueces severos. Hechizos que fallan.", prompt: "Contexto: Examen final en la academia de magia. El vínculo es su especialidad mágica. El aviso es el hechizo que siempre les sale mal." },
            aduana: { titulo: "Aduana Intergaláctica", desc: "Turistas alienígenas pasando el control terrestre. Mercancía extraña.", prompt: "Contexto: Control fronterizo espacial. El vínculo es su planeta de origen. El aviso es qué parte de su cuerpo es considerada un arma ilegal." },
            teletienda: { titulo: "Vendedores de Teletienda", desc: "En el backstage antes de salir al aire. Competitividad extrema.", prompt: "Contexto: Camerinos de un canal de ventas 24h. El vínculo es el producto absurdo que venden. El aviso es su adicción a comprar sus propios productos." },
            boda: { titulo: "Mesa de los EX en la Boda", desc: "Situación incómoda por excelencia. Secretos del pasado.", prompt: "Contexto: La mesa de los EX de la novia. El vínculo es en qué año salieron con ella. El aviso es el secreto de la novia que podría arruinar la boda hoy." },
            cluedo: { titulo: "Sospechosos de Crimen (Cluedo)", desc: "Un asesinato en una cena elegante. Todos tienen motivos.", prompt: "Contexto: Cena donde ALGUIEN ha muerto. El vínculo es su relación con la víctima. El aviso es el arma que esconden y su coartada falsa." },
            villanos: { titulo: "Asamblea de Villanos Serie B", desc: "Malvados con planes mediocres y debilidades tontas.", prompt: "Contexto: Congreso anual de villanos mediocres. El vínculo es su nombre de archivillano. El aviso es su debilidad ridícula." },
            cocina: { titulo: "Reality de Cocina al Límite", desc: "Chefs bajo presión gritando y cocinando cosas raras.", prompt: "Contexto: Gran Final de concurso de cocina. El vínculo es su especialidad culinaria. El aviso es el ingrediente asqueroso que usan." },
            peluqueria: { titulo: "Peluquería de Barrio", desc: "El centro neurálgico del chisme. Rulos y secretos.", prompt: "Contexto: Peluquería un sábado mañana. El vínculo es cuánto tiempo llevan viniendo aquí. El aviso es el secreto de otra persona presente que acaban de oír." },
            crisis: { titulo: "Gabinete de Crisis Meteorito", desc: "Líderes mundiales ante el fin del mundo. Decisiones desesperadas.", prompt: "Contexto: Sala de guerra ante impacto inminente. El vínculo es su cargo (militar, místico). El aviso es su plan secreto para escapar solos." }
        };

        const selectEj = document.getElementById('select-ejercicio');
        const optLucky = document.createElement('option');
        optLucky.value = 'lucky';
        optLucky.innerHTML = '✨ ¡Voy a tener suerte! (Escenario IA)';
        selectEj.appendChild(optLucky);

        const keysOrdenadas = Object.keys(infoEjercicios).sort((a, b) => infoEjercicios[a].titulo.localeCompare(infoEjercicios[b].titulo));
        keysOrdenadas.forEach(key => {
            let opt = document.createElement('option');
            opt.value = key;
            opt.innerHTML = infoEjercicios[key].titulo;
            selectEj.appendChild(opt);
        });

        const selectTotal = document.getElementById('select-total');
        const selectMujeres = document.getElementById('select-mujeres');

        for (let i = 2; i <= 15; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.innerHTML = i + " Personajes";
            if (i === 6) opt.selected = true;
            selectTotal.appendChild(opt);
        }

        function actualizarMujeres() {
            const total = parseInt(selectTotal.value);
            const actualSeleccionada = Math.floor(total/2);
            selectMujeres.innerHTML = '';
            for (let i = 0; i <= total; i++) {
                let opt = document.createElement('option');
                opt.value = i; opt.innerHTML = i + " Mujeres";
                if (i === actualSeleccionada) opt.selected = true;
                selectMujeres.appendChild(opt);
            }
        }
        selectTotal.onchange = actualizarMujeres;
        actualizarMujeres();

        function toggleModal(show) {
            document.getElementById('modal-genero').style.display = show ? 'block' : 'none';
            document.getElementById('overlay').style.display = show ? 'block' : 'none';
        }

        function confirmarGeneracion() {
            const key = selectEj.value;
            const total = parseInt(selectTotal.value);
            const f = parseInt(selectMujeres.value);
            const m = total - f;
            toggleModal(false);
            generar(m, f, total, key);
        }

        async function generar(masculinos, femeninos, total, key) {
            const btnGen = document.getElementById('btn-abrir-config');
            const btnImp = document.getElementById('btn-imprimir');
            const resDiv = document.getElementById('resultado');
            const isLucky = (key === 'lucky');
            
            let info, promptBase;

            if (isLucky) {
                info = { titulo: "Escenario Generado por IA", desc: "Cargando contexto..." };
                promptBase = "Invéntate un escenario de improvisación teatral totalmente original y creativo. Al principio de tu respuesta, escribe 'CONTEXTO: ' seguido de una descripción de 2 frases del escenario y los personajes.";
            } else {
                info = infoEjercicios[key];
                promptBase = info.prompt;
            }
            
            btnGen.disabled = true;
            btnImp.style.display = 'none';
            resDiv.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:60px;">Generando el escenario: ${info.titulo}...</p>`;

            const promptEspecífico = `${promptBase}
            Crea ${total} personajes. ${masculinos} hombres y ${femeninos} mujeres.
            ${isLucky ? 'NO generes tarjetas de Objetivo o Conflicto al final.' : 'Al final genera 3 variantes de OBJETIVO O CONFLICTO (Formato TÍTULO: Contexto, Puntos: temas).'}
            
            ESTRUCTURA POR PERSONAJE:
            Nombre y mote:
            Vínculo o Posición:
            Rasgo:
            Historia:
            Actitud:
            Aviso a Navegantes: (Info contextual clave para los demás).
            No uses negritas ni asteriscos.`;

            try {
                const response = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptEspecífico }] }] })
                });

                const data = await response.json();
                let texto = data.candidates[0].content.parts[0].text.replace(/\*/g, '');
                
                // Extraer contexto dinámico si es modo Lucky
                if (isLucky) {
                    const matchCtx = texto.match(/CONTEXTO:\s*([^\n]+)/i);
                    if (matchCtx) {
                        info.desc = matchCtx[1].trim();
                        texto = texto.replace(matchCtx[0], '');
                    }
                }

                const secciones = texto.split(/TÍTULO:/i);
                const personajesTexto = secciones[0];
                const contextosTexto = secciones.slice(1);

                const etiquetasP = ["Nombre y mote", "Vínculo o Posición", "Rasgo", "Historia", "Actitud", "Aviso a Navegantes"];
                const regexP = new RegExp(`(${etiquetasP.join('|')}):?\\s*([^\\n]+)`, 'gi');
                let hallazgosP = [];
                let match;
                while ((match = regexP.exec(personajesTexto)) !== null) {
                    hallazgosP.push({ etiqueta: match[1].toUpperCase(), valor: match[2].trim() });
                }

                let htmlHeader = `<div class="header-ejercicio"><h2>${info.titulo}</h2><p>${info.desc}</p></div>`;

                let htmlPersonajes = '';
                const camposPorTarjeta = 6;
                for (let i = 0; i < hallazgosP.length; i += camposPorTarjeta) {
                    htmlPersonajes += `<div class="tarjeta"><span class="t-num">PERSONAJE ${(i/camposPorTarjeta)+1}</span>`;
                    for (let j = 0; j < camposPorTarjeta; j++) {
                        if (hallazgosP[i+j]) {
                            const label = hallazgosP[i+j].etiqueta;
                            htmlPersonajes += `<div class="item ${label === "AVISO A NAVEGANTES" ? 'aviso' : ''}"><b>${label}</b><span>${hallazgosP[i+j].valor}</span></div>`;
                        }
                    }
                    htmlPersonajes += `</div>`;
                }

                let htmlContextos = '';
                if (!isLucky) {
                    contextosTexto.forEach((txt, index) => {
                        const puntosMatch = txt.match(/Puntos:?\s*([\s\S]+)/i);
                        const contenido = puntosMatch ? puntosMatch[1].trim().replace(/\n/g, '<br>• ') : txt;
                        htmlContextos += `<div class="tarjeta orden-dia"><span class="t-num">OPCIÓN DE JUEGO ${index+1}</span><div class="item"><b>Situación:</b><span>• ${contenido}</span></div></div>`;
                    });
                }

                resDiv.innerHTML = htmlHeader + htmlContextos + htmlPersonajes;
                btnImp.style.display = 'inline-block';
            } catch (e) {
                resDiv.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:60px; color:red;">Error de conexión. Reintenta.</p>`;
            } finally {
                btnGen.disabled = false;
            }
        }
    </script>
</body>
</html>
