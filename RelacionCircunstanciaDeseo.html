<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImproLAB 60 - Relación + Circunstancia + Deseo</title>
    <style>
        :root {
            --color-lila-principal: #6c5ce7;
            --color-lila-oscuro: #483d8b;
            --color-fondo-claro: #f5f5f5;
            --color-texto-claro: #ffffff;
            --color-texto-oscuro: #333333;
            --color-comun: #f3f0ff;
            --color-rol-a: #e3f2fd;
            --color-rol-b: #e8f5e9;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            max-width: 750px; 
            margin: 0 auto; 
            background-color: var(--color-fondo-claro); 
            color: var(--color-texto-oscuro);
        }

        h1 { 
            color: var(--color-lila-oscuro); 
            text-align: center; 
            border-bottom: 3px double var(--color-lila-principal); 
            padding-bottom: 10px; 
            font-size: 1.8em;
        }

        #temperature-control {
            margin-bottom: 20px; 
            padding: 15px; 
            border: 1px solid #ddd;
            border-radius: 12px; 
            background-color: #fff;
        }

        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
            accent-color: var(--color-lila-principal); 
        }

        .acciones-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-principal { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            background-color: var(--color-lila-principal); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1em; 
            font-weight: bold; 
            text-transform: uppercase;
            box-shadow: 0 4px 0 var(--color-lila-oscuro); 
            transition: all 0.2s; 
        }

        .btn-principal:hover:not(:disabled) { 
            background-color: var(--color-lila-oscuro); 
            transform: translateY(-2px); 
        }
        
        .btn-principal:disabled { 
            background-color: #ccc; 
            box-shadow: none; 
            cursor: not-allowed; 
        }

        .btn-paso-siguiente {
            background-color: #00897b;
            box-shadow: 0 4px 0 #004d40;
            display: none; /* Se activa progresivamente */
        }
        .btn-paso-siguiente:hover:not(:disabled) {
            background-color: #004d40;
        }

        #resultado { 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            border-radius: 15px; 
            padding: 22px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: none; /* Se ocultan hasta que toque revelarlos */
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-comun {
            background-color: var(--color-comun);
            border: 2px solid var(--color-lila-principal);
        }

        .card-a {
            background-color: var(--color-rol-a);
            border: 2px solid #1976d2;
        }

        .card-b {
            background-color: var(--color-rol-b);
            border: 2px solid #388e3c;
        }

        .label-top { 
            display: inline-block; 
            color: white;
            padding: 4px 12px; 
            border-radius: 6px; 
            font-size: 0.8em; 
            font-weight: bold; 
            margin-bottom: 12px; 
            text-transform: uppercase; 
        }

        .bg-lila { background-color: var(--color-lila-principal); }
        .bg-azul { background-color: #1976d2; }
        .bg-verde { background-color: #388e3c; }

        .item-info {
            margin-bottom: 12px;
            font-size: 1.1em;
            line-height: 1.4;
        }
        
        .item-info strong {
            color: #222;
        }

        .cargando { 
            display: block; 
            text-align: center; 
            color: var(--color-lila-oscuro); 
            font-weight: bold; 
            padding: 20px; 
            font-style: italic;
        }

        .footer-menu {
            text-align: center; 
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <h1>Relación + Circunstancia + Deseo 🎭</h1>

    <div id="temperature-control">
        <label style="font-weight: bold; display: block; margin-bottom: 10px;">Creatividad de la IA:</label>
        <input type="range" id="temp-slider" min="0.3" max="1.0" step="0.1" value="0.7">
        <div style="display: flex; justify-content: space-between; font-size: 0.8em; margin-top: 8px; color: #666;">
            <span>Estandar</span>
            <span>Equilibrado</span>
            <span>Creativo</span>
        </div>
    </div>

    <div class="acciones-container">
        <button id="btn-comun" class="btn-principal" onclick="generarInformacionComun()">1. Revelar Información Común</button>
        <button id="btn-a" class="btn-principal btn-paso-siguiente" onclick="revelarObjetivoA()">2. Revelar Objetivo de A</button>
        <button id="btn-b" class="btn-principal btn-paso-siguiente" onclick="revelarObjetivoB()">3. Revelar Objetivo de B</button>
    </div>

    <div id="resultado">
        <!-- TARJETA 1: COMÚN -->
        <div id="card-comun" class="card card-comun">
            <div class="label-top bg-lila">Información Común (Ambas)</div>
            <div class="item-info"><strong>Relación:</strong> <span id="txt-relacion">--</span></div>
            <div class="item-info"><strong>Circunstancia:</strong> <span id="txt-circunstancia">--</span></div>
        </div>

        <!-- TARJETA 2: OBJETIVO A -->
        <div id="card-a" class="card card-a">
            <div class="label-top bg-azul">Solo para A</div>
            <div class="item-info" style="font-size: 1.2em; font-weight: 500;" id="txt-obj-a">--</div>
        </div>

        <!-- TARJETA 3: OBJETIVO B -->
        <div id="card-b" class="card card-b">
            <div class="label-top bg-verde">Solo para B</div>
            <div class="item-info" style="font-size: 1.2em; font-weight: 500;" id="txt-obj-b">--</div>
        </div>
    </div>

    <script>
        // Almacén temporal de la escena generada en memoria de la sesión
        let escenaActual = {
            relacion: "",
            circunstancia: "",
            objetivoA: "",
            objetivoB: ""
        };

        async function llamarIA(promptInstruccion, temp) {
            const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: promptInstruccion,
                    temp: temp
                })
            });
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        }

        async function generarInformacionComun() {
            const cardComun = document.getElementById('card-comun');
            const btnComun = document.getElementById('btn-comun');
            const btnA = document.getElementById('btn-a');
            const btnB = document.getElementById('btn-b');
            const temp = parseFloat(document.getElementById('temp-slider').value);

            // Ocultar tarjetas posteriores si ya se había generado otra ronda
            document.getElementById('card-a').style.display = 'none';
            document.getElementById('card-b').style.display = 'none';
            btnA.style.display = 'none';
            btnB.style.display = 'none';

            btnComun.disabled = true;
            cardComun.style.display = 'block';
            cardComun.innerHTML = '<div class="label-top bg-lila">Información Común (Ambas)</div><span class="cargando">Generando relación y circunstancia...</span>';

            const promptStr = `Eres un experto pedagogo de teatro de improvisación. Genera estrictamente dos líneas separadas por un salto de línea sin introducciones, saludos ni explicaciones.
Línea 1: Relación: [Relación breve entre dos personas, ej: Hermanas, Mejores amigas, Vecinas, etc. Evita repetir siempre las mismas].
Línea 2: Circunstancia: [Circunstancia sencilla y directa, ej: Una de vosotras está a punto de irse, Han perdido algo importante, etc.].
Mantén la máxima sencillez sin inventar biografías ni historias complejas.`;

            try {
                const texto = await llamarIA(promptStr, temp);
                
                // Procesar respuesta limpia
                const lineas = texto.replace(/\*\*/g, '').split('\n').map(l => l.trim()).filter(Boolean);
                escenaActual.relacion = lineas.find(l => l.toLowerCase().includes('relación'))?.replace(/^.*?:\s*/, '') || "Hermanas";
                escenaActual.circunstancia = lineas.find(l => l.toLowerCase().includes('circunstancia'))?.replace(/^.*?:\s*/, '') || "Una está a punto de irse.";

                cardComun.innerHTML = `
                    <div class="label-top bg-lila">Información Común (Ambas)</div>
                    <div class="item-info"><strong>Relación:</strong> ${escenaActual.relacion}</div>
                    <div class="item-info"><strong>Circunstancia:</strong> ${escenaActual.circunstancia}</div>
                `;

                // Activamos el siguiente botón de la progresión
                btnA.style.display = 'block';
            } catch (error) {
                cardComun.innerHTML = `<div style="color:red; text-align:center;">Error de conexión con el generador.</div>`;
            } finally {
                btnComun.disabled = false;
                btnComun.textContent = "1. Generar Nueva Situación Común";
            }
        }

        async function revelarObjetivoA() {
            const cardA = document.getElementById('card-a');
            const btnA = document.getElementById('btn-a');
            const btnB = document.getElementById('btn-b');
            const temp = parseFloat(document.getElementById('temp-slider').value);

            btnA.disabled = true;
            cardA.style.display = 'block';
            cardA.innerHTML = '<div class="label-top bg-azul">Solo para A</div><span class="cargando">Generando objetivo secreto para A...</span>';

            const promptStr = `Dada la siguiente relación: "${escenaActual.relacion}" y circunstancia: "${escenaActual.circunstancia}", genera un objetivo secreto y concreto que el personaje A quiera conseguir de B. 
Debe ser una acción directa (ej: "Quieres conseguir que B se quede", "Necesitas que B te perdone", "Quieres convencer a B de que cambie de opinión").
Responde ÚNICAMENTE con la frase del objetivo, sin saludos ni explicaciones.`;

            try {
                const texto = await llamarIA(promptStr, temp);
                escenaActual.objetivoA = texto.replace(/\*\*/g, '').replace(/^(tu objetivo es:|objetivo:)\s*/i, '').trim();

                cardA.innerHTML = `
                    <div class="label-top bg-azul">Solo para A</div>
                    <div class="item-info"><strong>Tu objetivo:</strong> ${escenaActual.objetivoA}</div>
                `;

                // Activamos el botón para el jugador B
                btnB.style.display = 'block';
            } catch (error) {
                cardA.innerHTML = `<div style="color:red; text-align:center;">Error al generar objetivo de A.</div>`;
            } finally {
                btnA.disabled = false;
            }
        }

        async function revelarObjetivoB() {
            const cardB = document.getElementById('card-b');
            const btnB = document.getElementById('btn-b');
            const temp = parseFloat(document.getElementById('temp-slider').value);

            btnB.disabled = true;
            cardB.style.display = 'block';
            cardB.innerHTML = '<div class="label-top bg-verde">Solo para B</div><span class="cargando">Generando objetivo secreto para B...</span>';

            const promptStr = `Dada la relación: "${escenaActual.relacion}", la circunstancia: "${escenaActual.circunstancia}" y sabiendo que el objetivo de la otra persona (A) es "${escenaActual.objetivoA}", genera un objetivo secreto para el personaje B que genere una dinámica de juego interesante y jugable con A (pueden oponerse, complementarse, o generar sutil tensión).
Responde ÚNICAMENTE con la frase del objetivo de B, sin saludos ni explicaciones.`;

            try {
                const texto = await llamarIA(promptStr, temp);
                escenaActual.objetivoB = texto.replace(/\*\*/g, '').replace(/^(tu objetivo es:|objetivo:)\s*/i, '').trim();

                cardB.innerHTML = `
                    <div class="label-top bg-verde">Solo para B</div>
                    <div class="item-info"><strong>Tu objetivo:</strong> ${escenaActual.objetivoB}</div>
                `;
            } catch (error) {
                cardB.innerHTML = `<div style="color:red; text-align:center;">Error al generar objetivo de B.</div>`;
            } finally {
                btnB.disabled = false;
            }
        }
    </script>

    <div class="footer-menu">
        <a href="index.html" style="text-decoration: none; color: var(--color-lila-oscuro); border-bottom: 1px solid var(--color-lila-principal); font-weight: bold;">
            &larr; Volver al Menú Principal
        </a>
    </div>

</body>
</html>
