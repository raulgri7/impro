<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surrealismo para Dos</title>
    <style>
        :root {
            --azul: #4285f4;
            --azul-oscuro: #3367d6;
            --bg: #f8f9fa;
            --texto: #202124;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            max-width: 700px; 
            margin: 0 auto; 
            background-color: var(--bg); 
            color: var(--texto);
            line-height: 1.6;
        }

        h1 { 
            color: var(--azul); 
            text-align: center;
            border-bottom: 2px solid var(--azul); 
            padding-bottom: 15px; 
            margin-bottom: 40px;
            font-size: 2.2rem;
        }

        .container { text-align: center; }

        button { 
            padding: 16px 32px; 
            background-color: var(--azul); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3); 
        }

        button:hover { 
            background-color: var(--azul-oscuro); 
            box-shadow: 0 6px 16px rgba(66, 133, 244, 0.4);
            transform: translateY(-2px);
        }

        #resultado { 
            margin-top: 40px; 
            padding: 30px; 
            background-color: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            min-height: 120px;
            border-left: 8px solid var(--azul);
            text-align: left;
        }

        .idea-texto {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--texto);
            margin-bottom: 20px;
            display: block;
        }

        .emociones-texto {
            font-size: 1.1rem;
            color: #5f6368;
            font-style: italic;
            border-top: 1px solid #eee;
            padding-top: 15px;
            display: block;
        }

        .cargando { color: var(--azul); font-weight: bold; animation: pulse 1.5s infinite; display: block; text-align: center; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .error-card { color: #d93025; background-color: #fce8e6; padding: 15px; border-radius: 8px; }
        .footer { margin-top: 50px; text-align: center; border-top: 1px solid #ddd; padding-top: 20px; }
        .btn-volver { text-decoration: none; color: #5f6368; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>Surrealismo para dos &#127921;</h1>
    
    <div class="container">
        <button id="btn-main" onclick="generarImpro()">&#161; Dame una Idea !</button>
    </div>
    
    <div id="resultado">
        <p style="text-align: center; color: #999;">Pulsa el bot&oacute;n para empezar la escena...</p>
    </div>

    <script>
        function limpiarBasura(texto) {
            return texto
                .replace(/\*\*/g, '')
                .replace(/^L&iacute;nea\s\d+:?/gi, '')
                .replace(/^Situaci&oacute;n:?/gi, '')
                .replace(/^\d+[\.\s]*/, '')
                .trim();
        }

        async function generarImpro() {
            const resultadoDiv = document.getElementById('resultado');
            const btn = document.getElementById('btn-main');
            
            btn.disabled = true;
            resultadoDiv.innerHTML = '<span class="cargando">Invocando el surrealismo...</span>';
            
            const promptSurrealista = `Act迆a como un dramaturgo de vanguardia. Genera una propuesta de escena teatral corta.
            ESTRUCTURA:
            1. Una situaci車n cotidiana entre dos personajes que se enfrentan a un UN ELEMENTO ABSURDO o SURREALISTA como si fuera normal.
            2. Tres emociones espec赤ficas para los actores.

            EJEMPLO: 
            Escena: Una pareja discute en el sal車n porque el beb谷 drag車n que han adoptado ha quemado las cortinas otra vez.
            Emociones: Ternura, Agobio, Miedo.

            REGLAS:
            - No escribas introducciones.
            - S谷 breve (m芍ximo 25 palabras para la escena).
            - Formato exacto:
            Escena: [Descripci車n]
            Emociones: [E1, E2, E3]`;

            try {
                const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptSurrealista,
                        temp: 0.8 // Un poco de temperatura para que sea creativo con el surrealismo
                    })
                });

                const data = await response.json();
                let textoRaw = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                
                let situacion = "";
                let emociones = "";

                // Separaci車n inteligente
                const lineas = textoRaw.split('\n').filter(l => l.trim() !== "");
                
                // Buscar l赤nea de escena
                const lineaEscena = lineas.find(l => l.toLowerCase().includes('escena:')) || lineas[0];
                // Buscar l赤nea de emociones
                const lineaEmociones = lineas.find(l => l.toLowerCase().includes('emociones:')) || lineas[1];

                situacion = limpiarBasura(lineaEscena.replace(/Escena:/i, ''));
                emociones = lineaEmociones ? limpiarBasura(lineaEmociones) : "Emociones: Sorpresa, Calma, Tensi車n.";

                resultadoDiv.innerHTML = `
                    <span class="idea-texto">${situacion}</span>
                    <span class="emociones-texto">${emociones}</span>
                `;

            } catch (error) {
                resultadoDiv.innerHTML = `<div class="error-card">Error: No se pudo conectar con el inconsciente.</div>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>

    <div class="footer">
        <a href="index.html" class="btn-volver">
            &larr; Volver al Men&uacute; Principal
        </a>
    </div>

</body>
</html>
