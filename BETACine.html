<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Experto en Cine: Recomendador Avanzado</title>
    <style>
        /* ----------------------------------------------------------
           ESTILOS MEJORADOS - LOOK & FEEL CINEMATOGR&Aacute;FICO
           ---------------------------------------------------------- */
        :root {
            --color-primario: #d81b60;
            --color-primario-oscuro: #880e4f;
            --color-fondo: #1a1a1a;
            --color-tarjeta: #ffffff;
            --color-texto: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px;
            max-width: 1100px;
            margin: 0 auto;
            background-color: #fce4ec; 
            color: var(--color-texto);
            line-height: 1.6;
        }

        h1 {
            color: var(--color-primario); 
            border-bottom: 4px solid var(--color-primario);
            padding-bottom: 15px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 2.8em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.instruccion {
            color: #666;
            margin-bottom: 30px;
            text-align: center;
            font-size: 1.1em;
            font-style: italic;
        }

        .criterios-container {
            background-color: var(--color-tarjeta);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            border: 1px solid #f06292;
        }

        h2 {
            color: var(--color-primario-oscuro);
            margin-top: 0;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pregunta {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .pregunta:last-child { border-bottom: none; }

        .pregunta label {
            display: block;
            font-weight: bold;
            color: var(--color-primario);
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--color-primario);
            outline: none;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .input-group input[type="number"] { flex: 1; min-width: 150px; }

        .checkbox-label {
            font-weight: normal !important;
            color: #444 !important;
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        #plataformas-checkboxes {
            background: #fff5f8;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            border: 1px dashed var(--color-primario);
        }

        #plataformas-checkboxes label {
            font-size: 0.95em;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .boton-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 18px 40px;
            background-color: var(--color-primario); 
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.25em;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(216, 27, 96, 0.3);
            text-transform: uppercase;
        }

        button:hover:not(:disabled) {
            background-color: var(--color-primario-oscuro);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(216, 27, 96, 0.4);
        }

        button:active:not(:disabled) { transform: translateY(1px); }

        button:disabled {
            background-color: #f8bbd0;
            cursor: not-allowed;
            box-shadow: none;
        }

        #contenedor-resultados {
            margin-top: 40px;
        }

        .lista-peliculas {
            background: white;
            margin-bottom: 40px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .lista-peliculas h2 {
            background-color: var(--color-primario);
            color: white;
            padding: 20px;
            margin: 0;
            font-size: 1.4em;
        }

        .table-wrapper { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f8f9fa;
            color: var(--color-primario-oscuro);
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.85em;
        }

        tr:hover { background-color: #fff9fb; }

        .puntuacion {
            font-weight: bold;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .cargando {
            text-align: center;
            padding: 40px;
            color: var(--color-primario);
            font-size: 1.2em;
            font-weight: bold;
        }

        .error-detalle {
            background-color: #fff1f0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ffccc7;
            margin: 10px;
            font-family: monospace;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

    <h1>🎬 Experto en Cine</h1>
    <p class="instruccion">Configure sus preferencias para recibir una cartelera personalizada de 10 pel&iacute;culas.</p>

    <div class="criterios-container">
        <h2>🎥 Filtros de Selecci&oacute;n</h2>
        
        <div class="pregunta">
            <label for="ano-inicio">1. &Aacute;poca o a&ntilde;o de preferencia:</label>
            <div class="input-group">
                <input type="number" id="ano-inicio" value="2010" min="1900" max="2026">
                <label class="checkbox-label">
                    <input type="checkbox" id="solo-este-ano"> Buscar **solo** este a&ntilde;o
                </label>
            </div>
            <small style="color: #888;">* Si no marca el cuadro, buscaremos en la d&eacute;cada (Ej: 1990-1999).</small>
        </div>

        <div class="pregunta">
            <label for="genero">2. G&eacute;nero cinematogr&aacute;fico:</label>
            <input type="text" id="genero" value="Cualquiera" placeholder="Ej: Thriller coreano, Comedia rom&aacute;ntica, Terror 80s...">
        </div>

        <div class="pregunta">
            <label for="restriccion-edad">3. Clasificaci&oacute;n de edad:</label>
            <select id="restriccion-edad">
                <option value="cualquiera">Cualquiera (Sin filtros)</option>
                <option value="si">Solo para adultos (Mayores de 12/16/18)</option>
                <option value="no">Familiar / Todos los p&uacute;blicos</option>
            </select>
        </div>

        <div class="pregunta">
            <label for="streaming">4. &iquest;D&oacute;nde desea verlas?</label>
            <select id="streaming" onchange="togglePlataformas()">
                <option value="cualquiera">Cualquiera (No importa si es streaming o compra)</option>
                <option value="si">Solo en mis suscripciones (Seleccionar abajo)</option>
                <option value="no">Fuera de cat&aacute;logos (Solo cinefilia dif&iacute;cil de encontrar)</option>
            </select>
            
            <div id="plataformas-checkboxes" style="display: none;">
                </div>
        </div>

        <div class="boton-container">
            <button id="generar-btn" onclick="generarListaPeliculas()">🍿 Generar Recomendaciones</button>
        </div>
    </div>

    <div id="contenedor-resultados">
        <p id="mensaje-inicio" style="text-align: center; color: #888;">Sus listas de recomendaciones aparecer&aacute;n en esta secci&oacute;n.</p>
        <div id="listas-anteriores"></div>
    </div>

    <script>
        // --- CONFIGURACI&Oacute;N DEL WORKER ---
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev'; 
        
        const PLATAFORMAS_LIST = [
            "Netflix", "Amazon Prime Video", "Disney+", "HBO Max", "Apple TV+", 
            "Filmin", "SkyShowtime", "Movistar Plus+", "RTVE Play", "Rakuten TV"
        ];
        
        let titulosAnteriores = [];

        // Inicializar Checkboxes
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('plataformas-checkboxes');
            PLATAFORMAS_LIST.forEach(p => {
                const id = p.replace(/\s+/g, '');
                container.innerHTML += `
                    <label>
                        <input type="checkbox" id="${id}" name="plataforma" value="${p}" checked> ${p}
                    </label>`;
            });
        });

        function togglePlataformas() {
            const isVisible = document.getElementById('streaming').value === 'si';
            document.getElementById('plataformas-checkboxes').style.display = isVisible ? 'grid' : 'none';
        }

        function obtenerRangoTexto(ano, soloUno) {
            const a = parseInt(ano);
            return soloUno ? `espec&iacute;ficamente del a&ntilde;o ${a}` : `de la d&eacute;cada que comienza en ${a}`;
        }

        async function generarListaPeliculas() {
            const btn = document.getElementById('generar-btn');
            const listasDiv = document.getElementById('listas-anteriores');
            const msgInicio = document.getElementById('mensaje-inicio');
            
            const ano = document.getElementById('ano-inicio').value;
            const soloUno = document.getElementById('solo-este-ano').checked;
            const genero = document.getElementById('genero').value;
            const edad = document.getElementById('restriccion-edad').value;
            const stream = document.getElementById('streaming').value;

            let plataformas = [];
            if (stream === 'si') {
                plataformas = Array.from(document.querySelectorAll('input[name="plataforma"]:checked')).map(c => c.value);
            }

            // UI Feedback
            btn.disabled = true;
            if (msgInicio) msgInicio.style.display = 'none';

            const card = document.createElement('div');
            card.className = 'lista-peliculas';
            card.innerHTML = `<div class="cargando">🎬 Consultando al Experto... Buscando ${genero} (${ano})</div>`;
            listasDiv.prepend(card);

            const prompt = `Eres un cr&iacute;tico de cine experto. 
            Genera una lista de 10 pel&iacute;culas REALES recomendadas con estos filtros:
            - A&ntilde;o: ${obtenerRangoTexto(ano, soloUno)}
            - G&eacute;nero: ${genero}
            - Restricci&oacute;n Edad: ${edad === 'si' ? 'Para adultos' : edad === 'no' ? 'Para todos los p&uacute;blicos' : 'Cualquiera'}
            - Streaming: ${stream === 'si' ? 'Disponibles en: ' + plataformas.join(', ') : stream === 'no' ? 'Que NO est&eacute;n en plataformas comunes' : 'Cualquier medio'}
            
            EXCLUSIONES: No repitas estas: ${titulosAnteriores.join(', ')}

            FORMATO: Devuelve &Uacute;NICAMENTE una tabla Markdown con:
            | T&iacute;tulo | A&ntilde;o | G&eacute;nero | Sinopsis (1 frase) | Plataforma sugerida | IMDb |
            |-------|-----|--------|-------------------|---------------------|------|`;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) throw new Error('Error en el servidor Worker');

                const data = await response.json();
                const texto = data.candidates[0].content.parts[0].text;

                card.innerHTML = `
                    <h2>🍿 Recomendaciones: ${genero} (${ano})</h2>
                    <div class="table-wrapper">
                        ${convertirTabla(texto)}
                    </div>
                `;

            } catch (err) {
                card.innerHTML = `<h2>❌ Error</h2><div class="error-detalle">${err.message}</div>`;
            } finally {
                btn.disabled = false;
            }
        }

        function convertirTabla(md) {
            const filas = md.trim().split('\n').filter(f => f.includes('|'));
            if (filas.length < 2) return "<p>No se pudo generar el formato de tabla correctamente.</p>";

            let html = '<table><thead><tr>';
            const cabecera = filas[0].split('|').filter(c => c.trim() !== '');
            cabecera.forEach(c => html += `<th>${c.trim()}</th>`);
            html += '</tr></thead><tbody>';

            for (let i = 2; i < filas.length; i++) {
                const celdas = filas[i].split('|').filter(c => c.trim() !== '');
                if (celdas.length >= cabecera.length) {
                    html += '<tr>';
                    celdas.forEach((c, idx) => {
                        let valor = c.trim();
                        if (idx === 0) titulosAnteriores.push(valor); // Guardar para exclusi&oacute;n
                        if (idx === 5) valor = `<span class="puntuacion">${valor}</span>`;
                        html += `<td>${valor}</td>`;
                    });
                    html += '</tr>';
                }
            }
            html += '</tbody></table>';
            return html;
        }
    </script>
</body>
</html>
