<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teatro: Circunstancias Dadas</title>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background-color: #121212; color: #e0e0e0; }
        h1 { color: #e53935; border-bottom: 2px solid #e53935; padding-bottom: 10px; text-align: center; }
        .controls { text-align: center; margin: 20px 0; display: flex; justify-content: center; gap: 10px; }
        button { padding: 12px 24px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; transition: 0.3s; }
        .btn-gen { background-color: #e53935; color: white; }
        .btn-gen:hover { background-color: #b71c1c; }
        .btn-docx { background-color: #1976d2; color: white; display: none; }
        #resultado { background-color: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; min-height: 200px; line-height: 1.6; }
        .label { color: #e53935; font-weight: bold; text-transform: uppercase; font-size: 0.9em; margin-top: 20px; display: block; }
        .content-box { margin-bottom: 20px; white-space: pre-wrap; }
        .dialogue-style { font-family: 'Courier New', Courier, monospace; background: #000; padding: 15px; border-radius: 4px; color: #cfcfcf; }
        .loading { color: #e53935; font-style: italic; text-align: center; display: block; }
    </style>
</head>
<body>

    <h1>🎭 Ejercicio de Circunstancias Dadas</h1>
    
    <div class="controls">
        <button class="btn-gen" onclick="generarEscena()">Generar Escena</button>
        <button id="btnDocx" class="btn-docx" onclick="descargarDocx()">Descargar .DOCX</button>
    </div>

    <div id="resultado">
        <p style="text-align: center; color: #666;">Presiona el botón para crear un ejercicio teatral.</p>
    </div>

    <script>
        // --- CONFIGURACIÓN PROPORCIONADA ---
        const API_KEY = 'AIzaSyCsbHnWzkKzwqMYV5oRZSfZvO9SNvjPTAM'; 
        const MODEL_NAME = 'gemini-2.5-flash';
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;

        let datosEscena = { titulo: "", circunstancias: "", dialogo: "" };

        async function generarEscena() {
            const resDiv = document.getElementById('resultado');
            const btnD = document.getElementById('btnDocx');
            resDiv.innerHTML = '<span class="loading">Escribiendo la escena...</span>';
            btnD.style.display = 'none';

            const prompt = `Crea un ejercicio teatral de "circunstancias dadas".
            - Personajes: Dos mujeres.
            - Tono: Inquietante, misterioso, incómodo.
            - Requisito: Frases de diálogo no muy largas y fáciles de memorizar.
            
            FORMATO OBLIGATORIO:
            TITULO: [Escribe aquí]
            CIRCUNSTANCIAS: [Escribe aquí quiénes son, edad, relación, lugar y tensión oculta]
            DIALOGO: [Escribe el diálogo aquí]`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error.message);

                const textoCompleto = data.candidates[0].content.parts[0].text;

                // Sistema de extracción robusto para evitar errores de undefined/trim
                const extraer = (etiqueta, siguiente) => {
                    const regex = new RegExp(`${etiqueta}:(.*?)(?=${siguiente}:|$)`, 's');
                    const match = textoCompleto.match(regex);
                    return match ? match[1].trim() : "";
                };

                datosEscena.titulo = extraer("TITULO", "CIRCUNSTANCIAS") || "Escena sin título";
                datosEscena.circunstancias = extraer("CIRCUNSTANCIAS", "DIALOGO") || "No se generaron circunstancias.";
                datosEscena.dialogo = extraer("DIALOGO", "FIN") || "No se generó el diálogo.";

                resDiv.innerHTML = `
                    <h2 style="text-align:center; color:white;">${datosEscena.titulo}</h2>
                    <span class="label">Circunstancias dadas:</span>
                    <div class="content-box">${datosEscena.circunstancias}</div>
                    <span class="label">Diálogo:</span>
                    <div class="content-box dialogue-style">${datosEscena.dialogo}</div>
                `;
                btnD.style.display = 'block';

            } catch (e) {
                resDiv.innerHTML = `<b style="color:red;">Error de conexión:</b> ${e.message}<br><br>Verifica que el modelo "${MODEL_NAME}" sea el correcto para tu región.`;
            }
        }

        function descargarDocx() {
            const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx;

            const doc = new Document({
                sections: [{
                    children: [
                        new Paragraph({ text: datosEscena.titulo, heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER }),
                        new Paragraph({ text: "CIRCUNSTANCIAS DADAS", heading: HeadingLevel.HEADING_2, spacing: { before: 400 } }),
                        new Paragraph({ children: [new TextRun({ text: datosEscena.circunstancias, size: 24 })] }),
                        new Paragraph({ text: "DIÁLOGO", heading: HeadingLevel.HEADING_2, spacing: { before: 400 } }),
                        ...datosEscena.dialogo.split('\n').map(l => new Paragraph({ 
                            children: [new TextRun({ text: l, size: 24, font: "Courier New" })] 
                        }))
                    ]
                }]
            });

            Packer.toBlob(doc).then(blob => saveAs(blob, "Ejercicio_Teatro_Circunstancias.docx"));
        }
    </script>
<hr style="margin-top: 40px; border-color: #ccc;">

            transition: background-color 0.3s;
        ">

        </a>
    </div>

</body>
</html>
