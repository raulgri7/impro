<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Obras de Teatro Contempor&aacute;neas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f0f2f5; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; display: flex; gap: 20px; align-items: flex-end; }
        .input-group > div { flex-grow: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; margin-top: 10px; }
        .checkbox-group input[type="checkbox"] { width: auto; margin-right: 10px; transform: scale(1.2); }
        .checkbox-group label { margin-bottom: 0; font-weight: normal; }

        button { padding: 12px 25px; background-color: #34a853; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 17px; font-weight: bold; transition: background-color 0.3s, transform 0.1s; }
        button:hover { background-color: #1e8e3e; transform: translateY(-1px); }
        button:disabled { background-color: #a1c6a7; cursor: not-allowed; }
        #loading { text-align: center; color: #fbbc05; margin-top: 20px; font-weight: bold; display: none; }
        .results-section { margin-top: 30px; padding: 25px; border: 1px solid #ddd; border-radius: 10px; background-color: #f7f7f7; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
        .results-section h2 { color: #4285f4; border-bottom: 2px solid #4285f4; padding-bottom: 8px; margin-top: 0; }
        .work-item { border-left: 5px solid #ffbb00; padding-left: 15px; margin-bottom: 15px; }
        .work-item h3 { margin: 0 0 5px 0; color: #3c7f0d; }
        .work-item p { margin: 0; font-style: italic; }
        .error-message { color: white; background-color: #dc3545; padding: 15px; border-radius: 8px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Buscador de Obras de Teatro Contempor&aacute;neas</h1>

    <div class="input-group">
        <div>
            <label for="genre">G&eacute;nero de la Obra:</label>
            <select id="genre">
                <option value="Drama">Drama</option>
                <option value="Comedia">Comedia</option>
                <option value="Tragedia">Tragedia</option>
                <option value="Libre (cualquier g&eacute;nero)" selected>Libre</option>
            </select>
        </div>
        <div>
            <label for="characters">N&ordm; de Personajes (min):</label>
            <input type="number" id="characters" value="2" min="1" required>
        </div>
        <button id="searchButton" onclick="buscarObras()">Buscar Obras</button>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="extraLanguages">
        <label for="extraLanguages">Incluir obras en Ingl&eacute;s, Franc&eacute;s, Catal&aacute;n e Italiano</label>
    </div>

    <div id="loading">... Buscando obras contempor&aacute;neas. Un momento, por favor...</div>
    <div id="results"></div>
</div>

<script>
// URL de tu Worker en Cloudflare (Seguro)
const WORKER_URL = "https://generador-impro.raul-grigelmo3.workers.dev";

async function buscarObras() {
    const resultsDiv = document.getElementById('results');
    const loadingDiv = document.getElementById('loading');
    const button = document.getElementById('searchButton');

    const genre = document.getElementById('genre').value;
    const characters = document.getElementById('characters').value;
    const searchExtraLanguages = document.getElementById('extraLanguages').checked;

    if (!characters || parseInt(characters) < 1) {
        alert("Por favor, introduce un numero valido de personajes.");
        return;
    }

    resultsDiv.innerHTML = '';
    loadingDiv.style.display = 'block';
    button.disabled = true;

    let languageReq = 'en español';
    if (searchExtraLanguages) languageReq += ' o en ingles, frances, catalan o italiano';

    const PROMPT = `Busca 5 obras de teatro contemporaneas (ultimos 50 años) en prosa.
    Idioma: ${languageReq}. Genero: ${genre}. Personajes: ${characters} aprox.
    Devuelve SOLO un JSON (sin markdown) con esta estructura:
    {"obras": [{"titulo": "...", "autor": "...", "explicacion": "..."}]}`;

    try {
        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: PROMPT }] }],
                generationConfig: { temperature: 0.7 }
            })
        });

        if (!response.ok) throw new Error("Error en la comunicacion con el Worker");

        const data = await response.json();
        let rawContent = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        // Limpieza de posibles bloques de codigo markdown
        rawContent = rawContent.replace(/```json\s*|```/g, '').trim();
        const obrasData = JSON.parse(rawContent);

        displayResults(obrasData.obras);

    } catch (error) {
        resultsDiv.innerHTML = `<div class="error-message">
            <strong>Error:</strong> No se pudieron obtener las obras.<br>
            Detalle: ${error.message}
        </div>`;
    } finally {
        loadingDiv.style.display = 'none';
        button.disabled = false;
    }
}

function displayResults(obras) {
    const resultsDiv = document.getElementById('results');
    if (!obras || obras.length === 0) {
        resultsDiv.innerHTML = '<div class="results-section"><h2>No se encontraron obras.</h2></div>';
        return;
    }

    let html = '<div class="results-section"><h2>Obras Encontradas:</h2>';
    obras.forEach(obra => {
        html += `
            <div class="work-item">
                <h3>${obra.titulo} (${obra.autor})</h3>
                <p>${obra.explicacion}</p>
            </div>`;
    });
    html += '</div>';
    resultsDiv.innerHTML = html;
}
</script>

<div style="text-align: center; margin-top: 20px; padding-bottom: 20px;">
    <a href="index.html" style="text-decoration: none; color: #5f6368; font-weight: bold; padding: 10px 20px; border: 1px solid #ccc; border-radius: 5px;">
        &larr; Volver al Men&uacute; Principal
    </a>
</div>

</body>
</html>
