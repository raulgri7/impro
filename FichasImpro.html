<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✂️ Fichas Troqueladas de Improvisación (Para Imprimir)</title>
    <style>
        /* ----------------------------------------------------------
           ESTILOS GENERALES
           ---------------------------------------------------------- */
        body { 
            font-family: 'Georgia', serif; 
            padding: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            background-color: #f7f7f7; 
            color: #333;
        }
        h1 { 
            color: #d84315; 
            border-bottom: 3px solid #ff7043; 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 2.4em;
            font-family: 'BlinkMacSystemFont', 'Segoe UI', serif;
        }
        p.instruccion { 
            color: #555; 
            margin-bottom: 25px; 
            text-align: center;
            font-size: 1.1em;
            border: 1px dashed #ff7043;
            padding: 15px;
            background-color: #fff3e0; 
            border-radius: 5px;
        }
        
        /* Contenedor de Inputs y Botones */
        .control-container {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }

        button { 
            padding: 16px 30px; 
            background-color: #ff7043; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 1.2em; 
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); 
            text-transform: uppercase;
            margin: 0 10px;
        }
        button:hover:not(:disabled) { background-color: #e65100; }
        button:active:not(:disabled) { 
            transform: translateY(2px); 
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); 
        }
        button:disabled {
            background-color: #ffccbc;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* Contenedor de Resultado */
        #resultado { 
            margin-top: 35px; 
            padding: 10px; 
            border: none; 
            background-color: transparent; 
            min-height: 250px; 
            font-size: 1.1em; 
            line-height: 1.6;
            text-align: justify; 
        }

        /* Estilos de la Ficha Troquelada (ALTURA FIJA Y TROQUELADO ADYACENTE) */
        .ficha-troquelada {
            border: 2px dashed #d84315; 
            padding: 10px; 
            height: 110mm; /* Aumentada para la visualización en pantalla, ajustada en impresión */
            margin: 0; 
            margin-top: -2px; 
            margin-left: -2px;
            background-color: #ffffff;
            border-radius: 0; 
            display: inline-block; 
            width: 50%; 
            vertical-align: top; 
            box-sizing: border-box; 
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.05);
            float: left; 
            overflow: hidden; 
        }
        .ficha-troquelada:nth-child(2n+1) { 
             margin-left: 0;
             clear: left;
        }

        /* Ajustes de texto dentro de la ficha */
        .ficha-troquelada strong {
            color: #d84315;
            font-weight: bold;
            display: block; 
            margin-top: 5px;
            margin-bottom: 5px;
            font-size: 1.2em;
            border-bottom: 1px solid #ffccbc;
            padding-bottom: 3px;
        }
        .ficha-troquelada ul {
            list-style: none; 
            padding-left: 0;
            margin: 0;
        }
        .ficha-troquelada li {
            margin-bottom: 5px;
            font-weight: normal;
            line-height: 1.4;
        }
        .ficha-troquelada li strong {
            display: inline;
            margin-top: 0;
            margin-bottom: 0;
            border-bottom: none;
            font-size: 1em;
            padding-bottom: 0;
        }

        /* Estilos para la carga */
        .cargando { 
            color: #d84315; 
            font-weight: bold; 
            animation: pulse 1.5s infinite; 
            display: block;
            text-align: center;
            font-size: 1.2em;
            padding: 20px 0;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* ----------------------------------------------------------
           ESTILOS DE IMPRESIÓN (CLAVE PARA 10 POR PÁGINA)
           ---------------------------------------------------------- */
        @media print {
            body { 
                background-color: white !important;
                padding: 0;
                margin: 0;
            }
            /* Ocultar elementos de control */
            .control-container, hr, a, h1, p.instruccion {
                display: none !important;
            }
            #resultado {
                padding: 0; 
                box-shadow: none;
                margin-top: 0;
                border: none;
                text-align: justify; 
            }
            /* Estilo de la ficha impresa - Altura fija para la impresión */
            .ficha-troquelada {
                border: 1px dashed #333; 
                background-color: white !important; 
                box-shadow: none !important;
                page-break-inside: avoid; 
                width: 50%; 
                height: 59.4mm; /* Altura fija: 297mm (A4) / 5 filas = 59.4mm */
                margin: 0; 
                float: left; 
                padding: 3mm 5mm; 
                box-sizing: border-box; 
                margin-top: -1px; 
                margin-left: -1px;
                overflow: hidden; 
            }
             .ficha-troquelada:nth-child(2n+1) { 
                 clear: left;
            }
            
            /* FORZAR SALTO DE PÁGINA DESPUÉS DE LA FICHA 10 */
            .ficha-troquelada:nth-child(10) {
                 page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <h1>20 Fichas de Impro Grupal (5 Personas)</h1>
    
    
    <div class="control-container">
        <button id="generar-btn" onclick="generarFichas()">Generar 20 Fichas de Escenario</button>
        <button id="imprimir-btn" onclick="imprimirFichas()" style="display: none;">Imprimir Fichas (DIN A4)</button>
    </div>
    
    <div id="resultado">
        <p style="text-align: center; color: #5f6368;"></p>
    </div>


    <script>
        // ----------------------------------------------------------
        // --- CLAVE API Y CONFIGURACIÓN ---
        // ----------------------------------------------------------
        const API_KEY = 'AIzaSyBkw_hSk8yJdruIH-mOPWTvd4v7qVh-EyQ'; 
        const MODEL_NAME = 'gemini-2.5-flash';
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`;
        
        // ----------------------------------------------------------
        // --- FUNCIÓN DE IMPRESIÓN ---
        // ----------------------------------------------------------
        function imprimirFichas() {
            window.print();
        }

        // ----------------------------------------------------------
        // --- FUNCIÓN PARA CONSTRUIR EL PROMPT (Exacto y con Cero Fantasía) ---
        // ----------------------------------------------------------
        function construirPromptFichas() {
            
            // SE USA EL PROMPT ORIGINAL EXACTO PROPORCIONADO POR EL USUARIO
            const prompt = `Quiero que generes 20 fichas para ejercicios de improvisación teatral con el mismo formato, estructura y extensión que los ejemplos que te dejo a continuación.

Cada ficha debe incluir:
¿Quiénes son?
¿Dónde están?
¿Qué situación tienen?

Integrantes (5 personas):
El estilo debe ser infantil y gracioso con cero fantasía, con ideas claras y fáciles de representar en una clase.
Formato de ejemplo (respeta exactamente este estilo):
Grupo 1

¿Qué situación tienen?

Grupo 3

¿Dónde están?

¿Qué situación tienen?

¿Cuál es el problema?

Integrantes (5 personas):
Grupo 4

¿Quiénes son?

Un grupo de granjeros

¿Dónde están?

¿Qué situación tienen?

¿Cuál es el problema?

Integrantes (5 personas):
Grupo 5

¿Quiénes son?

Un grupo de piratas

¿Dónde están?

En su barco

¿Qué situación tienen?

Buscan una isla del tesoro

¿Cuál es el problema?

El capitán tiene miedo al agua

Integrantes (5 personas):
Grupo 6

¿Quiénes son?

Un grupo de cocineros

¿Dónde están?

¿Qué situación tienen?

¿Cuál es el problema?

Se les ha acabado la sal y el comedor abre en 10 minutos

Integrantes (5 personas):
Grupo 7

¿Quiénes son?

Un grupo de robots

¿Dónde están?

En una fábrica

¿Qué situación tienen?

¿Cuál es el problema?

Integrantes (5 personas):
Grupo 19

Integrantes (5 personas):
Grupo 20

¿Dónde están?

¿Qué situación tienen?

¿Cuál es el problema?

Integrantes (5 personas):
Ahora genera 20 grupos nuevos siguiendo exactamente este formato empezando la numeración por Grupo 1.`;

            return prompt;
        }

        // ----------------------------------------------------------
        // --- FUNCIÓN AUXILIAR PARA FORMATEAR LA SALIDA ---
        // ----------------------------------------------------------
        function formatearResultado(texto) {
            
            // 1. Divide el texto en bloques usando el patrón "Grupo [Número]"
            const bloques = texto.split(/(?=^Grupo\s*\d+)/gm);
            let htmlFinal = '';

            // 2. Procesa cada bloque
            for (let i = 0; i < bloques.length; i++) {
                let bloque = bloques[i].trim();
                if (!bloque) continue;

                // 3. Obtener el título (Grupo X)
                let tituloMatch = bloque.match(/^Grupo\s*(\d+)/);
                if (!tituloMatch) continue;
                
                // 4. Iniciar la ficha troquelada
                let fichaHTML = `<div class="ficha-troquelada">`;
                
                // 5. El título es la primera línea
                fichaHTML += `<strong>${tituloMatch[0]}</strong>`;
                let contenido = bloque.substring(tituloMatch[0].length).trim();
                
                // 6. Reemplazar las preguntas por un formato de lista <ul>/<li>
                fichaHTML += `<ul>`;
                
                // Capturar pregunta y respuesta línea por línea
                const preguntas = contenido.matchAll(/\¿(Quiénes son|Dónde están|Qué situación tienen|Cuál es el problema)\?\s*\n(.*?)(?=\n\¿|\nIntegrantes|\n$)/gs);

                let indiceFinContenido = 0;
                for (const match of preguntas) {
                    const preguntaCompleta = match[0];
                    const pregunta = match[1];
                    const respuesta = match[2].trim();
                    fichaHTML += `<li><strong>¿${pregunta}?</strong> ${respuesta}</li>`;
                    indiceFinContenido = contenido.indexOf(preguntaCompleta) + preguntaCompleta.length;
                }

                // 7. Reemplazar "Integrantes (5 personas):"
                const textoRestante = contenido.substring(indiceFinContenido);
                if (textoRestante.includes('Integrantes (5 personas):')) {
                    fichaHTML += `<li><strong>Integrantes:</strong> 5 personas.</li>`;
                }

                fichaHTML += `</ul></div>`;

                htmlFinal += fichaHTML;
            }

            // 8. Mostrar el botón de imprimir y asegurar que el de generar esté activo
            document.getElementById('generar-btn').disabled = false;
            document.getElementById('generar-btn').style.display = 'inline-block';
            document.getElementById('imprimir-btn').style.display = 'inline-block';

            return htmlFinal;
        }

        // ----------------------------------------------------------
        // --- FUNCIÓN PRINCIPAL PARA LLAMAR A LA API ---
        // ----------------------------------------------------------
        async function generarFichas() {
            const resultadoDiv = document.getElementById('resultado');
            const boton = document.getElementById('generar-btn');
            const imprimirBoton = document.getElementById('imprimir-btn');
            
            boton.disabled = true; // Deshabilita el botón mientras carga
            imprimirBoton.style.display = 'none'; // Oculta el de imprimir durante la carga
            resultadoDiv.innerHTML = '<span class="cargando">Generando 20 NUEVAS fichas de improvisación...</span>';
            
            const prompt = construirPromptFichas();
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: prompt }] }],
                        generationConfig: { 
                            temperature: 0.1, 
                            maxOutputTokens: 8192, 
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({error: {message: 'Respuesta de error no es JSON'}}));
                    throw new Error(`Error HTTP ${response.status}: ${errorData.error ? errorData.error.message : response.statusText}`);
                }

                const data = await response.json();
                let textoGenerado = "";

                try {
                    textoGenerado = data.candidates[0].content.parts[0].text.trim();
                } catch (e) {
                    let safetyReason = JSON.stringify(data, null, 2);
                    if (data.candidates && data.candidates[0].finishReason === 'SAFETY') {
                        safetyReason = "Bloqueado por política de seguridad (SAFETY BLOCK).";
                    }

                    resultadoDiv.innerHTML = `<strong style="color: #c53929;">Error: No se pudo generar el contenido útil.</strong><div class="error-detalle"><pre>${safetyReason}</pre></div>`;
                    boton.disabled = false; // Reactiva el botón
                    boton.style.display = 'inline-block';
                    return; 
                }

                resultadoDiv.innerHTML = formatearResultado(textoGenerado);
                // Los botones se reactivan dentro de formatearResultado
                
            } catch (error) {
                let posibleCausa = "Clave API incorrecta, expirada o problema de CORS.";
                resultadoDiv.innerHTML = `<strong style="color: #c53929;">Error crítico de Conexión:</strong> ${error.message}.<br><br><strong>POSIBLES CAUSAS:</strong> ${posibleCausa}`;
                boton.disabled = false; // Reactiva el botón
                boton.style.display = 'inline-block';
            }
        }
    </script>


<hr style="margin-top: 40px; border-color: #ccc;">

        ">

        </a>
    </div>

</body>
</html>
