            // Esperamos 30 segundos antes de la siguiente llamada (2 llamadas/minuto)
            status.innerText = "En espera (30s)...";
            await new Promise(r => setTimeout(r, 30000)); 

        } catch (e) {
            if (e.name === 'AbortError') {
                status.innerText = "IA Detenida.";
                await new Promise(r => setTimeout(r, 1000)); // Pausa corta si abortamos
            } else {
                status.innerText = "Error. Reintentando en 10s...";
                await new Promise(r => setTimeout(r, 10000)); // Si falla, esperamos 10s para no saturar
            }
        }
    }
}

let activo = true; 
let controller = new AbortController(); // El mando para cancelar la IA

function toggleMundo() {
    activo = !activo;
    const btn = document.getElementById('btn-stop');
    if (activo) {
        controller = new AbortController(); // Creamos uno nuevo para la próxima petición
        btn.innerText = "Detener Todo";
        btn.style.background = "#c0392b";
    } else {
        controller.abort(); // ESTO detiene la IA inmediatamente
        btn.innerText = "Reanudar Flujo";
        btn.style.background = "#27ae60";
    }
}


        function guardar(nuevas) {
            let historial = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            // Evitar duplicados en esta tanda de almacenamiento
            const unicas = nuevas.filter(n => !historial.includes(n));
            historial = historial.concat(unicas);

            // --- RESET SILENCIOSO ---
            if (historial.length >= MAX_STORAGE) {
                historial = []; // Vaciamos el almacén local para evitar lag
                
                // Feedback visual sutil en el contador para ti
                const countEl = document.getElementById('count-total');
                countEl.style.color = "#3498db"; 
                setTimeout(() => countEl.style.color = "#2ecc71", 2000);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(historial));
            actualizarContador();
        }

        function soltarPalabra() {
    if (bufferPalabras.length === 0) return;

    const texto = bufferPalabras.shift();
    bufferPalabras.push(texto);

    const canvas = document.getElementById('canvas');
    const el = document.createElement('div');
    el.className = 'floating-word';
    el.innerText = texto;

    // Estética
    const size = 14 + Math.random() * 40;
    const colors = ["#ff3e3e", "#44bdff", "#00ff88", "#ffeb3b", "#e040fb", "#ffffff"];
    const color = colors[Math.floor(Math.random() * colors.length)];
    
    const x = Math.random() * (window.innerWidth - 250);
    const y = Math.random() * (window.innerHeight - 50);

    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.fontSize = `${size}px`;
    el.style.color = color;
    el.style.opacity = '0';
    el.style.transform = `scale(0.5)`;

    canvas.appendChild(el);

    // Entrada animada
    setTimeout(() => {
        el.style.opacity = '0.8';
        el.style.transform = `scale(1) translateY(${(Math.random() - 0.5) * 60}px)`;
    }, 50);

    // Salida animada (Modificada para respetar el botón STOP)
    const desvanecer = () => {
        // Si el mundo está detenido, esperamos 1 segundo y volvemos a preguntar
        if (!activo) {
            setTimeout(desvanecer, 1000);
            return;
        }
        
        // Si está activo, procedemos a borrar
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 2000);
    };

    // Iniciamos la cuenta atrás de 6 segundos para desvanecer
    setTimeout(desvanecer, 6000);
}

        function actualizarContador() {
            const h = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            document.getElementById('count-total').innerText = h.length;
        }

        function descargarFichero() {
            const h = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            if(h.length === 0) return alert("Almacén vacío ahora mismo.");
            const blob = new Blob([h.map(f => `"${f}"`).join(",\n")], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `caos_impro_${new Date().getTime()}.txt`;
            a.click();
        }

        function limpiarMemoria() {
            if (confirm("¿Vaciar almacén?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }
    </script>
