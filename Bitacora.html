<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #f1f1f1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 16px;
        }
        h1 {
            font-size: 1.1rem;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        textarea {
            width: 100%;
            flex: 1;
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            color: #fff;
            padding: 16px;
            font-size: 1.1rem;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }
        textarea:focus {
            border-color: #0a84ff;
        }
        button {
            background-color: #0a84ff;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        button:disabled { background-color: #3a3a3c; color: #8e8e93; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #30d158;
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Bitácora rápida</h1>
    <textarea id="nota" placeholder="Escribe aquí lo que ha pasado..." autofocus></textarea>
    <button id="btn" onclick="guardar()">Guardar entrada</button>
    
    <div id="toast" class="toast">Guardado correctamente</div>

    <script>
        const URL_GAS= 'https://script.google.com/macros/s/AKfycbwcZO1gmsu5eBo8uuzlKCmHrkGhGY12PWWRDmnVdhwm_s9bIpo_fZ6SY3uMjGkseJRI-g/exec';

        async function guardar() {
            const txt = document.getElementById('nota');
            const btn = document.getElementById('btn');
            const toast = document.getElementById('toast');
            
            const contenido = txt.value.trim();
            if (!contenido) return;

            btn.disabled = true;
            btn.textContent = 'Guardando...';

            try {
                await fetch(URL_GAS, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nota: contenido })
                });

                txt.value = '';
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            } catch (e) {
                alert('Error al guardar la entrada.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Guardar entrada';
            }
        }
    </script>
</body>
</html>
