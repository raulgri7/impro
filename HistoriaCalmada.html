<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Narraciones de Movimiento</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            max-width: 850px; 
            margin: 0 auto; 
            background-color: #f4f7f9; 
            color: #333;
        }
        h1 { 
            color: #1a73e8; 
            border-bottom: 3px solid #1a73e8; 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
            text-align: center;
        }
        p.instruccion { 
            color: #5f6368; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 1.1em;
            font-style: italic; 
        }
        
        .boton-container {
            text-align: center;
            margin-bottom: 30px;
        }

        button { 
            padding: 16px 32px; 
            background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 1.1em; 
            font-weight: bold;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.3); 
        }
        button:hover { 
            background: linear-gradient(135deg, #1557b0 0%, #114690 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
        }
        button:active { 
            transform: translateY(1px); 
        }
        
        #resultado { 
            margin-top: 20px; 
            padding: 30px; 
            border: 1px solid #d1d9e0; 
            background-color: #ffffff;
            border-radius: 15px; 
            min-height: 300px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        pre { 
            font-family: 'Georgia', serif; 
            margin: 0; 
            padding: 0; 
            white-space: pre-wrap; 
            line-height: 1.8; 
            font-size: 1.15em;
            text-align: justify;
            color: #2c3e50;
        }

        .cargando { 
            display: block;
            text-align: center;
            color: #1a73e8; 
            font-weight: bold; 
            font-size: 1.2em;
            margin-top: 50px;
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        .error-msg {
            color: #d93025;
            background-color: #fce8e6;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d93025;
            font-weight: bold;
        }

        .volver-btn {
            display: inline-block;
            margin-top: 40px;
            text-decoration: none;
            color: #5f6368;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .volver-btn:hover {
            background-color: #f1f3f4;
        }
    </style>
</head>
<body>

    <h1>&nbsp;&nbsp;Guion de Movimiento y Viaje</h1>
    <p class="instruccion">Viaje imaginario guiado para movimiento libre con los ojos abiertos.</p>
    
    <div class="boton-container">
        <button onclick="generarContenido()">Generar Narraci&oacute;n</button>
    </div>
    
    <div id="resultado">
        <p style="text-align: center; color: #9aa0a6; margin-top: 100px;">
            Haz clic en el bot&oacute;n para crear una nueva experiencia de movimiento.
        </p>
    </div>

    <script>
        // --- CONFIGURACI&Oacute;N DEL WORKER ---
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        function construirPromptNarracion() {
            return `**INSTRUCCI&Oacute;N ESTRICTA:** Genera &Uacute;NICAMENTE el texto narrativo completo. No a&ntilde;adas introducciones, explicaciones de rol, t&iacute;tulos, indicaciones al lector ni frases de meditaci&oacute;n abstracta. El texto debe ser continuo y empezar directamente con el tiempo de duraci&oacute;n.

**OBJETIVO:** Crea un viaje imaginario guiado (6-8 minutos) para participantes que se mueven libremente con los ojos abiertos en un espacio grande. El foco es el movimiento f&iacute;sico y la sensaci&oacute;n espacial.

**CRITERIOS OBLIGATORIOS:**
1. Segunda persona del singular (tuteo): 'caminas', 'sientes', 'ves'.
2. Descripciones sensoriales potentes (vista, o&iacute;do, tacto, olfato, equilibrio).
3. Instrucciones de movimiento f&iacute;sico real: caminar, girar, agacharse, saltar, inclinarse, cambios de ritmo y peso.
4. Ritmo y Progresi&oacute;n: Inicio tranquilo, fase de exploraci&oacute;n/desaf&iacute;o, cl&iacute;max din&aacute;mico (obst&aacute;culo o cambio de paisaje) y cierre tranquilo.
5. Espacios imaginarios: Usa una ciudad antigua, un mercado futurista, ruinas de un templo o un desierto de cristal (NO USAR bosques, prados ni r&iacute;os).
6. Formato: Texto continuo, frases cortas y claras.

A&ntilde;ade al inicio: Duraci&oacute;n aproximada: 6-8 minutos.`;
        }

        async function generarContenido() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '<span class="cargando">Tejiendo el hilo de la historia...</span>';
            
            const prompt = construirPromptNarracion();
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) {
                    throw new Error('Hubo un problema al conectar con el servidor.');
                }

                const data = await response.json();
                const textoGenerado = data.candidates[0].content.parts[0].text.trim();

                resultadoDiv.innerHTML = `<pre>${textoGenerado}</pre>`;

            } catch (error) {
                resultadoDiv.innerHTML = `
                    <div class="error-msg">
                        &iexcl;Vaya! No hemos podido conectar con el generador. 
                        <br><br>
                        Detalle: ${error.message}
                    </div>
                `;
            }
        }
    </script>

    <div style="text-align: center; margin-bottom: 40px;">
        <a href="index.html" class="volver-btn">
            &larr; Volver al Men&uacute; Principal
        </a>
    </div>

</body>
</html>
