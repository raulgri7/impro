<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nota Rápida Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #000; color: #fff; padding: 6px; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    .widget-container { width: 100%; display: flex; flex-direction: column; gap: 5px; }
    textarea { width: 100%; height: 58px; background-color: #1c1c1e; color: #fff; border: 1px solid #2c2c2e; border-radius: 8px; padding: 6px 8px; font-size: 13px; resize: none; outline: none; }
    textarea:focus { border-color: #0a84ff; }
    button { width: 100%; height: 32px; background-color: #0a84ff; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:active { background-color: #0066cc; }
    button:disabled { background-color: #3a3a3c; color: #8e8e93; }
    #status { font-size: 10px; text-align: center; min-height: 12px; font-weight: 500; word-break: break-all; }
    .success { color: #30d158; }
    .error { color: #ff453a; }
  </style>
</head>
<body>

  <div class="widget-container">
    <textarea id="nota" placeholder="Escribe tu nota..."></textarea>
    <button id="btnGuardar" onclick="enviarNota()">Guardar</button>
    <div id="status"></div>
  </div>

  <script>
    // CAMBIA ESTO POR TU URL REAL DE GOOGLE APPS SCRIPT
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcZO1gmsu5eBo8uuzlKCmHrkGhGY12PWWRDmnVdhwm_s9bIpo_fZ6SY3uMjGkseJRI-g/exec';

    async function enviarNota() {
      const textarea = document.getElementById('nota');
      const btn = document.getElementById('btnGuardar');
      const status = document.getElementById('status');
      const texto = textarea.value.trim();

      if (!texto) return;

      // 1. Comprobación previa de URL
      if (APPS_SCRIPT_URL.includes('PONE_AQUI') || !APPS_SCRIPT_URL.startsWith('http')) {
        status.textContent = '✕ Error: Falta poner la URL de Apps Script en el código';
        status.className = 'error';
        return;
      }

      textarea.disabled = true;
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      status.textContent = '';
      status.className = '';

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ nota: texto })
        });

        status.textContent = '✓ Guardado';
        status.className = 'success';
        textarea.value = '';

        setTimeout(() => { status.textContent = ''; }, 2000);

      } catch (err) {
        status.textContent = '✕ Error: ' + err.message;
        status.className = 'error';
      } finally {
        textarea.disabled = false;
        btn.disabled = false;
        btn.textContent = 'Guardar';
      }
    }
  </script>

</body>
</html>
