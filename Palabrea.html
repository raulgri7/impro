<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palabrea Express 🎲</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            /* Previene el zoom por doble toque en móviles */
            touch-action: manipulation;
        }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            user-select: none;
            overflow: hidden;
        }

        .tablero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-grow: 1;
            width: 100%;
        }

        /* Letra en formato gigante */
        .letra-box {
            font-size: clamp(7rem, 25vw, 16rem);
            font-weight: 900;
            line-height: 1;
            color: #ffcc00;
            text-shadow: 0 10px 30px rgba(255, 204, 0, 0.3);
            transition: transform 0.1s ease;
        }

        /* Categoría con icono y texto gigante */
        .categoria-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #1e1e1e;
            border: 3px solid #333;
            padding: 20px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 90vw;
            text-align: center;
        }

        .categoria-icono {
            font-size: clamp(2.8rem, 7vw, 5rem);
        }

        .categoria-nombre {
            font-size: clamp(1.8rem, 4.5vw, 3.2rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
        }

        /* CONTROLES Y BOTÓN */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .btn-generar {
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-generar:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(255, 51, 102, 0.4);
        }

        /* CHECKBOX AUTOMÁTICO Y BARRA DE TIEMPO */
        .auto-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #aaa;
            cursor: pointer;
        }

        .auto-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ff3366;
            cursor: pointer;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: #ff3366;
            width: 100%;
            transition: width 0.1s linear;
        }

        .instrucciones {
            font-size: 0.85rem;
            color: #555;
            text-align: center;
        }

        /* RESPONSIVE EN PANTALLA HORIZONTAL (LANDSCAPE) */
        @media (orientation: landscape) and (max-height: 550px) {
            body {
                padding: 10px 20px;
            }
            .tablero {
                flex-direction: row;
                justify-content: center;
                gap: 40px;
            }
            .letra-box {
                font-size: clamp(5rem, 20vh, 10rem);
            }
            .categoria-box {
                padding: 10px 20px;
            }
            .controls-wrapper {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 600px;
                gap: 10px;
            }
            .btn-generar {
                padding: 12px 30px;
                font-size: 1.2rem;
                width: auto;
            }
            .instrucciones {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="tablero">
        <div class="letra-box" id="letra">-</div>
        
        <div class="categoria-box">
            <span class="categoria-icono" id="icono">🎲</span>
            <span class="categoria-nombre" id="categoria">-</span>
        </div>
    </div>

    <div class="controls-wrapper">
        <button class="btn-generar" onclick="siguienteTurno()">¡SIGUIENTE!</button>

        <label class="auto-box">
            <input type="checkbox" id="chk-auto" onchange="toggleAutoTimer()">
            Pasar automáticamente cada 15s
        </label>

        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div class="instrucciones">Puedes pulsar la BARRA ESPACIADORA para cambiar</div>
    </div>

    <script>
        // ABECEDARIO ESPAÑOL COMPLETO (27 letras)
        const letras = [
            'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K',
            'L', 'M', 'N', 'Ñ', 'O', 'P', 'Q', 'R', 'S', 'T', 'U', 
            'V', 'W', 'X', 'Y', 'Z'
        ];

        // Las 10 categorías calcadas de tu carta física de Palabrea
        const categorias = [
            { nombre: "Animal", icono: "🐓" },
            { nombre: "Ciudad", icono: "🏙️" },
            { nombre: "País", icono: "🌍" },
            { nombre: "Personaje Famoso", icono: "🥸" },
            { nombre: "Profesión", icono: "👨‍🍳" },
            { nombre: "Objeto", icono: "🪑" },
            { nombre: "Planta / Árbol", icono: "🌻" },
            { nombre: "Comida", icono: "🍲" },
            { nombre: "Serie TV / Película", icono: "🎥" },
            { nombre: "Nombre", icono: "👦👧" }
        ];

        let ultimaLetra = '';
        let ultimaCategoria = '';
        
        let autoInterval = null;
        const TIEMPO_AUTO = 15;

        function siguienteTurno() {
            // Seleccionar letra sin repetir consecutivamente
            let nuevaLetra;
            do {
                nuevaLetra = letras[Math.floor(Math.random() * letras.length)];
            } while (nuevaLetra === ultimaLetra);
            ultimaLetra = nuevaLetra;

            // Seleccionar categoría sin repetir consecutivamente
            let nuevaCat;
            do {
                nuevaCat = categorias[Math.floor(Math.random() * categorias.length)];
            } while (nuevaCat.nombre === ultimaCategoria);
            ultimaCategoria = nuevaCat.nombre;

            // Renderizar en pantalla
            const elemLetra = document.getElementById('letra');
            elemLetra.innerText = nuevaLetra;
            
            // Efecto de pulso rápido
            elemLetra.style.transform = 'scale(1.1)';
            setTimeout(() => elemLetra.style.transform = 'scale(1)', 100);

            document.getElementById('icono').innerText = nuevaCat.icono;
            document.getElementById('categoria').innerText = nuevaCat.nombre;

            // Reiniciar temporizador auto si está activado
            reiniciarTimerAuto();
        }

        // --- LÓGICA DEL TEMPORIZADOR AUTO 15s ---
        function toggleAutoTimer() {
            const chk = document.getElementById('chk-auto');
            const progressContainer = document.getElementById('progress-container');

            if (chk.checked) {
                progressContainer.style.display = 'block';
                reiniciarTimerAuto();
            } else {
                progressContainer.style.display = 'none';
                pararTimerAuto();
            }
        }

        function reiniciarTimerAuto() {
            pararTimerAuto();
            const chk = document.getElementById('chk-auto');
            if (!chk.checked) return;

            const bar = document.getElementById('progress-bar');
            bar.style.width = '100%';

            const intervalMs = 100;
            const totalSteps = (TIEMPO_AUTO * 1000) / intervalMs;
            let currentStep = 0;

            autoInterval = setInterval(() => {
                currentStep++;
                const pct = Math.max(0, 100 - (currentStep / totalSteps) * 100);
                bar.style.width = pct + '%';

                if (currentStep >= totalSteps) {
                    pararTimerAuto();
                    siguienteTurno();
                }
            }, intervalMs);
        }

        function pararTimerAuto() {
            if (autoInterval) clearInterval(autoInterval);
        }

        // Previene el zoom táctil al pulsar rápido repetidamente en pantalla
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Control con la barra espaciadora
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                siguienteTurno();
            }
        });

        // ARRANCAR DIRECTAMENTE AL CREGAR LA PÁGINA
        window.onload = siguienteTurno;
    </script>

</body>
</html>
