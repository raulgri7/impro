<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabrea Solo 🔤</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #334155;
        }

        .titulo {
            font-size: 1.2rem;
            font-weight: 900;
            color: #f43f5e;
            letter-spacing: 1px;
        }

        .puntos-box {
            background: #0f172a;
            color: #fbbf24;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            border: 1px solid #334155;
        }

        /* LAYOUT PRINCIPAL (Flex en vertical, Grid en horizontal) */
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
        }

        /* MODO HORIZONTAL (LANDSCAPE) */
        @media (orientation: landscape) and (max-height: 500px) {
            .container {
                max-width: 750px;
                padding: 15px;
            }
            .header {
                margin-bottom: 10px;
                padding-bottom: 6px;
            }
            .game-layout {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 15px;
                align-items: center;
            }
        }

        .visual-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .tarjeta-categoria {
            background: #0f172a;
            border: 2px solid #f43f5e;
            border-radius: 18px;
            padding: 15px;
            width: 100%;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            font-size: 1.15rem;
            font-weight: 800;
            color: #f8fafc;
            line-height: 1.3;
        }

        .tarjeta-letra {
            background: #f43f5e;
            color: white;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .input-respuesta {
            width: 100%;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 1rem;
            color: white;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .input-respuesta:focus { border-color: #f43f5e; }

        .botones-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .btn {
            border: none;
            padding: 12px 8px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.96); }

        .btn-validar { background: #22c55e; color: white; }
        .btn-saltar { background: #334155; color: #e2e8f0; }
        .btn-inicio { background: #f43f5e; color: white; width: 100%; }

        /* CHECKBOX Y BARRAS DE TIEMPO */
        .auto-mode-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
            font-size: 0.85rem;
            color: #94a3b8;
            cursor: pointer;
        }

        .auto-mode-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f43f5e;
            cursor: pointer;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #0f172a;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: #f43f5e;
            width: 100%;
            transition: width 0.1s linear;
        }

        .feedback {
            margin-top: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            min-height: 20px;
        }

        .feedback.correcto { color: #22c55e; }
        .feedback.incorrecto { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="titulo">PALABREA 🔤</div>
            <div class="puntos-box">Puntos: <span id="cnt-puntos">0</span> ⭐</div>
        </div>

        <div class="game-layout">
            <!-- Columna 1 en Horizontal / Arriba en Vertical -->
            <div class="visual-section">
                <div id="categoria-box" class="tarjeta-categoria">
                    Pulsa "Empezar" para comenzar
                </div>
                <div id="letra-box" class="tarjeta-letra" style="display: none;">?</div>
            </div>

            <!-- Columna 2 en Horizontal / Abajo en Vertical -->
            <div class="controls-section">
                <button id="btn-inicio" class="btn btn-inicio" onclick="nuevaRonda()">¡Empezar Ronda!</button>
                
                <div id="grupo-juego" style="display: none; flex-direction: column; gap: 8px;">
                    <input type="text" id="input-resp" class="input-respuesta" placeholder="ESCRIBE TU PALABRA..." autocomplete="off">
                    
                    <div class="botones-row">
                        <button class="btn btn-validar" onclick="validarRespuesta()">Enviar</button>
                        <button class="btn btn-saltar" onclick="nuevaRonda()">Cambiar 🎲</button>
                    </div>

                    <!-- Opción Automática -->
                    <label class="auto-mode-box">
                        <input type="checkbox" id="chk-auto" onchange="toggleAutoTimer()">
                        Pasar automáticamente cada 15s
                    </label>

                    <div id="progress-container" class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                </div>

                <div id="feedback" class="feedback"></div>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIAS = [
            "ANIMAL", "CIUDAD O PAÍS", "COMIDA O BEBIDA", "PROFESIÓN", 
            "OBJETO DE CASA", "NOMBRE DE PERSONA", "DEPORTE", "PELÍCULA O SERIE",
            "MARCA DE COCHE", "PRENDA DE ROPA", "INSTRUMENTO MUSICAL", "FLOR O PLANTA",
            "HERRAMIENTA", "CUERPO HUMANO", "FRUTA O VERDURA", "VERBO"
        ];
        
        // ABECEDARIO ESPAÑOL COMPLETO (27 letras)
        const LETRAS = [
            "A","B","C","D","E","F","G","H","I","J","K","L","M",
            "N","Ñ","O","P","Q","R","S","T","U","V","W","X","Y","Z"
        ];

        let categoriaActual = "";
        let letraActual = "";
        let puntos = 0;
        let autoTimer = null;
        let progressInterval = null;
        const TIEMPO_AUTO = 15; // segundos
        let tiempoRestanteAuto = TIEMPO_AUTO;

        window.onload = () => {
            document.getElementById('input-resp').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') validarRespuesta();
            });
        };

        function nuevaRonda() {
            document.getElementById('feedback').innerText = '';
            document.getElementById('btn-inicio').style.display = 'none';
            document.getElementById('grupo-juego').style.display = 'flex';
            document.getElementById('letra-box').style.display = 'flex';

            categoriaActual = CATEGORIAS[Math.floor(Math.random() * CATEGORIAS.length)];
            letraActual = LETRAS[Math.floor(Math.random() * LETRAS.length)];

            document.getElementById('categoria-box').innerText = categoriaActual;
            document.getElementById('letra-box').innerText = letraActual;
            
            const input = document.getElementById('input-resp');
            input.value = '';
            input.focus();

            // Reiniciar temporizador automático si está activo
            reiniciarTimerAuto();
        }

        function normalizarTexto(texto) {
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        }

        function validarRespuesta() {
            const input = document.getElementById('input-resp');
            const resp = normalizarTexto(input.value);
            const feedback = document.getElementById('feedback');

            if (!resp) return;

            const letraLimpia = normalizarTexto(letraActual);

            if (resp.startsWith(letraLimpia)) {
                puntos++;
                document.getElementById('cnt-puntos').innerText = puntos;
                feedback.className = "feedback correcto";
                feedback.innerText = "¡Correcto! +1 punto";
                setTimeout(nuevaRonda, 600);
            } else {
                feedback.className = "feedback incorrecto";
                feedback.innerText = `Debe empezar por la letra ${letraActual}`;
            }
        }

        /* --- LÓGICA DEL MODO AUTOMÁTICO 15s --- */
        function toggleAutoTimer() {
            const chk = document.getElementById('chk-auto');
            const progressContainer = document.getElementById('progress-container');

            if (chk.checked) {
                progressContainer.style.display = 'block';
                reiniciarTimerAuto();
            } else {
                progressContainer.style.display = 'none';
                pararTimerAuto();
            }
        }

        function reiniciarTimerAuto() {
            pararTimerAuto();
            const chk = document.getElementById('chk-auto');
            if (!chk.checked) return;

            tiempoRestanteAuto = TIEMPO_AUTO;
            const bar = document.getElementById('progress-bar');
            bar.style.width = '100%';

            const intervalMs = 100;
            const totalSteps = (TIEMPO_AUTO * 1000) / intervalMs;
            let currentStep = 0;

            progressInterval = setInterval(() => {
                currentStep++;
                const pct = Math.max(0, 100 - (currentStep / totalSteps) * 100);
                bar.style.width = pct + '%';

                if (currentStep >= totalSteps) {
                    pararTimerAuto();
                    nuevaRonda(); // Dispara automáticamente la siguiente ronda
                }
            }, intervalMs);
        }

        function pararTimerAuto() {
            if (progressInterval) clearInterval(progressInterval);
        }
    </script>
</body>
</html>
