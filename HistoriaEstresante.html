<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador: Viaje Fren&eacute;tico</title>
    <style>
        /* Estilos mejorados para el tema de Urgencia/Frenes&iacute; */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            max-width: 850px; 
            margin: 0 auto; 
            background-color: #fcfcfc; 
            color: #1a1a1a; 
        }
        h1 { 
            color: #d32f2f; 
            border-bottom: 4px solid #d32f2f; 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p.instruccion { 
            color: #455a64; 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 1.1em;
            font-weight: 500;
        }
        
        .boton-container {
            text-align: center;
            margin-bottom: 35px;
        }

        button { 
            padding: 18px 36px; 
            background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.2em; 
            font-weight: bold;
            transition: all 0.2s ease; 
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
            text-transform: uppercase;
        }
        button:hover { 
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.5);
        }
        button:active { 
            transform: translateY(2px); 
        }
        
        #resultado { 
            margin-top: 20px; 
            padding: 30px; 
            border: 2px solid #d32f2f; 
            background-color: #fff8f8;
            border-radius: 12px; 
            min-height: 300px; 
            box-shadow: inset 0 0 10px rgba(211, 47, 47, 0.05);
        }

        pre { 
            font-family: 'Verdana', sans-serif; 
            margin: 0; 
            padding: 0; 
            white-space: pre-wrap; 
            line-height: 1.7; 
            font-size: 1.1em;
            text-align: justify;
            color: #1a1a1a;
        }

        .cargando { 
            display: block;
            text-align: center;
            color: #d32f2f; 
            font-weight: bold; 
            font-size: 1.3em;
            margin-top: 80px;
            text-transform: uppercase;
            animation: flash 0.8s infinite; 
        }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        .error-box {
            color: #b71c1c;
            background-color: #ffebee;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #d32f2f;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 40px;
            text-decoration: none;
            color: #546e7a;
            font-weight: bold;
            padding: 12px 24px;
            border: 2px solid #cfd8dc;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .btn-volver:hover {
            background-color: #eceff1;
            border-color: #90a4ae;
        }
    </style>
</head>
<body>

    <h1>🚨 Guion de Viaje Fren&eacute;tico y Activo 🚨</h1>
    <p class="instruccion">Viaje imaginario estresante que requiere movimiento f&iacute;sico constante, r&aacute;pido y brusco en el espacio.</p>
    
    <div class="boton-container">
        <button onclick="generarContenido()">¡Generar Narraci&oacute;n de Emergencia!</button>
    </div>
    
    <div id="resultado">
        <p style="text-align: center; color: #7f8c8d; margin-top: 100px;">
            Pulsa el bot&oacute;n para iniciar una huida fren&eacute;tica por un entorno en colapso.
        </p>
    </div>

    <script>
        // --- CONFIGURACI&Oacute;N DEL WORKER ---
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        function construirPromptFrenetico() {
            return `**INSTRUCCI&Oacute;N ESTRICTA:** Genera &Uacute;NICAMENTE el texto narrativo completo. No a&ntilde;adas t&iacute;tulos, ni notas del autor. El texto debe ser continuo y empezar directamente con el tiempo de duraci&oacute;n.

**OBJETIVO:** Crea un viaje imaginario de 5 a 7 minutos de puro frenes&iacute;, p&aacute;nico y urgencia. Los participantes deben moverse r&aacute;pido por el espacio con los ojos abiertos. El guion debe ser agotador.

**CRITERIOS OBLIGATORIOS:**
1. Segunda persona del singular (tuteo): 'corres', 'esquivas', 'saltas'.
2. Ritmo acelerado: Frases muy cortas y comandos directos. Cambios bruscos de direcci&oacute;n.
3. Foco en Peligro: El entorno colapsa (humo, explosiones, estructuras cayendo).
4. Movimiento intenso: Correr, saltar huecos, agacharse de golpe, giros en seco de 180 grados, recuperar el equilibrio tras un empuj&oacute;n imaginario.
5. Progresi&oacute;n: Inicio por sorpresa, desarrollo de obst&aacute;culos encadenados, cl&iacute;max de p&aacute;nico total y cierre con una detenci&oacute;n brusca, temblando por la adrenalina.
6. Espacio: Un entorno industrial o urbano en pleno desastre (f&aacute;brica averiada, ciudad hundi&eacute;ndose).

A&ntilde;ade al inicio: Duraci&oacute;n aproximada: 5-7 minutos.`;
        }

        async function generarContenido() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = '<span class="cargando">ALERTA: Generando secuencia de huida...</span>';
            
            const prompt = construirPromptFrenetico();
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) throw new Error('Error al conectar con el servidor de emergencia.');

                const data = await response.json();
                const textoGenerado = data.candidates[0].content.parts[0].text.trim();

                resultadoDiv.innerHTML = `<pre>${textoGenerado}</pre>`;

            } catch (error) {
                resultadoDiv.innerHTML = `
                    <div class="error-box">
                        <strong>ERROR CR&Iacute;TICO:</strong> No se pudo establecer conexi&oacute;n con el generador.<br><br>
                        <em>Detalle: ${error.message}</em>
                    </div>
                `;
            }
        }
    </script>

    <div style="text-align: center; margin-bottom: 40px;">
        <a href="index.html" class="btn-volver">
            &larr; Volver al Men&uacute; Principal
        </a>
    </div>

</body>
</html>
