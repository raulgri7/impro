<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Microvisaci&oacute;n</title>
    <script src="https://unpkg.com/docx@7.1.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --accent: #d35400; --bg: #f4f4f4; }
        body { font-family: 'Courier New', Courier, monospace; background: var(--bg); color: #222; margin: 0; padding: 20px; }
        .no-print { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        textarea { width: 100%; height: 60px; padding: 10px; border: 2px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 1rem; margin-top: 10px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; min-width: 150px; }
        .btn-gen { background: var(--primary); color: white; }
        .btn-print { background: var(--accent); color: white; display: none; }
        .btn-save { background: #2b8a3e; color: white; display: none; }
        #status { margin-top: 15px; color: #d35400; font-weight: bold; text-align: center; }
        .papel-preview { background: #fff; border: 1px solid #ddd; padding: 20px; margin-top: 15px; border-left: 6px solid var(--accent); white-space: pre-wrap; font-size: 1.1rem; }

        @media print {
            .no-print, #status { display: none !important; }
            #impresion-area { display: block !important; }
            .hoja-fisica { 
                page-break-after: always; 
                height: 100vh; 
                padding: 2cm;
                box-sizing: border-box;
                font-size: 14pt;
                line-height: 1.6;
                color: black;
                background: white;
            }
            .hoja-fisica h2 { border-bottom: 2px solid black; padding-bottom: 10px; text-transform: uppercase; font-size: 20pt; margin-top: 0; }
        }
        #impresion-area { display: none; }
    </style>
</head>
<body>

    <div class="no-print">
        <h1>Generar Escenarios para Microteatro Improvisado</h1>
        <p>Opcionalmente introduce un tema com&uacute;n para los personajes y sus circunstancias:</p>
        <textarea id="temaInput" placeholder=""></textarea>
        
        <div class="btn-group">
            <button class="btn btn-gen" id="btnGenerar">GENERAR</button>
            <button class="btn btn-print" id="btnPrint" onclick="window.print()">IMPRIMIR (5 HOJAS)</button>
            <button class="btn btn-save" id="btnSave" onclick="descargarDocx()">GUARDAR EN WORD</button>
        </div>
        <div id="status"></div>
        <div id="preview"></div>
    </div>

    <div id="impresion-area"></div>

    <script>
        const btnGenerar = document.getElementById('btnGenerar');
        const btnPrint = document.getElementById('btnPrint');
        const btnSave = document.getElementById('btnSave');
        const status = document.getElementById('status');
        const preview = document.getElementById('preview');
        const impresionArea = document.getElementById('impresion-area');

        let papelesParaDocx = []; // CAMBIO 2: Variable para almacenar los papeles limpios

        btnGenerar.onclick = async function() {
            const tema = document.getElementById('temaInput').value || "Aleatorio";
            btnGenerar.disabled = true;
            status.innerText = "Generando...";
            preview.innerHTML = "";
            impresionArea.innerHTML = "";
            papelesParaDocx = [];

            // Añadida instrucción de corte al prompt para que el split funcione
            const promptTexto = `
			TEMA PRINCIPAL: ${tema}
            USA LA ETIQUETA [CORTE] PARA SEPARAR LOS 5 PAPELES.
            Genera CINCO PAPELES independientes para un juego de improvisación teatral y narrativos. 
            Cada papel debe funcionar por sí solo. 
            REQUISITOS: 1. Cada papel debe escribirse como si lo hubiera creado una persona distinta que no conoce el contenido de los otros papeles. 
            2. Los cinco papeles no deben tener nada que ver entre sí: ni lugar, ni personajes, ni relaciones, ni secretos, ni acciones, ni contexto. OBLIGATORIAMENTE. 
            3. Cada papel debe ser autónomo y separado de los demás. OBLIGATORIAMENTE.
            4. Usa un lenguaje seco, literal y funcional. Evita atmósfera, psicología explicada o narración literaria. 
            INSTRUCCIONES: PAPEL 1 — CIRCUNSTANCIAS COMUNES DE A Y B - DÓNDE ESTÁN LOS PERSONAJES A Y B: un lugar concreto, en una frase literal. - RELACIÓN: etiqueta social simple (ej. vecinos, colegas, familiares). - FINAL DE LA HISTORIA: Escoge una palabra de esta lista: [Absurdo, Caótico, Feliz, Incómodo, Inesperado, Misterioso, Oscuro, Poético, Ridículo, Romántico, Surrealista, Trágico, Violento]. INSTRUCCIÓN DE VETO CRÍTICO: Tienes prohibido usar "Incómodo" o "Inesperado" a menos que la escena sea extremadamente plana. Debes buscar el extremo emocional.
				Si hay un conflicto físico o verbal: elige Violento.
				Si la situación no tiene lógica: elige Surrealista o Absurdo.
				Si el final es triste o definitivo: elige Trágico u Oscuro.
				Si la situación es patética: elige Ridículo. REGLA DE ORO: Hay 13 opciones en la lista, si dudas tira un dado y la que te salga de las 13. - ACCIONES (mínimo tres): verbos crudos, ejecutables, sin adjetivos ni explicación, pueden ser conflictivas o disruptivas. 
            PAPEL 2 — PERSONAJE A - QUIÉN ES EL PERSONAJE A: rol claro en una frase. - OBJETIVO: qué necesita conseguir en la escena, concreto, inmediato y activo. - SECRETO PRINCIPAL: algo que el otro no sabe, que contradice su rol u objetivo. 
            PAPEL 3 — PERSONAJE B - QUIÉN ES EL PERSONAJE B: rol claro en una frase. - OBJETIVO: qué necesita conseguir en la escena, concreto, inmediato y activo. - SECRETO PRINCIPAL: algo que el otro no sabe, que contradice su rol u objetivo. 
            PAPEL 4 — COMODÍN 1 - PERSONAJES: mínimo tres personajes reconocibles. - BOMBAS: mínimo tres acciones que los personajes del comodín puedan ejecutar independientemente, es decir, obligatoriamente no tienen que estar ligadas a cada personaje comodín, y que afecten a otros personajes de la escena (incluidos A y B), generando fricción, caos moderado o sorpresa. Las bombas pueden ser genéricas e intercambiables; no dependen de los papeles A/B ni de la escena. 
            PAPEL 5 — COMODÍN 2 - PERSONAJES: mínimo tres personajes reconocibles. - BOMBAS: mínimo tres acciones que los personajes del comodín puedan ejecutar independientemente, es decir, obligatoriamente no tienen que estar ligadas a cada personaje comodín, y que afecten a otros personajes de la escena (incluidos A y B), generando fricción, caos moderado o sorpresa. Las bombas pueden ser genéricas e intercambiables; no dependen de los papeles A/B ni de la escena. FORMATO DE SALIDA: - Mostrar los cinco papeles en bloques claramente separados por [CORTE]. - Usar listas breves. - No añadir comentarios finales.
            `;

            try {
                const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptTexto, temp: 0.8 })
                });

                const data = await response.json();
                let textoIA = data.candidates[0].content.parts[0].text;
                
                // Dividimos y limpiamos cada bloque
                const bloques = textoIA.split('[CORTE]').filter(b => b.trim().length > 10);

                bloques.forEach((bloque, i) => {
                    // Limpieza de asteriscos y formato (arregla el problema de los símbolos )
                    const limpio = bloque.replace(/[*#]/g, '').trim();
                    const titulo = `PAPEL ${i+1}`;
                    
                    papelesParaDocx.push(limpio); // Guardamos para el Word

                    // Pantalla
                    const divP = document.createElement('div');
                    divP.className = 'papel-preview';
                    divP.innerHTML = `<strong>${titulo}</strong>\n${limpio}`;
                    preview.appendChild(divP);

                    // Impresora
                    const divH = document.createElement('div');
                    divH.className = 'hoja-fisica';
                    divH.innerHTML = `<h2>${titulo}</h2><div>${limpio}</div>`;
                    impresionArea.appendChild(divH);
                });

                status.innerText = "Completado.";
                btnPrint.style.display = "inline-block";
                btnSave.style.display = "inline-block";

            } catch (err) {
                status.innerText = "Error de conexión.";
            } finally {
                btnGenerar.disabled = false;
            }
        };

        // CAMBIO 3: Función para generar el DOCX con secciones independientes (páginas separadas)
        function descargarDocx() {
            const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType, SectionType } = docx;

            const secciones = papelesParaDocx.map((texto, i) => ({
                properties: {
                    type: SectionType.NEXT_PAGE, // Salto de página garantizado
                },
                children: [
                    new Paragraph({
                        text: `PAPEL ${i + 1}`,
                        heading: HeadingLevel.HEADING_1,
                        alignment: AlignmentType.CENTER,
                        spacing: { after: 400 }
                    }),
                    ...texto.split('\n').map(linea => new Paragraph({
                        children: [
                            new TextRun({
                                text: linea.trim(),
                                font: "Courier New",
                                size: 24 // 12 pt
                            })
                        ],
                        spacing: { after: 200 }
                    }))
                ]
            }));

            const doc = new Document({ sections: secciones });

            Packer.toBlob(doc).then(blob => {
                saveAs(blob, "Papeles_Impro.docx");
            });
        }
    </script>
	
<hr class="noprint" style="margin-top: 40px; border-color: #ccc;">
    <div class="noprint" style="text-align: center; margin-top: 20px; padding-bottom: 20px;">
        <a href="index.html" style="
            text-decoration: none;
            color: #5f6368;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            transition: background-color 0.3s;
        ">
            Volver al Men&uacute; Principal
        </a>
    </div>

</body>
</html>
