<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Entradas - Ballena 60</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://script.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com;">

    <style id="antiClickjack">body{display:none !important;}</style>
    <script type="text/javascript">
        if (self === top) {
            var antiClickjack = document.getElementById("antiClickjack");
            antiClickjack.parentNode.removeChild(antiClickjack);
        } else {
            top.location = self.location;
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --acc: #e74c3c; 
            --hi: #2980b9; 
            --bg: #f4f7f6; 
            --card: #ffffff; 
            --text: #2c3e50; 
            --border: #dcdde1; 
        }
        body {
            font-family: 'Roboto', sans-serif; background: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .top-title { font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 20px; }
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-container img { max-width: 250px; height: auto; border-radius: 8px; }
        .logo-subtitle { text-align: center; margin-bottom: 40px; }
        .logo-subtitle a.handle { display: inline-block; font-weight: 700; color: var(--text); font-size: 1.1rem; margin-bottom: 4px; text-decoration: none; transition: color 0.3s ease; }
        .logo-subtitle a.handle:hover { color: var(--acc); }
        .logo-subtitle .location { display: block; color: #7f8c8d; font-size: 0.9rem; letter-spacing: 1px; }

        .event-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .event-card { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; transition: all 0.3s ease; cursor: pointer; }
        .event-card:hover { border-color: var(--hi); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .event-card.selected { border-color: var(--acc); border-width: 2px; background: #fffdfd; }
        
        .date { color: var(--hi); font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
        .event-card h3 { margin: 0 0 10px 0; font-size: 1.3rem; }
        .desc { font-size: 0.9rem; color: #636e72; line-height: 1.4; margin-bottom: 15px; }
        .stock { font-size: 0.8rem; color: #95a5a6; border-top: 1px solid var(--border); padding-top: 12px; }

        #reservation-form { width: 100%; max-width: 600px; margin-top: 40px; background: var(--card); padding: 30px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 50px; }
        #reservation-form h2 { margin-top:0; font-size: 1.4rem; color: var(--acc); border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-bottom: 20px; }
        label { font-size: 0.75rem; color: #7f8c8d; text-transform: uppercase; margin-bottom: 6px; display: block; font-weight: bold; }
        input, select { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        button { background: var(--acc); color: white; border: none; padding: 15px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background: #c0392b; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .loading { text-align: center; color: var(--hi); font-weight: bold; padding: 40px; }
    </style>
</head>
<body>

    <div class="top-title">Reserva de Entradas</div>
    <div class="logo-container">
        <img src="ballena60logo.webp" alt="Ballena 60 Logo">
    </div>
    <div class="logo-subtitle">
        <a href="https://www.instagram.com/laballena_60/" target="_blank" class="handle">@laballena_60</a>
        <span class="location">Espacio Creativo · Palencia</span>
    </div>

    <div class="event-grid" id="grid-eventos">
        <div class="loading">Cargando cartelera...</div>
    </div>

    <div id="reservation-form">
        <h2>CONFIRMAR RESERVA</h2>
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div>
                <label>Evento Seleccionado</label>
                <input type="text" id="form-evento" readonly style="background: #f9f9f9;" placeholder="Selecciona un show arriba">
            </div>
            <div>
                <label>Tu Email</label>
                <input type="email" id="form-email" placeholder="ejemplo@correo.com" required>
            </div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <div style="flex: 2; min-width: 200px;">
                    <label>Nombre Completo</label>
                    <input type="text" id="form-nombre" placeholder="Nombre y apellidos">
                </div>
                <div style="flex: 1; min-width: 140px;">
                    <label>Nº Entradas</label>
                    <select id="form-cantidad">
                        <option value="1">1 Persona</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option>
                    </select>
                </div>
            </div>
            <button id="btn-reservar" onclick="enviarReserva()">Reservar Ahora</button>
            <p id="msg-error" style="color: var(--acc); font-size: 0.8rem; font-weight: bold; display: none; text-align: center;"></p>
        </div>
    </div>

    <script>
        const URL_GAS = 'https://script.google.com/macros/s/AKfycbx5rNtvIJ3A3cuYmlyefGfOsRbE2ggjCbi457k01tVe1wh7encLurCAQRKaFiqvqYtCLQ/exec';
        let datosEventos = [];
        let eventoSeleccionado = null;

        window.onload = () => { cargarEventosDesdeExcel(); };

        function formatearFecha(fechaSucia) {
            const fecha = new Date(fechaSucia);
            if (isNaN(fecha.getTime())) return fechaSucia;
            return fecha.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + 'h';
        }

        async function cargarEventosDesdeExcel() {
            const grid = document.getElementById('grid-eventos');
            try {
                const response = await fetch(URL_GAS, { method: 'GET', redirect: 'follow' });
                datosEventos = await response.json();
                grid.textContent = ""; 

                datosEventos.forEach(ev => {
                    const agotado = ev.stock <= 0;
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    card.id = `ev-${ev.id}`;
                    
                    const h3 = document.createElement('h3');
                    h3.textContent = ev.nombre;
                    if(agotado) h3.style.textDecoration = "line-through";

                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date';
                    dateDiv.textContent = formatearFecha(ev.fecha);

                    const descP = document.createElement('p');
                    descP.className = 'desc';
                    descP.textContent = ev.desc;

                    const stockDiv = document.createElement('div');
                    stockDiv.className = 'stock';
                    stockDiv.textContent = `Disponibles: ${agotado ? 'AGOTADO' : ev.stock}`;

                    card.appendChild(dateDiv);
                    card.appendChild(h3);
                    card.appendChild(descP);
                    card.appendChild(stockDiv);

                    card.onclick = () => agotado ? alert("Agotado") : seleccionarEvento(ev);
                    grid.appendChild(card);
                });
            } catch (e) { 
                grid.textContent = "Error al conectar con el servidor."; 
            }
        }

        function seleccionarEvento(ev) {
            eventoSeleccionado = ev;
            document.querySelectorAll('.event-card').forEach(c => c.classList.remove('selected'));
            const el = document.getElementById(`ev-${ev.id}`);
            if(el) el.classList.add('selected');
            document.getElementById('form-evento').value = ev.nombre;
            validarStock();
        }

        document.getElementById('form-cantidad').onchange = validarStock;

        function validarStock() {
            const btn = document.getElementById('btn-reservar');
            const msgError = document.getElementById('msg-error');
            const cantidad = parseInt(document.getElementById('form-cantidad').value);

            if (eventoSeleccionado) {
                if (cantidad > eventoSeleccionado.stock) {
                    btn.disabled = true;
                    msgError.style.display = "block";
                    msgError.textContent = `Solo quedan ${eventoSeleccionado.stock} disponibles.`;
                } else {
                    btn.disabled = false;
                    msgError.style.display = "none";
                }
            }
        }

        async function enviarReserva() {
            const nombre = document.getElementById('form-nombre').value.trim();
            const email = document.getElementById('form-email').value.trim();
            const evento = document.getElementById('form-evento').value;
            const cantidad = parseInt(document.getElementById('form-cantidad').value);
            const btn = document.getElementById('btn-reservar');

            if(!nombre || !email || !evento) return alert("Por favor, rellena todos los campos.");

            btn.disabled = true;
            btn.textContent = "Confirmando...";

            try {
                await fetch(URL_GAS, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ nombre, email, evento, entradas: cantidad })
                });
                alert("¡Petición enviada! Revisa tu email para la confirmación final.");
                location.reload();
            } catch (e) {
                alert("Error de conexión.");
                btn.disabled = false;
                btn.textContent = "Reservar Ahora";
            }
        }
    </script>
</body>
</html>
