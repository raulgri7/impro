<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Bases de Impro</title>
    <style>
        :root {
            --madera: #8B4513;
            --madera-oscura: #65340f;
            --crema: #f8f0e3;
            --naranja: #f90;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            padding: 20px; 
            max-width: 700px; 
            margin: 0 auto; 
            background-color: #f4f7f6; 
            color: #333;
        }

        h1 { color: var(--madera); text-align: center; border-bottom: 3px double var(--madera); padding-bottom: 10px; }

        #temperature-control {
            margin-bottom: 25px; padding: 20px; border: 1px solid #ddd;
            border-radius: 12px; background-color: #fff;
        }

        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--madera); }

        .btn-principal { 
            display: block; width: 100%; padding: 18px; background-color: var(--madera); 
            color: white; border: none; border-radius: 8px; cursor: pointer; 
            font-size: 1.2em; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 4px 0 var(--madera-oscura); transition: all 0.2s;
        }

        .btn-principal:hover { background-color: var(--madera-oscura); transform: translateY(-2px); }
        .btn-principal:disabled { background-color: #ccc; box-shadow: none; cursor: not-allowed; }

        #resultado { margin-top: 30px; }

        .card {
            background-color: var(--crema); border: 2px solid var(--madera);
            border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .label-top { 
            display: inline-block; background: var(--madera); color: white;
            padding: 2px 10px; border-radius: 4px; font-size: 0.8em; font-weight: bold;
            margin-bottom: 8px; text-transform: uppercase;
        }

        .personajes-box {
            font-size: 1.4em; font-weight: 700; color: #000; margin-bottom: 20px;
            line-height: 1.2;
        }

        .lugar-item {
            display: flex; align-items: center; margin-bottom: 10px;
            padding: 12px; background: white; border-radius: 8px; 
            border-left: 5px solid var(--naranja);
        }

        .lugar-tag { min-width: 120px; font-weight: bold; font-size: 0.7em; color: var(--madera); }
        .cargando { display: block; text-align: center; color: var(--madera); font-weight: bold; padding: 20px; }
    </style>
</head>
<body>

    <h1>Bases de Impro &#128161;</h1>
    
    <div id="temperature-control">
        <label style="font-weight: bold; display: block; margin-bottom: 10px;">Creatividad:</label>
        <input type="range" id="temp-slider" min="0.1" max="1.0" step="0.1" value="0.8">
        <div style="display: flex; justify-content: space-between; font-size: 0.8em; margin-top: 8px;">
            <span>Cl&aacute;sico</span>
            <span>Equilibrado</span>
            <span>Locura</span>
        </div>
    </div>

    <button id="btn-gen" class="btn-principal" onclick="generarImpro()">Generar Nueva Base</button>
    
    <div id="resultado"></div>

    <script>
        async function generarImpro() {
            const resultadoDiv = document.getElementById('resultado');
            const btn = document.getElementById('btn-gen');
            const temp = parseFloat(document.getElementById('temp-slider').value);
            
            btn.disabled = true;
            resultadoDiv.innerHTML = '<span class="cargando">Generando escena...</span>';
            
            const promptStr = "Eres un experto en impro. Genera 4 puntos numerados. 1. Relacion de personajes. 2. Lugar surrealista. 3. Lugar cotidiano con giro loco. 4. Lugar muy aburrido. Sin introducciones ni saludos.";

            try {
                const response = await fetch('https://generador-impro.raul-grigelmo3.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: promptStr,
                        temp: temp
                    })
                });

                const data = await response.json();
                let texto = data.candidates?.[0]?.content?.parts?.[0]?.text || "";

                // FILTRO: Solo l¨ªneas que empiecen con "1.", "2.", etc. para saltar saludos de la IA
                const lineasRaw = texto
                    .replace(/\*\*/g, '')
                    .split('\n')
                    .map(l => l.trim())
                    .filter(l => /^[1-4][\.\)]/.test(l));

                const limpiar = (t) => t ? t.replace(/^[1-4][\.\)\s-]*/, '').trim() : "";

                const final = [
                    limpiar(lineasRaw[0]) || "Dos desconocidos con un secreto.",
                    limpiar(lineasRaw[1]) || "Un lugar magico.",
                    limpiar(lineasRaw[2]) || "Un sitio extrano.",
                    limpiar(lineasRaw[3]) || "Una sala de espera."
                ];

                // Pintamos el HTML usando c¨®digos para las tildes y signos
                resultadoDiv.innerHTML = `
                    <div class="card">
                        <div class="label-top">&iquest;Qui&eacute;nes son?</div>
                        <div class="personajes-box">${final[0]}</div>
                        
                        <div class="label-top">&iquest;D&oacute;nde est&aacute;n?</div>
                        <div class="lugar-item">
                            <div class="lugar-tag">SURREALISTA</div>
                            <div>${final[1]}</div>
                        </div>
                        <div class="lugar-item">
                            <div class="lugar-tag">GIRO C&Oacute;MICO</div>
                            <div>${final[2]}</div>
                        </div>
                        <div class="lugar-item" style="border-left-color: #ccc;">
                            <div class="lugar-tag" style="color:#888">ABURRIDO</div>
                            <div>${final[3]}</div>
                        </div>
                    </div>
                `;

            } catch (error) {
                resultadoDiv.innerHTML = `<div style="color:red; text-align:center;">Error de conexi&oacute;n</div>`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>

    <div style="text-align: center; margin-top: 40px;">
        <a href="index.html" style="text-decoration: none; color: #888; border-bottom: 1px solid;">
            &larr; Volver al Men&uacute;
        </a>
    </div>
</body>
</html>
