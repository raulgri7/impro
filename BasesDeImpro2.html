<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Situaciones de Improvisaci&oacute;n</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #0056b3;
            text-align: center;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        #generarBtn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            color: #fff;
            background-color: #28a745;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }
        #generarBtn:hover {
            background-color: #218838;
        }
        #generarBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .loading {
            text-align: center;
            font-style: italic;
            color: #6c757d;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.5; } }

        .situacion {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            background-color: #e9e9e9;
            border-left: 5px solid #0056b3;
        }
        .situacion h2 {
            margin-top: 0;
            color: #333;
            font-size: 1.1em;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .quienes, .donde, .locura {
            display: block;
            margin-top: 8px;
        }
        .quienes { font-weight: bold; color: #007bff; }
        .donde { font-weight: bold; color: #6c757d; }
        .locura { 
            font-style: italic; 
            color: #dc3545; 
            border-top: 1px dashed #ccc; 
            padding-top: 8px; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generador de Ideas de Improvisaci&oacute;n</h1>

        <button id="generarBtn" onclick="generarSituaciones()">Generar 5 Situaciones con la IA</button>

        <div id="resultados">
            <p style="text-align: center; color: #6c757d;">Pulsa el bot&oacute;n para generar las situaciones.</p>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://generador-impro.raul-grigelmo3.workers.dev';

        async function generarSituaciones() {
            const resultadosDiv = document.getElementById('resultados');
            const generarBtn = document.getElementById('generarBtn');

            resultadosDiv.innerHTML = '<div class="loading">Contactando con la IA y redactando ideas...</div>';
            generarBtn.disabled = true;

            const promptTexto = "Genera 5 situaciones de improvisacion para dos personas. " +
                                "Formato para cada una: " +
                                "QUIENES: [quienes son] / " +
                                "DONDE: [lugar] / " +
                                "LOCURA: [nivel 1-5]. " +
                                "Asegurate de separar cada una de las 5 situaciones con el delimitador exacto &&&";

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: promptTexto }] }],
                        generationConfig: { temperature: 0.85 }
                    })
                });

                const data = await response.json();
                const textoIA = data.candidates[0].content.parts[0].text;
                mostrarResultados(textoIA);

            } catch (error) {
                resultadosDiv.innerHTML = '<p style="color:red; text-align:center;">Error al conectar. Intentalo de nuevo.</p>';
            } finally {
                generarBtn.disabled = false;
            }
        }

        function mostrarResultados(texto) {
            const resultadosDiv = document.getElementById('resultados');
            const bloques = texto.split('&&&').filter(b => b.trim().length > 10);
            
            let html = '';
            bloques.forEach((bloque, index) => {
                const lineas = bloque.trim().split('\n');
                let quienes = "No especificado";
                let donde = "No especificado";
                let locura = "1/5";

                lineas.forEach(l => {
                    // Limpiamos posibles caracteres de formato Markdown como * o -
                    let limpia = l.replace(/^[\s*-]+/, ''); 
                    
                    if (limpia.toUpperCase().startsWith('QUIENES:')) quienes = limpia.split(':')[1] || quienes;
                    if (limpia.toUpperCase().startsWith('DONDE:')) donde = limpia.split(':')[1] || donde;
                    if (limpia.toUpperCase().startsWith('LOCURA:')) locura = limpia.split(':')[1] || locura;
                });

                html += `
                    <div class="situacion">
                        <h2>Situaci&oacute;n #${index + 1}</h2>
                        <span class="quienes">&#127917; ${quienes.trim()}</span>
                        <span class="donde">&#128205; ${donde.trim()}</span>
                        <p class="locura">Nivel de Locura: ${locura.trim()}</p>
                    </div>
                `;
            });

            resultadosDiv.innerHTML = html || '<p>Error en el formato de respuesta. Prueba otra vez.</p>';
        }
    </script>

    <div style="text-align: center; margin-top: 20px; padding-bottom: 20px;">
        <a href="index.html" style="text-decoration: none; color: #5f6368; font-weight: bold; padding: 10px 20px; border: 1px solid #ccc; border-radius: 5px;">
            &larr; Volver al Men&uacute; Principal
        </a>
    </div>

</body>
</html>
