<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meowdoku</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #a0a0a0;
      margin-top: 2px;
    }

    /* BARRA DE HERRAMIENTAS Y CONFIGURACIÓN */
    .toolbar {
      width: 100%;
      max-width: 450px;
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .size-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-selector label {
      font-size: 13px;
      font-weight: bold;
      color: #a0a0a0;
    }

    .size-selector select {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #333;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .tool-mode {
      display: flex;
      gap: 6px;
    }

    .tool-btn {
      background-color: #2a2a2a;
      color: #fff;
      border: 2px solid transparent;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tool-btn.active {
      border-color: #8b5cf6;
      background-color: #3b2d54;
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.4);
    }

    /* CONTENEDOR DEL TABLERO */
    .board-container {
      width: 100%;
      max-width: 450px;
      aspect-ratio: 1 / 1;
      background-color: #1e1e1e;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    #board {
      display: grid;
      gap: 4px;
      width: 100%;
      height: 100%;
      background: #121212;
      padding: 4px;
      border-radius: 12px;
      user-select: none;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      cursor: pointer;
      border-radius: 6px;
      transition: transform 0.05s ease, background-color 0.2s;
    }

    .cell:active {
      transform: scale(0.94);
    }

    .cell.error {
      animation: pulse-red 0.8s infinite alternate;
      box-shadow: inset 0 0 0 3px #ef4444;
    }

    .cell.x-mark::after {
      content: "✕";
      font-size: 1.2rem;
      color: #475569;
      font-weight: 900;
    }

    /* MENSAJE DE ESTADO */
    .status-bar {
      width: 100%;
      max-width: 450px;
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
      font-size: 14px;
      min-height: 20px;
      color: #cbd5e1;
    }

    .status-bar.win { color: #22c55e; }
    .status-bar.error-msg { color: #ef4444; }

    /* BOTONES INFERIORES */
    .bottom-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .next-btn {
      background: linear-gradient(180deg, #8b5cf6 0%, #6d28d9 100%);
      color: #ffffff;
    }

    .reset-btn {
      background: #2a2a2a;
      color: #ffffff;
      max-width: 100px;
    }

    @keyframes pulse-red {
      from { background-color: #fca5a5; }
      to { background-color: #ef4444; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🐱 Meowdoku</h1>
    <div class="subtitle">1 gato por fila, columna y región de color (¡sin tocarse!)</div>
  </header>

  <!-- BARRA SUPERIOR DE HERRAMIENTAS Y TAMAÑO -->
  <div class="toolbar">
    <div class="size-selector">
      <label for="gridSize">Matriz:</label>
      <select id="gridSize">
        <option value="5">5 x 5</option>
        <option value="6" selected>6 x 6</option>
        <option value="7">7 x 7</option>
      </select>
    </div>

    <div class="tool-mode">
      <button class="tool-btn active" id="toolCat">🐱 Gato</button>
      <button class="tool-btn" id="toolX">❌ X</button>
    </div>
  </div>

  <!-- LIENZO / TABLERO DEL JUEGO -->
  <div class="board-container">
    <div id="board"></div>
  </div>

  <!-- MENSAJE DE ESTADO -->
  <div class="status-bar" id="statusBar">Cargando tablero...</div>

  <!-- BOTONES INFERIORES -->
  <div class="bottom-bar">
    <button class="action-btn reset-btn" id="resetBtn">🔄 Limpiar</button>
    <button class="action-btn next-btn" id="nextLevelBtn">✨ NUEVO NIVEL IA</button>
  </div>

  <script>
    // Paleta de colores para las regiones (Tonos oscuros/contrastados para el tema dark)
    const REGION_COLORS = [
      '#5b21b6', '#1e3a8a', '#065f46', '#831843',
      '#7c2d12', '#365314', '#1e1b4b', '#701a75'
    ];

    let N = 6;
    let regions = [];
    let state = []; // 0: vacía, 1: X, 2: Gato
    let currentTool = 2; // 2 = Gato, 1 = X

    const boardEl = document.getElementById("board");
    const statusBar = document.getElementById("statusBar");
    const gridSizeSelect = document.getElementById("gridSize");

    // -------------------------------------------------------------
    // 1. LLAMADA AL WORKER (Mismo origen '/')
    // -------------------------------------------------------------
    async function fetchBoardFromIA() {
      N = parseInt(gridSizeSelect.value, 10);
      statusBar.className = "status-bar";
      statusBar.textContent = "⌛ IA creando tablero...";

      const promptText = `Genera un juego tipo Meowdoku/Queens de tamaño ${N}x${N}. Devuelve ÚNICAMENTE un objeto JSON sin formato markdown con la estructura: {"regions": [[0,0,1...], ...]} asignando a cada casilla una región de 0 a ${N-1}. El tablero debe tener una solución válida con exactamente 1 gato por fila, columna y región sin estar juntos ni en diagonal.`;

      try {
        const response = await fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });

        if (!response.ok) throw new Error("Error en respuesta de Worker");

        const data = await response.json();
        
        // Extraer texto plano y limpiar markdown si viene envuelto
        let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || data.text || data.response || JSON.stringify(data);
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();

        const parsed = JSON.parse(rawText);

        if (parsed.regions && parsed.regions.length === N) {
          regions = parsed.regions;
          initGame();
          statusBar.textContent = "¡Nuevo nivel listo!";
          return;
        }
      } catch (err) {
        console.warn("Fallo o latencia en Worker, usando nivel local de respaldo:", err);
      }

      // Si el worker falla o tarda, genera uno instantáneo de respaldo
      generateFallbackLevel();
      initGame();
      statusBar.textContent = "Nivel listo (Modo offline)";
    }

    // Nivel por defecto rápido
    function generateFallbackLevel() {
      regions = Array(N).fill(null).map(() => Array(N).fill(0));
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          regions[r][c] = Math.floor((r * N + c) / N);
        }
      }
    }

    // -------------------------------------------------------------
    // 2. LÓGICA Y RENDERIZADO DEL TABLERO
    // -------------------------------------------------------------
    function initGame() {
      state = Array(N).fill(null).map(() => Array(N).fill(0));
      renderBoard();
      validateBoard();
    }

    function renderBoard() {
      boardEl.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
      boardEl.style.gridTemplateRows = `repeat(${N}, 1fr)`;
      boardEl.innerHTML = '';

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const regionId = regions[r][c] % REGION_COLORS.length;
          cell.style.backgroundColor = REGION_COLORS[regionId];

          cell.addEventListener('click', () => handleCellClick(r, c));
          cell.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            handleCellRightClick(r, c);
          });

          boardEl.appendChild(cell);
        }
      }
      updateBoardView();
    }

    function handleCellClick(r, c) {
      state[r][c] = state[r][c] === currentTool ? 0 : currentTool;
      updateBoardView();
      validateBoard();
    }

    function handleCellRightClick(r, c) {
      state[r][c] = state[r][c] === 1 ? 0 : 1;
      updateBoardView();
      validateBoard();
    }

    function updateBoardView() {
      const cells = boardEl.children;
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          const idx = r * N + c;
          const cell = cells[idx];
          const val = state[r][c];

          cell.innerText = val === 2 ? '🐱' : '';
          cell.classList.toggle('x-mark', val === 1);
        }
      }
    }

    // -------------------------------------------------------------
    // 3. VALIDACIÓN DE REGLAS MEOWDOKU
    // -------------------------------------------------------------
    function validateBoard() {
      const cells = boardEl.children;
      let hasErrors = false;
      let catCount = 0;

      for (let i = 0; i < cells.length; i++) {
        cells[i].classList.remove('error');
      }

      const cats = [];
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (state[r][c] === 2) {
            cats.push({ r, c, region: regions[r][c] });
            catCount++;
          }
        }
      }

      for (let i = 0; i < cats.length; i++) {
        for (let j = i + 1; j < cats.length; j++) {
          const c1 = cats[i];
          const c2 = cats[j];

          const sameRow = c1.r === c2.r;
          const sameCol = c1.c === c2.c;
          const sameRegion = c1.region === c2.region;
          const isAdjacent = Math.abs(c1.r - c2.r) <= 1 && Math.abs(c1.c - c2.c) <= 1;

          if (sameRow || sameCol || sameRegion || isAdjacent) {
            hasErrors = true;
            cells[c1.r * N + c1.c].classList.add('error');
            cells[c2.r * N + c2.c].classList.add('error');
          }
        }
      }

      statusBar.className = "status-bar";

      if (hasErrors) {
        statusBar.classList.add('error-msg');
        statusBar.textContent = "⚠️ Hay gatos que se pelean";
      } else if (catCount === N) {
        statusBar.classList.add('win');
        statusBar.textContent = "🎉 ¡Felicidades! Meowdoku resuelto.";
      } else {
        statusBar.textContent = `Gatos colocados: ${catCount} / ${N}`;
      }
    }

    // -------------------------------------------------------------
    // 4. EVENTOS Y HERRAMIENTAS
    // -------------------------------------------------------------
    document.getElementById("toolCat").addEventListener("click", () => {
      currentTool = 2;
      document.getElementById("toolCat").classList.add("active");
      document.getElementById("toolX").classList.remove("active");
    });

    document.getElementById("toolX").addEventListener("click", () => {
      currentTool = 1;
      document.getElementById("toolX").classList.add("active");
      document.getElementById("toolCat").classList.remove("active");
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      state = Array(N).fill(null).map(() => Array(N).fill(0));
      updateBoardView();
      validateBoard();
    });

    document.getElementById("nextLevelBtn").addEventListener("click", fetchBoardFromIA);

    gridSizeSelect.addEventListener("change", fetchBoardFromIA);

    // Arrancar el primer tablero
    fetchBoardFromIA();
  </script>
</body>
</html>
