<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20Q - Adivina lo que piensas 🧠</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #1e293b;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 2px solid #334155;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #334155;
        }

        .titulo {
            font-size: 1.4rem;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .contador {
            background: #0f172a;
            color: #fbbf24;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border: 1px solid #334155;
        }

        .pantalla-pregunta {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
            color: #f8fafc;
            margin-bottom: 25px;
        }

        .intentos-badge {
            display: inline-block;
            background: #e11d48;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .grid-respuestas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            border: none;
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
        }

        .btn:active { transform: scale(0.96); }

        .btn-si { background: #22c55e; color: white; }
        .btn-no { background: #ef4444; color: white; }
        .btn-aveces { background: #f59e0b; color: white; }
        .btn-nose { background: #64748b; color: white; }

        .btn-reiniciar {
            background: #38bdf8;
            color: #0f172a;
            grid-column: span 2;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .loading {
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="titulo">20 QUESTIONS IA</div>
            <div id="contador" class="contador">Pregunta 1/20</div>
        </div>

        <div id="badge-intento" style="display: none;"></div>

        <div id="pantalla" class="pantalla-pregunta">
            Piensa en un objeto, animal, personaje o concepto... ¡y pulsa Empezar cuando estés listo!
        </div>

        <div id="controles" class="grid-respuestas">
            <button id="btn-main" class="btn btn-reiniciar" onclick="iniciarJuego()">¡Empezar a jugar!</button>
        </div>
    </div>

    <script>
        const URL_WORKER = 'https://generador-impro.raul-grigelmo3.workers.dev';
        
        let numPregunta = 0;
        let historial = [];
        let modoAdivinar = false;
        let primerIntentoFallado = false;

        function iniciarJuego() {
            numPregunta = 1;
            historial = [];
            modoAdivinar = false;
            primerIntentoFallado = false;
            
            document.getElementById('badge-intento').style.display = 'none';
            document.getElementById('contador').innerText = `Pregunta 1/20`;
            
            siguientePaso();
        }

        async function siguientePaso() {
            mostrarCargando();

            // Evaluar si toca hacer hipótesis (Pregunta 20 o Pregunta 25)
            if (numPregunta === 20 || (primerIntentoFallado && numPregunta === 25)) {
                modoAdivinar = true;
            } else {
                modoAdivinar = false;
            }

            const prompt = construirPrompt();

            try {
                const response = await fetch(URL_WORKER, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const resultado = JSON.parse(rawText);
                renderizarPaso(resultado);

            } catch (e) {
                document.getElementById('pantalla').innerText = 'Error al conectar con la IA. Reintentando...';
                mostrarBotonReiniciar();
            }
        }

        function construirPrompt() {
            const contextoHistorial = historial.map((h, i) => `P${i+1}: ${h.pregunta} -> Respuesta: ${h.respuesta}`).join('\n');

            if (modoAdivinar) {
                return `Actúas como el juego 20Q (20 Preguntas). Basándote estrictamente en este historial de respuestas:
                ${contextoHistorial}

                Debes arriesgarte y hacer tu MEJOR PREDICCIÓN de lo que el usuario está pensando.
                Devuelve ÚNICAMENTE un JSON válido sin markdown con esta estructura:
                {
                  "es_prediccion": true,
                  "texto": "¿Estás pensando en [TU PREDICCIÓN CONCRETA]?"
                }`;
            } else {
                return `Actúas como el juego 20Q (20 Preguntas). Vas por la pregunta número ${numPregunta}.
                Historial hasta ahora:
                ${contextoHistorial}

                Haz la SIGUIENTE PREGUNTA inteligente de Sí/No para acorralar el objeto/concepto pensado.
                Devuelve ÚNICAMENTE un JSON válido sin markdown con esta estructura:
                {
                  "es_prediccion": false,
                  "texto": "Texto de la pregunta aquí..."
                }`;
            }
        }

        function renderizarPaso(datos) {
            const pantalla = document.getElementById('pantalla');
            const controles = document.getElementById('controles');
            const contador = document.getElementById('contador');

            pantalla.innerText = datos.texto;

            if (modoAdivinar) {
                const badge = document.getElementById('badge-intento');
                badge.style.display = 'inline-block';
                badge.innerText = primerIntentoFallado ? 'SEGUNDO INTENTO FINAL (P25)' : 'PRIMER INTENTO (P20)';
                
                contador.innerText = primerIntentoFallado ? 'Pregunta 25/25' : 'Pregunta 20/20';

                controles.innerHTML = `
                    <button class="btn btn-si" onclick="resolverPrediccion(true)">¡SÍ! ¡HAS ACERTADO! 🎉</button>
                    <button class="btn btn-no" onclick="resolverPrediccion(false)">NO, HAS FALLADO ❌</button>
                `;
            } else {
                contador.innerText = `Pregunta ${numPregunta}/${primerIntentoFallado ? '25' : '20'}`;
                
                controles.innerHTML = `
                    <button class="btn btn-si" onclick="responder('Sí')">Sí</button>
                    <button class="btn btn-no" onclick="responder('No')">No</button>
                    <button class="btn btn-aveces" onclick="responder('A veces / A medias')">A veces</button>
                    <button class="btn btn-nose" onclick="responder('No lo sé')">No lo sé</button>
                `;
            }
        }

        function responder(respuesta) {
            const textoPregunta = document.getElementById('pantalla').innerText;
            historial.push({ pregunta: textoPregunta, respuesta: respuesta });
            
            numPregunta++;
            siguientePaso();
        }

        function resolverPrediccion(acertado) {
            const pantalla = document.getElementById('pantalla');
            
            if (acertado) {
                pantalla.innerText = `¡LA MÁQUINA GANA! 🧠✨ He adivinado tu pensamiento en la pregunta ${numPregunta}.`;
                mostrarBotonReiniciar();
            } else {
                if (!primerIntentoFallado) {
                    // Falló en la 20. Le damos bonus hasta la 25.
                    primerIntentoFallado = true;
                    historial.push({ pregunta: pantalla.innerText, respuesta: "Predicción incorrecta en P20" });
                    
                    alert("¡Vaya! He fallado en la pregunta 20. Dame 5 preguntas más (hasta la 25) para mi segunda oportunidad.");
                    numPregunta = 21;
                    siguientePaso();
                } else {
                    // Falló en la 25. ¡Ha perdido la máquina!
                    pantalla.innerText = "¡ME HAS VENCIDO! 🎉🤖 No he sido capaz de adivinarlo en 25 preguntas. ¡Enhorabuena!";
                    mostrarBotonReiniciar();
                }
            }
        }

        function mostrarCargando() {
            document.getElementById('pantalla').innerText = 'Pensando la siguiente pregunta... 🧠';
            document.getElementById('controles').innerHTML = `<div class="loading" style="grid-column: span 2;">Analizando respuestas previas...</div>`;
        }

        function mostrarBotonReiniciar() {
            document.getElementById('badge-intento').style.display = 'none';
            document.getElementById('controles').innerHTML = `
                <button class="btn btn-reiniciar" onclick="iniciarJuego()">Jugar otra partida</button>
            `;
        }
    </script>
</body>
</html>
